# The view is keyed on id, a field of the document, which is what a business key is: the ordinary
# case, and the one a target keyed on the source's own identity cannot use.
# A MongoDB delete carries the document key alone. The image of the document before the change is
# what puts the deleted document's own fields into the event, and the connector asks its change
# stream for that image only when the preImage setting its own node form declares is on - so this
# is the witness that a setting a connector declares for its node reaches it at all. Without it the
# delete has nothing to build a filter from and the whole run fails on that one event.
# Snapshot, insert and update are separate delivery witnesses, and they come first on purpose: they
# prove the change stream is live and carrying before anything is deleted, so the delete is judged
# on the setting rather than on a race with the stream that arranges the image.
# The run is asserted still RUNNING at the end: this failure takes the pipeline down rather than
# the one event, so a green count with a FAILED pipeline is the shape to refuse.
name: a-mongo-delete-reaches-a-view-keyed-on-a-document-field
setup:
  databases:
    src_store: { kind: mongo }
    store: { kind: mongo }
  connectors: [mongodb]
  apply: [src_store.tap.yml, views.tap.yml, pipeline.tap.yml]
  discover: [src_store]
pipeline: pipeline.tap.yml
seed:
  src_store.orders: { rows: 12 }
steps:
  - start
  - await: { count: { views.order_state: 12 } }
  - await: { doc: { views.order_state: { where: { id: 5 }, expect: { seq: 5 } } } }
  - cdc: { src_store.orders: insert 3 }
  - await: { count: { views.order_state: 15 } }
  - cdc: { src_store.orders: { update: { where: { id: 5 }, set: { seq: 505 } } } }
  - await: { doc: { views.order_state: { where: { id: 5 }, expect: { seq: 505 } } } }
  - cdc: { src_store.orders: { delete: { where: { id: 1 } } } }
  - await: { count: { views.order_state: 14 } }
  - assert: { doc: { views.order_state: { where: { id: 5 }, expect: { seq: 505 } } } }
  - assert: { state: RUNNING }
