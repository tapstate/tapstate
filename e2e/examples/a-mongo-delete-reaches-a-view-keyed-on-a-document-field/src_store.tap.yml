version: tapstate/v1
kind: source
id: src_store
connector: mongodb
config:
  uri: "${SRC_STORE_URI}"
  # The connector's own node form declares this switch, and its change stream asks for the image of
  # the document before a change only when it is on. A view keyed on a field of the document has
  # nothing else to identify a deleted document by.
  preImage: true
mode: cdc
tables: [ orders ]
