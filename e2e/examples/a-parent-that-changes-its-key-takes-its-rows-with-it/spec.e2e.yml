# The seed vocabulary carries scalar columns. This map constructs a list from the source revision
# on both event images; changing that revision changes the actual list reaching unwind. The real
# MySQL change stream supplies full before images, and Mongo reads verify the resulting write keys.
name: a-parent-that-changes-its-key-takes-its-rows-with-it
setup:
  databases:
    src: { kind: mysql }
    tgt: { kind: mongo }
  connectors: [mysql, mongodb]
  apply: [src_mysql.tap.yml, tgt_mongo.tap.yml, pipeline.tap.yml]
  discover: [src_mysql]
pipeline: pipeline.tap.yml
seed:
  src_mysql.orders:
    values:
      - { id: 1, customer: ada, revision: 0 }
steps:
  - start
  - await: { count: { tgt_mongo.orders: 2 } }
  - await: { doc: { tgt_mongo.orders: { where: { id: 1, sku: a }, expect: { customer: ada, items.sku: a } } } }
  - await: { doc: { tgt_mongo.orders: { where: { id: 1, sku: b }, expect: { customer: ada, items.sku: b } } } }
  # Only the parent key changes. Pairing by element value leaves two old-key orphans.
  - cdc: { src_mysql.orders: { update: { where: { id: 1 }, set: { id: 9 } } } }
  - await: { doc: { tgt_mongo.orders: { where: { id: 9, sku: a }, expect: { customer: ada, items.sku: a } } } }
  - await: { doc: { tgt_mongo.orders: { where: { id: 9, sku: b }, expect: { customer: ada, items.sku: b } } } }
  - await: { count: { tgt_mongo.orders: 2 } }
  # Every expected key is present; the exact count leaves no room for stale rows.
  - assert: { state: RUNNING }
