version: tapstate/v1
kind: pipeline
id: wallet_transactions
source: src_wallet
settings: { read_mode: snapshot_only }
transforms:
  - id: transaction_doc
    type: nest
    from: { t: transactions, i: items, pd: prize_definitions, r: ratings }
    root:
      from: t
      key: [ id ]
      embed:
        - from: i
          on: { transaction_id: id }
          as: array
          path: item_movement
          arrayKey: [ id ]
          embed:
            - { from: pd, on: { id: prize_definition_id }, as: object, path: prize_definition }
          rollup:
            qty:        { sum: $amount, default: 0 }
            amount:     { sum: "=after.amount * after.prize_definition.prize_value", default: 0 }
            reward_qty: { sum: $amount, filter: "=after.prize_definition.prize_code == 'reward-points'" }
        - from: r
          on: { trans_id: id }
          as: rollup
          arrayKey: [ id ]
          rollup:
            latest_score: { last: { value: $score, by: [ $model_date, $rating_type ] } }
view:
  id: transaction_state
  from: transaction_doc
  primary_key: id
