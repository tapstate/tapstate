# One dimension row with four hundred orders under it, changed once -- and then nothing else is fed.
#
# The claim is about what happens after the input stops. A dimension change owes every fact row under
# it, and four hundred rows do not leave the operator in one go: it hands back control part way and has
# to pick the rest up with nothing arriving. If it only makes progress when something is delivered to
# it, the target sits permanently half old and half new. That state reports nothing -- the job is
# RUNNING, no error is counted, and the rows that did update look exactly right.
#
# Nothing is fed after the change on purpose. The source is a change stream, so it stays open and idle;
# every reading below is therefore about progress made with no input at all.
#
# What the assertions have to discriminate:
#
# - The count before the change is the control: four hundred rows are actually there to be revisited,
#   so a run that converges trivially because it never built them fails first.
# - Three orders are read after the change and they are deliberately the first, one in the middle and
#   the last of the seeded range. An operator that stops part way satisfies whichever end it reached
#   and fails the other, whichever direction it walks the bucket in.
# - The count is read again at the end and has not grown. A recompute that re-inserted rather than
#   updated leaves eight hundred rows, which no per-row reading would notice.
# - One order belongs to a different customer throughout and is read at both ends, so an
#   implementation that answered the change by rewriting everything is refused too.
#
# Runs only where real connector jars are available: naming no -Dtapstate.e2e.connectors-dir skips
# this example, naming a directory whose jars do not resolve fails it.
name: a-large-recompute-finishes-after-the-input-stops
setup:
  databases:
    shop: { kind: mysql }
    store: { kind: mongo }
  connectors: [mysql, mongodb]
  apply: [shop_db.tap.yml, views.tap.yml, join_pipeline.tap.yml]
  discover: [shop_db]
pipeline: join_pipeline.tap.yml
seed:
  shop_db.customers:
    values:
      - { id: 1, name: ada }
      - { id: 2, name: bo }
  shop_db.orders:
