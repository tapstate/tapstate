  - start
  # The control: the rows really are there to be revisited.
  - await: { count: { views.order_state: 401 } }
  - await: { doc: { views.order_state: { where: { order_id: 1000 }, expect: { customer_name: ada } } } }
  # One change, and then nothing is fed again for the rest of the run.
  - cdc: { shop_db.customers: { update: { where: { id: 1 }, set: { name: adelaide } } } }
  # The two ends of the range and one in the middle. Stopping part way satisfies one end and not the
  # other, whichever way the bucket is walked.
  - await: { doc: { views.order_state: { where: { order_id: 1000 }, expect: { customer_name: adelaide } } } }
  - await: { doc: { views.order_state: { where: { order_id: 1200 }, expect: { customer_name: adelaide } } } }
  - await: { doc: { views.order_state: { where: { order_id: 1399 }, expect: { customer_name: adelaide } } } }
  # Bo's order never belonged to the changed customer.
  - assert: { doc: { views.order_state: { where: { order_id: 9999 }, expect: { customer_name: bo } } } }
  # And nothing was duplicated on the way.
  - assert: { count: { views.order_state: 401 } }
