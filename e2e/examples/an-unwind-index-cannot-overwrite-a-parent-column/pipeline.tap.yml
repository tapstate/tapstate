version: tapstate/v1
kind: pipeline
id: unwind_collision
source: src_file
settings: { read_mode: snapshot_and_cdc }
transforms:
  - id: listed
    from: [orders]
    type: map
    fields:
      items: "=['a', 'b']"
  - { id: expanded, from: listed, type: unwind, path: items, include_array_index: seq }
serve:
  from: expanded
  sync:
    - source: tgt_file
