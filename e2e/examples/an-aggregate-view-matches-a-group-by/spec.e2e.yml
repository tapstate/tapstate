      - { id: 37, region: US, order_day: "2026-03-01", amount: 1369, status: paid }
      - { id: 38, region: APAC, order_day: "2026-03-01", amount: 1506, status: paid }
      - { id: 39, region: EU, order_day: "2026-03-02", amount: 1643, status: paid }
      - { id: 40, region: US, order_day: "2026-03-02", amount: 1780, status: paid }
steps:
  - start
  - await: { count: { tgt_mongo.sales_by_region_day: 11 } }
  - await: { doc: { tgt_mongo.sales_by_region_day: { where: { region: US, day: "2026-03-01" }, expect: { order_count: 3, revenue: 3231, big_orders: 2, max_order: 1625 } } } }
  - assert: { doc: { tgt_mongo.sales_by_region_day: { where: { region: APAC, day: "2026-03-01" }, expect: { order_count: 4, revenue: 3760, big_orders: 2, max_order: 1762 } } } }
  - assert: { doc: { tgt_mongo.sales_by_region_day: { where: { region: EU, day: "2026-03-02" }, expect: { order_count: 4, revenue: 4308, big_orders: 2, max_order: 1899 } } } }
  - assert: { doc: { tgt_mongo.sales_by_region_day: { where: { region: APAC, day: "2026-03-02" }, expect: { order_count: 3, revenue: 1587, big_orders: 0, max_order: 785 } } } }
  - assert: { doc: { tgt_mongo.sales_by_region_day: { where: { region: EU, day: "2026-03-03" }, expect: { order_count: 3, revenue: 1998, big_orders: 0, max_order: 922 } } } }
  - assert: { doc: { tgt_mongo.sales_by_region_day: { where: { region: US, day: "2026-03-03" }, expect: { order_count: 3, revenue: 2409, big_orders: 1, max_order: 1059 } } } }
  - assert: { doc: { tgt_mongo.sales_by_region_day: { where: { region: APAC, day: "2026-03-03" }, expect: { order_count: 3, revenue: 2820, big_orders: 1, max_order: 1196 } } } }
  - assert: { doc: { tgt_mongo.sales_by_region_day: { where: { region: EU, day: "2026-03-04" }, expect: { order_count: 3, revenue: 3231, big_orders: 2, max_order: 1333 } } } }
  - assert: { doc: { tgt_mongo.sales_by_region_day: { where: { region: US, day: "2026-03-04" }, expect: { order_count: 2, revenue: 2428, big_orders: 1, max_order: 1470 } } } }
  - assert: { doc: { tgt_mongo.sales_by_region_day: { where: { region: EU, day: "2026-03-01" }, expect: { order_count: 3, revenue: 4464, big_orders: 3, max_order: 1744 } } } }
  - assert: { doc: { tgt_mongo.sales_by_region_day: { where: { region: US, day: "2026-03-02" }, expect: { order_count: 3, revenue: 2308, big_orders: 1, max_order: 1780 } } } }
  # Eleven rows and no twelfth: the one region and day whose orders are all cancelled has none.
  - assert: { count: { tgt_mongo.sales_by_region_day: 11 } }
