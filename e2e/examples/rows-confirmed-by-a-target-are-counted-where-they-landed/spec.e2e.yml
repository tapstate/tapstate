# How much a pipeline has moved, as the product itself reports it.
#
# Every sibling example asks the target how many rows it holds. That answers whether rows crossed; it
# does not answer what the product believes it moved, and the product's own answer is the one a person
# reads on a dashboard. This example holds the two together: the target holds three rows, and the
# pipeline says it has had three confirmed.
#
# Awaited rather than asserted, and that is not a style choice. This total is read off the job's last
# collected metrics, so a freshly settled row is not in it yet: an immediate read returns nought, which
# is indistinguishable from a product that never publishes the total at all. Polling to the exact number
# tells those apart - a product that does not publish it times out here instead of reading low.
#
# Read twice, before and after a change, because one reading cannot tell a total that keeps up from one
# published once and never refreshed. The second reading is the one a metric wired only at start-up
# fails; it rests at three.
#
# WHAT THIS DOES NOT WITNESS, deliberately: where the boundary sits. The total is meant to count rows a
# target confirmed and not rows handed to a sink, and no specification here can tell those apart. The
# two readings differ only while a write is in flight, and this face answers only for a live job - so a
# pipeline whose writes were all rejected has no job left, and its total reads nought by that rule
# alone, whichever boundary the product used. That witness belongs where a write can be held
# unsettled, which is the sink processor's own unit tests (counts_nothing_until_the_write_settles and
# counts_nothing_for_a_write_that_failed).
#
# cdc_only, and that is load-bearing rather than incidental. The total is read off the live job, so a
# bounded read takes it away with the job the moment it completes: the number is gone exactly when it
# has finished being interesting. A tailing pipeline keeps its job, and so keeps answering. The
# arrivals are one per row either way here - this connector's tail remembers how far it has read within
# a run - so three seeded rows cross three times, not three plus a replay.
name: rows-confirmed-by-a-target-are-counted-where-they-landed
setup:
  connectors: [e2e_file]
  apply: [src_file.tap.yml, tgt_file.tap.yml, pipeline.tap.yml]
  discover: [src_file]
pipeline: pipeline.tap.yml
seed:
  src_file.orders: { rows: 3 }
steps:
  - start
  - await: { count: { tgt_file.orders: 3 } }
  - await: { records_out: 3 }
  - cdc: { src_file.orders: insert 2 }
  - await: { count: { tgt_file.orders: 5 } }
  - await: { records_out: 5 }
