# A sync pipeline whose source schema has not been discovered is refused when it starts, with a coded
# diagnosis rather than a sink crash. The resources are applied first and the missing discovery is
# deliberate: discovery is a start precondition for a sync, not an apply precondition.
#
# The state and code are both asserted. FAILED alone would also pass for a connector crash or a job
# failure, while the code alone would not prove the lifecycle state was published. The error count makes
# the refusal observable through the same metrics face a caller uses for other failed runs.
#
# The source and target use the harness connector so this smoke case runs on both fidelity tiers without
# real connector jars. The production unit cases cover the target model and the real MongoDB connector
# path; this case covers the public lifecycle behavior that turns the missing model into an observation.
name: a-sync-start-before-source-discovery-is-refused
setup:
  connectors: [e2e_file]
  apply: [src_file.tap.yml, tgt_file.tap.yml, pipeline.tap.yml]
pipeline: pipeline.tap.yml
seed:
  src_file.orders: { rows: 3 }
steps:
  - start
  - await: { state: FAILED }
  - assert: { failure_code: actuation.source-schema-not-discovered }
  - assert: { error_count: 1 }
  - assert: { count: { tgt_file.orders: 0 } }
