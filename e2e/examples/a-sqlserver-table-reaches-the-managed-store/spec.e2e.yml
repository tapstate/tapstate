# SQL Server snapshot and CDC delivery are checked separately, against the managed store.
# The changed sequence distinguishes a working insert path from an update path that drops data.
# Snapshot, insert, update and delete are separate delivery witnesses.
# The changed sequence is read back: counts alone cannot detect a discarded update.
name: a-sqlserver-table-reaches-the-managed-store
setup:
  databases:
    src_mssql: { kind: sqlserver }
    store: { kind: mongo }
  connectors: [sqlserver, mongodb]
  apply: [src_mssql.tap.yml, views.tap.yml, pipeline.tap.yml]
  discover: [src_mssql]
pipeline: pipeline.tap.yml
seed:
  src_mssql.orders: { rows: 12 }
steps:
  - start
  - await: { count: { views.order_state: 12 } }
  - await: { doc: { views.order_state: { where: { id: 5 }, expect: { seq: 5 } } } }
  - cdc: { src_mssql.orders: insert 3 }
  - await: { count: { views.order_state: 15 } }
  - await: { doc: { views.order_state: { where: { id: 15 }, expect: { seq: 15 } } } }
  - cdc: { src_mssql.orders: { update: { where: { id: 5 }, set: { seq: 505 } } } }
  - await: { doc: { views.order_state: { where: { id: 5 }, expect: { seq: 505 } } } }
  - cdc: { src_mssql.orders: { delete: { where: { id: 1 } } } }
  - await: { count: { views.order_state: 14 } }
  - assert: { doc: { views.order_state: { where: { id: 5 }, expect: { seq: 505 } } } }
