# Tapstate error-code message catalog — locale: en (the mandatory locale).
#
# One entry per canonical <domain>.<symbol> code. `message` is the user-facing diagnostic;
# `solution` is an optional next-step hint. Placeholders use named {name} syntax; the union of
# names across a code's templates must equal that code's declared placeholders() (build gate D5-4).
# Adding a code means adding its entry here in the same change set (build gate D5-3). Render order
# bottoms out at the bare canonical code when an entry or locale is missing.
#
# Values are double-quoted single-line scalars; colons, apostrophes and backticks inside the quotes
# are fine. Keep literal double-quotes out of values (use backticks for inline code).
actuation.pipeline-not-found:
  message: "No pipeline artifact `{pipeline}` is stored to run."
  solution: "Apply the pipeline before starting it, and check the id for typos."
actuation.not-a-pipeline:
  message: "Resource `{pipeline}` is a `{kind}`, not a pipeline, so it cannot be run."
  solution: "Start a pipeline resource; check the id names a pipeline and not another kind of resource."
actuation.source-schema-not-discovered:
  message: "Source `{source}` needs a discovered schema before its tables can be selected."
  solution: "Run schema discovery for the source, then apply or start the pipeline again."
actuation.view-key-missing:
  message: "View `{view}` declares no primary key."
  solution: "Give the view a primaryKey naming the column that identifies one record, so updates converge on it instead of appending a copy."
actuation.view-storage-tier-unsupported:
  message: "View `{view}` declares the `{tier}` storage tier, which this release does not materialize."
  solution: "Remove the tier from the view. Only the warm tier is materialized today; hot and cold are reserved."
actuation.view-store-not-configured:
  message: "The managed state store `{store}` a view materializes into is not configured."
  solution: "Start the deployment's managed state store, or register a source under that id for views to materialize into."
actuation.view-store-unreachable:
  message: "The managed state store `{store}` a view materializes into did not answer: {reason}"
  solution: "Check that the state store is running and reachable from the server, then start the pipeline again."
actuation.view-key-not-feed-identity:
  message: "View `{view}` declares key `{key}`, but what feeds it is identified by `{identity}`."
  solution: "Declare the view's primaryKey as that identity column. An identity spanning several columns cannot be served by a view today - a view's key is a single column, and materializing on fewer columns than the identity collapses distinct records."
actuation.view-fed-by-many-tables:
  message: "View `{view}` is fed by more than one stream: {tables}."
  solution: "Feed the view from a single table, or assemble the streams into one document with a nest step and feed the view from that."
actuation.view-store-is-a-capture-source:
  message: "The resource under the managed state store id `{store}` declares capture settings, so it is an authored source, not the deployment's store."
  solution: "Rename your source so it does not occupy the managed store's id, or remove its mode/tables if it really is the deployment's state store."

actuation.source-table-not-discovered:
  message: "Source `{source}` does not declare discovered table `{table}`."
  solution: "Discover the source again or change the pipeline table selector to a discovered table."
actuation.source-table-selection-empty:
  message: "Source `{source}` selects no tables."
  solution: "Use a table name or regex that matches at least one discovered table."
actuation.source-table-spec-unsupported:
  message: "Source `{source}` table `{table}` uses unsupported settings: {fields}."
  solution: "Remove the unsupported table settings; this runtime currently supports only the object's `name` selector."
actuation.source-table-regex-invalid:
  message: "Source `{source}` has an invalid table regex `{regex}`."
  solution: "Fix the regex syntax and apply the pipeline again."
actuation.source-table-ambiguous:
  message: "Table `{table}` is selected by more than one source: {sources}."
  solution: "Use a qualified source.table reference to choose the intended source."
actuation.from-regex-invalid:
  message: "The pipeline `from` regex `{regex}` is invalid."
  solution: "Fix the regex syntax and apply the pipeline again."
actuation.from-regex-empty:
  message: "The pipeline `from` regex `{regex}` matches no upstream vertex."
  solution: "Use a regex matching a selected source table or an earlier transform step."
boot.hazelcast-unavailable:
  message: "The embedded Hazelcast member could not start."
  solution: "Another process may already be using the member port on loopback; stop it or set a different port, then restart."
capture.start-from-unparsable:
  message: "Cannot start consuming from `{value}`; expected `earliest`, `latest`, or an ISO-8601 timestamp."
  solution: "Set start_from to earliest, latest, or an ISO-8601 timestamp like 2026-07-11T00:00:00Z."
capture.event-table-not-selected:
  message: "The capture stream emitted table `{table}`, which this pipeline did not select."
  solution: "Update the source table selection or verify the connector emits the configured table names."
cli.alias-install-dir-unknown:
  message: "No installed `tapstate` was found in `{path}`."
  solution: "Run this where tapstate is installed, or set TAPSTATE_INSTALL_DIR to that directory - the same variable the installer honours."
cli.alias-link-failed:
  message: "The `tap` shortcut at `{path}` could not be created or removed: {reason}"
  solution: "Check that the directory exists and you can write to it, then run `tapstate alias install` again. tapstate itself works without the shortcut."
cli.alias-name-taken:
  message: "`{path}` already exists and is not the tapstate shortcut."
  solution: "Leave it in place - tapstate works without the shortcut. Remove that file yourself if you want the `tap` name, then run `tapstate alias install` again."
cli.artifact-exists:
  message: "An artifact already exists at {path}."
  solution: "Choose a different id or --out, or pass --force to overwrite."
cli.demo-workspace-exists:
  message: "The workspace already holds a demo resource at {path}."
  solution: "Use a different workspace with -w, or pass --force to overwrite the demo files there."
cli.workspace-not-writable:
  message: "Could not write {path}: {reason}"
  solution: "Check that the directory exists, is writable, and that no plain file is sitting where a directory is needed. Demo files this run wrote were removed and any it overwrote were put back, though empty directories it created can remain."
cli.unknown-connector:
  message: "No connector '{connector}' in the catalog."
  solution: "Pick a connector id from the catalog; run `tapstate new` interactively to choose one."
cli.connector-not-official:
  message: "This release installs these connectors: {official}. '{connector}' is in the catalog but is not one of them."
  solution: "Pick one of the connectors listed above. The supported set grows as connectors complete certification, so a connector missing here is not necessarily faulty."
cli.kind-dir-mismatch:
  message: "Artifact {path} declares kind '{kind}' but sits in a '{dir}' directory."
  solution: "Move it under a '{kind}' directory, or change its declared kind to match."
cli.resource-not-found:
  message: "No resource with id '{id}' in the workspace."
  solution: "Run `tapstate ls` to see the available resources."
cli.connect-failed:
  message: "Could not reach any Tapstate server among the seeds: {seeds}."
  solution: "Check the addresses are correct and that a Tapstate server is running there, then try connect again."
cli.request-timed-out:
  message: "The request to {server} timed out before the server answered."
  solution: "The server may be busy or the upload large. It may have completed there anyway — re-running a register is safe (it is idempotent). Wait and retry, or check the server logs."
cli.not-connected:
  message: "The `{verb}` command needs a connection to a Tapstate server."
  solution: "Run `connect <host:port>` first, or start with `tapstate -c <host:port> -u <user>`."
cli.not-authenticated:
  message: "The `{verb}` command needs you to sign in first."
  solution: "Run `login <username>`, or start with `tapstate -c <host:port> -u <user>`."
cli.verb-not-implemented:
  message: "The `{verb}` command is reserved but not implemented yet."
  solution: "Use the commands it will be built from in the meantime; `help` lists what this build can do."
cli.repl-builtin-only:
  message: "`{verb}` works inside the Tapstate session, not as a one-shot command."
  solution: "Start `tapstate` with no arguments and type `{verb}` at the prompt; `help` lists the session commands."
cli.mcp-unavailable:
  message: "The MCP sidecar is unavailable: {reason}."
  solution: "Install the complete Tapstate CLI bundle, including libexec/tapstate-mcp, and retry."
cli.watch-needs-a-terminal:
  message: "`watch` redraws one row in place, which needs a terminal; here its output is a pipe or a file."
  solution: "Use `tail <source>.<collection>` for a stream you can pipe, or `<source>.<collection>.find(...)` for a one-shot look."
cli.if-match-needs-one-resource:
  message: "`--if-match` names one version, but this apply covers {count} resources."
  solution: "Apply the single file you are editing, or drop `--if-match` and let the batch apply unconditionally."
cli.context-config-invalid:
  message: "The context configuration at `{path}` is unsafe or invalid: {reason}"
  solution: "Fix or remove the configuration file, then run the context manager again. The invalid file was not overwritten."
cli.context-config-version:
  message: "The context configuration at `{path}` uses unsupported schema version `{version}`."
  solution: "Use a compatible tapstate release or migrate the configuration with a release that supports this version."
cli.context-config-permissions:
  message: "The context configuration path `{path}` is not owner-only: {reason}"
  solution: "Restore ownership and owner-only permissions, then retry. Tapstate will not read or overwrite an unsafe file."
cli.auth-cache-invalid:
  message: "The auth cache at `{path}` is unsafe or invalid: {reason}"
  solution: "Sign in again after checking the context target. The invalid auth file was not overwritten."
cli.auth-cache-version:
  message: "The auth cache at `{path}` uses unsupported schema version `{version}`."
  solution: "Use a compatible tapstate release or sign in again with this release."
cli.auth-cache-permissions:
  message: "The auth cache path `{path}` is not owner-only: {reason}"
  solution: "Restore ownership and owner-only permissions, then retry. Tapstate will not read or overwrite an unsafe auth file."
cli.auth-session-rejected:
  message: "The cached session for `{principal}` was rejected by the server: {code}."
  solution: "Run `tapstate auth login` again for this context."
cli.auth-session-unreachable:
  message: "The cached session for `{principal}` could not be exchanged because the server was unreachable."
  solution: "Check the server connection and retry, or run `tapstate auth login` again."
cli.auth-login-unreachable:
  message: "Login for context `{context}` did not return a usable persistent session."
  solution: "Check the server connection and compatibility, then run `tapstate auth login` again."
cli.auth-login-rejected:
  message: "Login for `{principal}` was rejected by the server: {code}."
  solution: "Check the username and password, then run `tapstate auth login` again."
cli.auth-logout-unreachable:
  message: "The remote session for context `{context}` could not be revoked; the local cache was kept."
  solution: "Retry when the server is reachable, or use `tapstate auth logout --local-only` to remove only the local cache."
cli.auth-logout-cache-changed:
  message: "The session for context `{context}` changed while logout was in progress; the newer local session was kept."
  solution: "Run `tapstate auth status` to inspect the current session, then retry logout if needed."
cli.auth-usage:
  message: "Invalid auth command: {reason}."
  solution: "Use `tapstate auth login [username]`, `tapstate auth status`, or `tapstate auth logout [--local-only]`."
cli.context-usage:
  message: "Invalid context manager input: {reason}."
  solution: "Run `tapstate context` in an interactive terminal and choose one of the offered actions."
cli.context-invalid:
  message: "Context `{name}` is invalid: {reason}"
  solution: "Use a non-empty name, at least one absolute HTTP(S) seed, and valid context settings."
cli.context-not-found:
  message: "No context named `{name}` exists."
  solution: "Open the context manager and choose an existing context or create this one."
cli.context-already-exists:
  message: "A context named `{name}` already exists."
  solution: "Edit the existing context or choose another name."
cli.context-source-conflict:
  message: "`--connect` and `--context` select different kinds of target and cannot be used together."
  solution: "Keep `--connect` for a temporary target, or keep `--context` for a saved context."
cli.context-required:
  message: "The `{verb}` command needs a server context, but no target was selected."
  solution: "Use `--context`, set `TAPSTATE_CONTEXT`, bind this exact workspace, or use `--connect` for a temporary target."
dsl.unknown-field:
  message: "Unknown field '{field}' at {path}."
  solution: "Remove it, or run `tapstate explain` to see the fields allowed here."
dsl.forbidden-field:
  message: "Field '{field}' is not allowed at {path}."
  solution: "It is valid elsewhere but not in this position; run `tapstate explain` to confirm."
dsl.missing-reference:
  message: "Reference '{ref}' at {path} points to nothing in this workspace."
  solution: "Define the referenced resource, or fix the name to match an existing one."
dsl.ambiguous-reference:
  message: "Reference '{ref}' at {path} is ambiguous across more than one source."
  solution: "Qualify the table with its source, e.g. `source.table`."
dsl.mode-mismatch:
  message: "Field '{field}' at {path} is not allowed for mode '{mode}'."
  solution: "Remove the field, or change the source mode to one that supports it."
dsl.illegal-value:
  message: "Value '{value}' at {path} is not allowed; expected {expected}."
  solution: "Use one of the accepted values."
dsl.illegal-expression:
  message: "Expression at {path} did not compile: {detail} (expression: {expr})."
  solution: "Fix the CEL expression; only the row envelope fields are in scope."
dsl.row-expression-needs-discovery:
  message: "Expression `{expr}` at {path} reads row fields, but source `{source}` has no discovered schema."
  solution: "Discover the source before applying this: run `discover-schema {source}`."
dsl.row-expression-type-unsupported:
  message: "Expression `{expr}` at {path} computes on column `{column}` of table `{table}`, which is {type} and cannot be computed on without losing what it holds."
  solution: "Compute on a column whose type survives the operation, or carry `{column}` through unchanged instead of computing on it."
dsl.row-expression-type-unknown:
  message: "Expression `{expr}` at {path} reads column `{column}` of table `{table}`, which nothing resolved a type for."
  solution: "Whether this expression can run is unknown; drop the reference to `{column}`, or read a column whose type the source declares."
dsl.upsert-needs-key:
  message: "The sync at {path} upserts table `{table}` of source `{source}`, but that table declares no key, so no write can be matched to the row it belongs to."
  solution: "Give `{table}` a primary key and discover `{source}` again, or write with `write_mode: append`, which adds rows instead of matching them. A unique index is not enough: only a primary key is read as the key here."
dsl.composition:
  message: "Composition rule broken at {path}: {detail}."
  solution: "Review how the resources are wired together."
dsl.duplicate-id:
  message: "Duplicate id '{id}' at {path}."
  solution: "Ids must be unique within the workspace; rename one of them."
dsl.unsupported-mode:
  message: "Connector '{connector}' does not support mode '{mode}' at {path}."
  solution: "Choose one of the connector's supported modes: {allowed}."
dsl.config-type-mismatch:
  message: "Config field '{field}' of connector '{connector}' at {path} has the wrong type; expected {expected}."
  solution: "Provide a value of the expected type."
dsl.config-required:
  message: "Required config field '{field}' of connector '{connector}' is missing at {path}."
  solution: "Provide the field, or choose a connection mode that makes it unnecessary."
dsl.invalid-config-value:
  message: "Config field '{field}' of connector '{connector}' at {path} has an invalid value '{value}'."
  solution: "Use one of the allowed values: {allowed}."
dsl.malformed-yaml:
  message: "Malformed YAML: {detail}."
  solution: "Fix the YAML syntax; the line and column point at the problem."
dsl.undefined-variable:
  message: "Variable '{name}' is not set, and the reference to it gives no default."
  solution: "Set '{name}' in the environment you apply from, or give the reference a fallback with the ${var:NAME:default} form."
dsl.malformed-interpolation:
  message: "Reference '{ref}' is not a form the grammar defines."
  solution: "A reference names a variable, as in ${var:NAME:default} for one with a fallback; a lone dollar sign is ordinary text."
lifecycle.illegal-transition:
  message: "Cannot {verb} a pipeline in state {from}."
  solution: "Only certain actions are valid from each state; check the pipeline's current state first."
lifecycle.incompatible-revision:
  message: "The pipeline's revision {requested} is not compatible with the latest applied revision {latest}."
  solution: "Re-apply the pipeline so its revision matches the latest applied one, then retry."
lifecycle.unknown-pipeline:
  message: "No pipeline named {pipeline} is applied."
  solution: "Apply the pipeline before acting on it or reading its status, and check the id for typos."
role.unsupported:
  message: "Unsupported --role value '{role}'."
  solution: "L1 runs the whole platform in one process; use --role=all (the default)."
store.unreachable:
  message: "Cannot reach the store at {target}."
  solution: "Check the store is running and the connection settings are correct, then restart."
store.not-replica-set:
  message: "The store at {target} is not a replica-set."
  solution: "Start MongoDB as a single-node replica-set; the checkpoint transaction requires one."
store.invalid-uri:
  message: "The store connection string is not a valid MongoDB URI."
  solution: "Check the store URI setting; it must start with mongodb:// or mongodb+srv://."
store.tls-ca-unreadable:
  message: "The store TLS CA certificate file at {path} could not be read."
  solution: "Check the path points at a readable PEM certificate for the store's TLS chain."
io.store-unavailable:
  message: "A store operation could not complete: {detail}."
  solution: "Check the store is reachable and healthy, then retry."
io.store-unauthorized:
  message: "The store rejected the credentials for the operation."
  solution: "Check the store username and password in the connection settings."
io.document-unreadable:
  message: "A stored document with id '{id}' could not be read back."
  solution: "The stored document is corrupt or was written by a newer version; inspect or restore it."
connector.not-official:
  message: "Runtime registration supports these connectors today: {official}. '{connector}' is not among them yet."
  solution: "Register one of the connectors listed above. The supported set grows as connectors complete certification, so an artifact refused here is not necessarily faulty."
connector.not-registered:
  message: "No connector '{connector}' is registered."
  solution: "Register the connector's artifact — or place it in the connector seed directory — before using it."
connector.ambiguous-registration:
  message: "Connector '{connector}' resolves to more than one registered artifact: {artifacts}."
  solution: "Keep a single registered artifact per connector id; selecting among connector versions is not supported."
connector.registration-conflict:
  message: "Connector '{connector}' is already registered under artifact {existing}; a different artifact {incoming} was refused."
  solution: "Keep a single registered artifact per connector id; unregister the existing artifact before registering a different one."
connector.load-failed:
  message: "Connector '{connector}' could not be loaded."
  solution: "Check the connector jar and its dependencies are present and readable."
connector.class-not-found:
  message: "Connector '{connector}' entry class '{class}' was not found or is not a connector."
  solution: "Check the connector id resolves to a connector jar that declares this entry class."
connector.no-connector-class:
  message: "No connector class found in artifact '{artifact}'."
  solution: "Check the jar is a PDK connector: it must contain a class annotated with @TapConnectorClass."
connector.not-found:
  message: "Connector '{connector}' is not present in the online catalog."
  solution: "Choose a connector returned by `connector.list`, or register it before requesting its form metadata."
connector.ambiguous-connector-class:
  message: "Artifact '{artifact}' declares more than one connector class: {classes}."
  solution: "Register one connector per artifact; split unrelated connectors into separate jars."
connector.spec-not-found:
  message: "Connector artifact '{artifact}' names spec '{spec}' but the jar does not contain it."
  solution: "Check the connector build packages the spec resource named by its @TapConnectorClass annotation."
connector.spec-invalid:
  message: "Connector artifact '{artifact}' spec '{spec}' does not identify the connector: {detail}."
  solution: "Ensure the spec resource is valid JSON and declares the connector id under properties.id."
connector.api-level-incompatible:
  message: "Connector '{connector}' requires PDK API level {required} but this engine provides level {provided}."
  solution: "Use a connector build compatible with API level {provided}, or upgrade the engine."
connector.api-level-unknown:
  message: "Connector '{connector}' declares PDK API version {version}, which this engine build does not recognize."
  solution: "Use a connector built against a PDK API version this engine registers, or add {version} to the Tapstate-side level table if it is API-compatible."
connector.projection-failed:
  message: "Connector '{connector}' produced an event that could not be projected: {detail}."
  solution: "This is a bridge-level projection failure between the connector and the event envelope."
connector.capture-failed:
  message: "Connector '{connector}' failed while reading: {detail}."
  solution: "Check the source is reachable and the connection settings are correct."
connector.discover-failed:
  message: "Connector '{connector}' could not discover its schema: {detail}."
  solution: "The connector failed while discovering the source model; check the source is reachable and the connection settings are correct."
connector.test-failed:
  message: "Connector '{connector}' could not complete its connection test: {detail}."
  solution: "The connector failed while testing; check the connection settings and that the target is reachable."
connector.write-failed:
  message: "Connector '{connector}' failed while writing: {detail}."
  solution: "Check the target is reachable and the connection settings are correct."
connector.read-abandoned:
  message: "Reading '{connector}' stopped before it finished, so the rows it returned are incomplete."
  solution: "The read was interrupted rather than refused; run it again."
connector.read-failed:
  message: "Connector '{connector}' failed while reading the store: {detail}."
  solution: "Check the store is reachable and the connection settings are correct."
connector.capability-missing:
  message: "Connector '{connector}' does not provide '{capability}', which this read needs."
  solution: "Read a source whose connector provides this capability, or use a verb that does not need it."
connector.instances-busy:
  message: "Every connection to '{connector}' was still busy after {timeout}."
  solution: "Another read of this connection is still running; retry, or narrow the read so it finishes sooner."
connector.instance-limit-reached:
  message: "This host already holds its limit of {limit} live connector connections and all of them are busy."
  solution: "Wait for a running read to finish, or reduce how many connections are being read at once."
connector.read-timeout:
  message: "Reading '{connector}' took longer than {timeout} and was stopped."
  solution: "Narrow the read with a filter or a smaller limit, or check the store is not overloaded."
control.audit-blocked:
  message: "Operation '{op}' was refused because its required audit record could not be written."
  solution: "An audited operation must leave an audit record before it runs; check the store is reachable and healthy, then retry."
control.auth-failed:
  message: "Authentication failed: invalid username or password."
  solution: "Check the username and password are correct, then sign in again."
control.bootstrap-closed:
  message: "The initial-admin bootstrap channel is closed because an admin account already exists."
  solution: "Sign in with an existing admin account to create more users."
control.bootstrap-forbidden:
  message: "The initial-admin bootstrap channel accepts only local (loopback) connections."
  solution: "Create the first admin from a session on the server host itself, or pre-seed one at deployment."
control.forbidden:
  message: "Operation '{op}' requires {required} capability."
  solution: "Sign in as a user with that capability, or use a token issued with that scope."
control.malformed-request:
  message: "The request is malformed: {reason}."
  solution: "Correct the request body, then send it again."
control.unauthenticated:
  message: "This operation requires authentication."
  solution: "Sign in with `login` to obtain a session token, or present a machine token with `--token`."
control.unreachable:
  message: "The Tapstate Server is unreachable."
  solution: "Check the Server URL and availability, then retry the tool call."
data-browser.connector-not-browsable:
  message: "Connector '{connector}' answers reads in its own shape, and this face asks in documents, so its rows cannot be browsed."
  solution: "Browse a source on one of: {browsable}. This source can still be listed and sized, and it can still be read by a pipeline."
data-browser.follow-idle:
  message: "Following stopped after 10 minutes with no changes; the connector instance it held was given back."
  solution: "Follow it again to keep watching."
data-browser.follow-stopped:
  message: "Following stopped: the stream from the source failed."
  solution: "Check the server log for what the connector reported, then follow it again."
data-browser.invalid-limit:
  message: "A read of {limit} rows is not served; ask for between 1 and {max}."
  solution: "Ask for at most {max} rows, or narrow the read with a filter."
data-browser.source-deleted:
  message: "Following stopped: the source being followed was deleted."
  solution: "Declare the source again, or follow a collection of a source that still exists."
data-browser.unknown-collection:
  message: "Source '{source}' has no collection named '{collection}'."
  solution: "List what the source holds and read one of those names."
data-browser.unorderable-field:
  message: "Field '{field}' is named with a dot in it, and results cannot be ordered by such a field."
  solution: "Order by another field. This one can still be filtered on, by escaping the dot that belongs to its name: write it price\\.usd in the shell, and \"price\\\\.usd\" in JSON, where a lone backslash is not an escape the format allows. Filtering it reads every row, though: an index is written the same way a path is, so a field whose name holds a dot cannot have one."
mcp.connector-spec-unavailable:
  message: "Connector {connector} does not provide a complete live spec."
  solution: "Register the connector runtime and retry connector_get before using the connector."
mcp.environment-missing:
  message: "Environment variable {variable} is required by the Source config."
  solution: "Inject the variable into the MCP process environment and retry the connection operation."
mcp.server-rejected:
  message: "The Tapstate Server rejected the request with HTTP status {status} without a structured error code."
  solution: "Inspect the Server logs and verify that the MCP sidecar and Server use compatible control contracts."
engine.job-failed:
  message: "Pipeline {pipeline} stopped because its job failed: {cause}."
  solution: "Check the pipeline's logs for the failure, fix what it reports, then start the pipeline again."
engine.no-such-job:
  message: "Pipeline {pipeline} has no running job to act on."
  solution: "Start the pipeline before pausing or resuming it, and check the id for typos."
engine.frontier-order-not-encodable:
  message: "Chain {chain} reached generation {epoch} position {seq}, past what the engine encodes an ordering value in."
  solution: "Report this with the pipeline: the range is a build-time width, and no configuration widens it."
engine.frontier-pinned:
  message: "Chain {chain} has not advanced its durable position for {minutes} minutes ({cause}; the bound combined for it has run {gap} ahead)."
  solution: "The source keeps its log from that position onwards, so act before the log's retention passes it: if the chain is waiting on changes still pending upstream, find what is holding them; if it is starved of positions, the sink has nothing to advance to and the source must supply them."
monitor.no-observation:
  message: "No observation is available for pipeline {pipeline}."
  solution: "Check the pipeline id for typos; a freshly started pipeline may take a moment to publish its first observation."
artifact.in-use:
  message: "Artifact `{id}` is still referenced by: {referrers}."
  solution: "Delete or rewrite those resources first, then delete `{id}`."
artifact.not-found:
  message: "No artifact with id `{id}` is stored."
  solution: "List artifacts to find an existing id."
artifact.pipeline-not-stopped:
  message: "Pipeline `{id}` is {actual} and is headed for {desired}, so it cannot be deleted."
  solution: "Stop the pipeline, let it settle, then delete it."
artifact.reclaim-incomplete:
  message: "Artifact `{id}` was removed, but this bookkeeping was left behind ({reason}): {residue}."
  solution: "The removal stands, so do not retry it. If the pipeline is running again, stop it first; then clear the listed records by hand."
artifact.precondition-required:
  message: "Deleting artifact `{id}` requires the content hash of the version you read."
  solution: "Read the artifact, then retry the delete with that content hash."
artifact.version-conflict:
  message: "Artifact `{id}` changed after it was read."
  solution: "Read the current artifact, decide again against that version, then retry."
source.already-exists:
  message: "A Source with id '{id}' already exists."
  solution: "Choose a different id, or replace the existing Source with its current ETag."
source.id-mismatch:
  message: "Source id '{bodyId}' in the request body does not match path id '{pathId}'."
  solution: "Use the same immutable Source id in the request path and body."
source.in-use:
  message: "Source '{id}' is still referenced by: {referrers}."
  solution: "Remove those references before deleting the Source."
source.not-found:
  message: "No Source with id '{id}' exists."
  solution: "List Sources to find an existing id."
source.precondition-required:
  message: "Source '{id}' requires its current ETag for this operation."
  solution: "Read the Source, then retry with its ETag in If-Match."
source.version-conflict:
  message: "Source '{id}' changed after it was read."
  solution: "Read the current Source and retry the operation with its new ETag."
transform.expression-failed:
  message: "Expression {expr} could not be evaluated for a row: {detail}."
  solution: "Check the expression against the fields and types the row actually carries at runtime."
transform.script-compile-failed:
  message: "The js transform script could not be compiled: {detail}."
  solution: "Fix the script so it parses as valid JavaScript."
transform.script-failed:
  message: "The js transform script raised an error while processing a row: {detail}."
  solution: "Fix the script so it does not throw for this input, or guard the failing operation."
transform.script-no-process:
  message: "The js transform script defines no process(record, ctx) function."
  solution: "Add a process(record, ctx) function; it is the required entry point of a js transform."
transform.script-output-invalid:
  message: "The js transform script produced output that is not a valid record: {detail}."
  solution: "Ensure process returns a record (or emits one) whose before, after and schema are objects or null."
nest.sibling-embeds-target-different-parent-keys:
  message: "The embeds under {embedPath} join on different parent fields: {fields}."
  solution: "Have every embed under one parent join on the same parent field; that field is the parent's identity."
nest.embed-target-not-parent-key:
  message: "The embeds under {embedPath} join on {fields}, which does not identify its rows; its key is {parentKey}."
  solution: "Join on the parent's key. A field that merely refers to another table makes every row sharing a value one identity, so a nest embeds rows that belong to a parent rather than rows a parent refers to."
nest.embed-path-conflict:
  message: "Embeds {embedPathA} and {embedPathB} both target the path {path}."
  solution: "Give each embed a path of its own, or one silently overwrites the other in the document."
nest.root-key-required:
  message: "The nest rooted at {rootAlias} declares no key."
  solution: "Declare root.key: it is the identity children are grouped under, and the assembled document has none without it."
nest.array-key-unresolvable:
  message: "Embed {embedPath} declares no array key, and table {table} has no primary key to take one from."
  solution: "Declare arrayKey on that embed; without an element identity, updates pile up as duplicates."
nest.resolver-vertex-limit-exceeded:
  message: "This nest compiles to {vertices} resolver vertices, past the limit of {limit}."
  solution: "Flatten the tree or split the pipeline: every vertex takes a thread of its own."
nest.chain-axis-limit-exceeded:
  message: "This pipeline draws from {chains} chains, past the limit of {limit}."
  solution: "Split the pipeline: each table it reads spends one of the axes a bound can travel on."
nest.append-mode-conflicts-with-key-tracking:
  message: "Root {rootAlias} is append-only, and embed {embedPath} tracks structural key changes."
  solution: "Use an upsert root, or turn key tracking off: moving a subtree holds emissions back until it lands, which append-only forbids."
nest.snapshot-passthrough-forbidden:
  message: "A nest writing {rootCollection} cannot pass its snapshot reads straight to the sink."
  solution: "Let the nest assemble snapshot reads like any other change; passing them through writes unassembled rows."
nest.memory-budget-below-partition-count:
  message: "A nest was asked to hold {entries} entries in memory, spread across {partitions} partitions."
  solution: "Ask for at least as many entries as there are partitions: the budget is spent per partition, so anything smaller is rounded up to one entry each and holds the partition count whatever it was set to."
nest.memory-budget-changed-while-running:
  message: "Nest state {namespace} is already configured to hold {configured} entries in memory on this process, and this pipeline asks for {requested}."
  solution: "Restart the process to pick up the new budget: what a state map holds is settled the first time that map is configured and cannot be changed while the process runs, so restarting the pipeline alone would leave it on the earlier number."
nest.state-paths-changed:
  message: "Nest {stepId} stored its state under {recorded}, and now compiles to {compiled}."
  solution: "Stop the pipeline and start it again rather than resuming: renaming an embed path or inserting a level leaves the stored state where nothing reads it, and the new paths start empty beside documents that are not."
nest.root-fanout-limit-exceeded:
  message: "Document {rootKey} holds {elements} elements, past the per-document limit of {limit}."
  solution: "Raise the limit if the data really is this wide, or narrow what the nest embeds."
nest.migration-parking-limit-exceeded:
  message: "Rows on their way to {address} have parked {changes} changes, past the limit of {limit}."
  solution: "These rows are in no document while they sit there and the durable position is held below the change that moved them, so this is worth looking at rather than only raising. Reaching it usually means the half of the move that collects them is not being worked - check that side before raising the limit."
nest.pending-limit-exceeded:
  message: "Key {key} of nest state {namespace} holds {pending} changes waiting for something that has not arrived, past the limit of {limit}."
  solution: "Check whether the parent rows are simply late or are never coming - a load reading children before their parents fills these queues and empties them again, where a broken reference fills them for good. Raise the limit if the wait is real and this deep."
nest.tombstone-limit-exceeded:
  message: "Document {key} of nest state {namespace} keeps {tombstones} records of deleted elements that cannot be dropped yet, past the limit of {limit}."
  solution: "A record of a deletion is kept only until a restart could no longer replay the deletion, so this many means the durable position is not advancing - find what is holding the frontier back rather than raising the limit, which only buys time."
nest.parent-absent:
  message: "An event of chain {chain} in {bucket} at {order} hangs from a row that is gone, and was handed over after {heldFor} rather than placed in a document."
  solution: "A dangling reference in the source is normal and nothing was lost - the event was never going to appear in any document. A long wait means the reference has dangled all along; a short one means the parent row was deleted while its children were still arriving."
nest.state-served-from-cold-layer:
  message: "Nest namespace {namespace} served {backfills} of {accesses} state reads from storage rather than memory ({share}), {millis} each; {entries} of {stored} entries are in memory ({resident})."
  solution: "Raise this pipeline's in-memory entry budget so more of its working set stays resident, or accept the round trips if the throughput they allow is enough."
nest.key-change-tracking-requires-before-image:
  message: "Stream {alias} tracks structural key changes, but source table {table} provides no before image."
  solution: "Configure the source to emit full row images, or turn key tracking off for that stream."
nest.state-far-exceeds-memory-budget:
  message: "Nest level {embedPath} of pipeline {pipeline} is estimated to hold {estimatedEntries} entries, {multiple} times the {budget} it keeps in memory, so nearly every read of its state would come from storage."
  solution: "Raise this pipeline's entries_in_memory so more of that level stays resident, or accept the round trips if the throughput they allow is enough."
nest.capacity-estimate-incomplete:
  message: "Nest level {embedPath} of pipeline {pipeline} could be sized from {counted} of the {total} inputs feeding it; the rest report no row count, so what was estimated is a floor."
  solution: "Discover the sources feeding that level so their tables report row counts, then apply again to have it sized on all of them."
# Connector-supplied connection-test diagnostics.
#
# The connector API's typed test exceptions carry translation keys rather than sentences, and the
# bundle that resolves them belongs to the platform those connectors were written for. These entries
# supply the wording here instead, so a check that fails tells the reader what to do about it.
#
# They sit under a reserved pdk.testitem. prefix, constructionally disjoint from first-party
# <domain>.<symbol> codes: a connector cannot collide with one, and they are not first-party codes,
# so they are not in the codes golden. The set is fixed by the connector API, not open-ended.
pdk.testitem.check.cdc.privilege.reason:
  message: "The account does not hold the privileges a change stream needs."
pdk.testitem.check.cdc.privilege.solution:
  message: "Grant the replication privileges your database requires for change data capture, then test again."
pdk.testitem.read.privilege.reason:
  message: "The account cannot read one or more of the selected tables."
pdk.testitem.read.privilege.solution:
  message: "Grant read access on the tables this source selects, then test again."
pdk.testitem.write.privilege.reason:
  message: "The account cannot write to the target."
pdk.testitem.write.privilege.solution:
  message: "Grant insert, update and delete on the target tables, then test again."
pdk.testitem.create.table.privilege.reason:
  message: "The account cannot create tables, so a target table that does not exist yet cannot be created."
pdk.testitem.create.table.privilege.solution:
  message: "Either grant table creation, or create the target tables yourself before starting the pipeline."
pdk.testitem.pdk.version.reason:
  message: "The server version is outside the range this connector is verified against."
pdk.testitem.pdk.version.solution:
  message: "Check the connector's supported versions; outside them it is untested rather than certain to fail."
pdk.testitem.pdk.connection.reason:
  message: "The database could not be reached with these settings."
pdk.testitem.pdk.connection.solution:
  message: "Check the host, port, database and credentials, and that the server accepts connections from this machine."
pdk.testitem.check.host.port.reason:
  message: "The host and port did not accept a connection."
pdk.testitem.check.host.port.solution:
  message: "Check the address is reachable from where tapstate runs; firewalls and container networking are the usual causes."
pdk.testitem.time.consistent.reason:
  message: "The database clock differs noticeably from this machine's."
pdk.testitem.time.consistent.solution:
  message: "Sync the clocks; a large difference makes timestamps and change ordering hard to reason about."
pdk.testitem.stream.read.reason:
  message: "The change stream could not be started."
pdk.testitem.stream.read.solution:
  message: "Check that change data capture is enabled on the server and any required log or replication settings are in place."
pdk.testitem.check.cdc.privilege.fail:
  message: "The change-stream privilege check did not pass."
pdk.testitem.read.privilege.fail:
  message: "The read privilege check did not pass."
pdk.testitem.write.privilege.fail:
  message: "The write privilege check did not pass."
pdk.testitem.create.table.privilege.fail:
  message: "The table-creation privilege check did not pass."
pdk.testitem.pdk.version.fail:
  message: "The server version check did not pass."
pdk.testitem.pdk.connection.fail:
  message: "The connection could not be established."
pdk.testitem.check.host.port.fail:
  message: "The host and port did not accept a connection."
pdk.testitem.time.consistent.fail:
  message: "The clock comparison did not pass."
pdk.testitem.stream.read.fail:
  message: "The change stream could not be started."
cli.remote-plaintext:
  message: "Server seed {seed} uses plaintext HTTP outside loopback."
  solution: "Use HTTPS for remote servers; HTTP is allowed only for a loopback development server."
cli.issuer-discovery-failed:
  message: "Server seed {seed} did not return its anonymous cluster identity."
  solution: "Check that the seed is reachable and serves /.well-known/tapstate, then try again."
cli.issuer-discovery-invalid:
  message: "Server seed {seed} returned an invalid cluster identity ({reason})."
  solution: "Check that the URL targets a compatible Tapstate server and has not been replaced by another service."
cli.auth-issuer-mismatch:
  message: "Server seed {seed} reports issuer {actual}, but {expected} was required."
  solution: "Check the context seeds and sign in again only after confirming that this is the intended cluster."
