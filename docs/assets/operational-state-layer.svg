<text x="750" y="96" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#5f6f83">From fragmented database changes to one live view of the business</text>
