# Tapstate quickstart stack: the server and its state store, ready to run without a build.
#
# This demo runs a single member. MongoDB persists control-plane state and recovery positions.
# Restart recovery depends on the connector, read mode and retained source history; see the online quickstart.
#
# The store service is deliberately defined exactly as the development-only store stack defines it,
# down to the advertised member address. The two differ only in how the *client* addresses the set
# (see the server's store URI below), so neither stack has to know about the other.
services:
  mongo:
    image: mongo:7.0
    # A single-member replica set rather than a standalone: one write path opens a session and
    # commits a batch as one transaction, and MongoDB offers transactions only on a replica set.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      # Initiate the set on first boot, then hold the check red until a primary has actually been
      # elected. Two traps are being avoided here. Testing rs.status().ok would pass on a degraded
      # set, because a shell that evaluates a falsy value still exits 0 -- the check has to assert
      # the value, not merely evaluate it. And rs.initiate() returns before the election completes,
      # so a check that stops at "initiated" lets a dependent start against a set that cannot yet
      # accept writes. The member is registered under the service name rather than localhost, because
      # the address recorded here is the one every client that discovers the topology will dial: under
      # localhost a client outside this container is sent to its own loopback, where the refusal reads
      # like a firewall problem and is not one.
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) };
         if (!db.hello().isWritablePrimary) { quit(1) }"
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 20s
    volumes:
      # A named volume, so registered connectors and applied artifacts outlive `down`. Only `down -v`
      # discards them, which then costs a full re-registration of every connector jar.
      - tapstate-quickstart-mongo:/data/db

  mysql:
    # The demo's source database, seeded and ready so the stack has something real to read. It is a
    # standing service, not a dependency of the server: the server's own store is Mongo, and this is
    # reached only later, by the connector a pipeline runs. A user pointing at their own database
    # instead simply ignores it.
    image: mysql:8.0
    # Row-based binary logging and a server id are what change-data-capture tails; the mysql:8 image
    # defaults would already serve CDC, but these are set explicitly so the demo advertises the same
    # replication posture the walkthrough documents. root already holds every replication grant, so
    # the demo needs no extra GRANT for the connector to read the binlog.
    command:
      - "--server-id=1"
      - "--log-bin=mysql-bin"
      - "--binlog-format=ROW"
      - "--gtid-mode=ON"
      - "--enforce-gtid-consistency=ON"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: appdb
    healthcheck:
      # Hold red until the server actually answers, mirroring the store check: mysqladmin ping fails
      # non-zero until the socket serves, and the credential proves the server finished its first-boot
      # initialization rather than merely opening the port.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psecret", "--silent"]
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 30s
    volumes:
      # The seed runs on an empty data directory only, so a named volume means it seeds once and then
      # the demo's rows persist across a restart, the same as the store.
      - tapstate-quickstart-mysql:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro

  postgres:
    # The demo's second source database, on a different engine from the first. That is the whole point
    # of it being here: the demo assembles one object out of two independent capture streams, and two
    # tables inside one database would not need assembling - a view or a join would do it. Two engines
    # have neither.
    #
    # A standing service like mysql above, not a dependency of the server.
    image: postgres:16
    # Logical decoding is what change-data-capture reads here, and unlike the mysql image's defaults
    # the postgres defaults do NOT serve it: wal_level ships as 'replica', which produces a WAL that
    # physical replication can follow and logical decoding cannot. Without this the connector's snapshot
    # half works and its stream half fails at slot creation, which is the confusing half-working state
    # this line exists to avoid.
    #
    # The slot and publication themselves are deliberately not created here. The connector creates its
    # own slot when the stream starts, and creating one up front would leave an unconsumed slot pinning
    # WAL for as long as the demo sits idle - the standard way a demo postgres fills its disk.
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      # Headroom for the slot the connector creates, plus room to create a second one without an
      # error that reads as a connector defect. The defaults are 10 each; these are small numbers
      # either way, and being explicit documents that the demo expects replication to be used.
      - "-c"
      - "max_wal_senders=4"
      - "-c"
      - "max_replication_slots=4"
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: appdb
    healthcheck:
      # The database name is named explicitly: pg_isready defaults to the connecting user's name, so
      # an unqualified check can pass against a server whose demo database is not there yet. The image
      # also starts a short-lived internal server during first-boot initialization, which is why this
      # asserts the real one by connecting over TCP rather than accepting any answer.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d appdb"]
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 30s
    volumes:
      # Same shape as mysql above: the seed runs on an empty data directory only, so a named volume
      # means it seeds once and the demo's rows survive a restart.
      - tapstate-quickstart-postgres:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

  server:
    # A demo directory is not a checkout, so this stack pulls a published image and never builds: a
    # build: here would point its context at a repository that is not there. Working from the source
    # tree adds the build back through docker-compose.dev.yml, which only exists inside the repository.
    # The tag is pinned rather than floating, so a demo brought up months apart runs the same server
    # both times; the quickstart smoke fails the build if it drifts from the version being built.
    image: ghcr.io/tapstate/tapstate:0.8.0
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      TAPSTATE_INSTALLATION_DIRECTORY: /var/lib/tapstate/installation
      TAPSTATE_CONNECTORS_SEED_DIR: /var/lib/tapstate/connectors
    volumes:
      - tapstate-quickstart-installation:/var/lib/tapstate
      - ./connectors:/var/lib/tapstate/connectors:ro
    ports:
      # Bound to the loopback interface: an unauthenticated first run must not be reachable from
      # other machines on the network.
      - "127.0.0.1:8080:8080"
    # The orderly stop closes the cluster member and the store client before halting. Docker's
    # default 10s grace can cut that short and turn a clean exit into a kill, so the window is set
    # wider than the stop has been observed to need.
    stop_grace_period: 30s

volumes:
  tapstate-quickstart-mongo:
  tapstate-quickstart-mysql:
  tapstate-quickstart-postgres:
  tapstate-quickstart-installation:
