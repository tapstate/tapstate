# Installer end-to-end lane: the CLI-only install path, on every supported platform.
#
# Proves the promise on the README: pipe the published install.sh into sh on a clean machine and end
# with a CLI that answers and authors offline. It dials the live domain the README names, not the file in
# this checkout - the published copy being stale or broken is exactly the failure this lane exists to
# catch, and reading the checkout cannot see it.
#
# This lane is the CLI half only. The full-stack promise - the compose quickstart that is the
# product's actual one-liner - has its own literal-from-the-docs witness in quickstart-live.yml;
# macOS runners have no Docker, so this four-platform lane is exactly the half that can run
# everywhere.
#
# Three parts:
#   - the real install: pipe the published script into sh, then `tapstate --version` (which must not
#     be a SNAPSHOT - the installer only serves releases) and the offline authoring loop (new +
#     validate), with no JDK and no toolchain being asked for;
#   - the negative paths: install-smoke.sh, the checked-in harness whose fixtures cover the
#     tampered-checksum, truncated-script and unsupported-platform cases without touching the
#     network - those must hold on every platform, not only where they were written;
#   - musl (Linux x64 only): the installer inside an Alpine container must refuse loudly - nonzero
#     exit, an actionable message, nothing half-installed;
#   - what the domain serves is the newest published release, byte for byte, at both entry points.
name: Installer e2e

on:
  workflow_dispatch:
  schedule:
    # Off the hour, like every scheduled lane here: on-the-hour slots queue behind everyone else's.
    - cron: "45 20 * * *"

concurrency:
  group: install-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    strategy:
      fail-fast: false
      # Runner labels mirror release.yml, which learned the hard way that a removed label queues
      # forever rather than failing: macos-13 is gone, macos-14 deprecated, and Intel now carries
      # an explicit -intel label while the plain label is Apple Silicon.
      matrix:
        include:
          - { runner: macos-15,         platform: darwin-arm64 }
          - { runner: macos-15-intel,   platform: darwin-x64 }
          - { runner: ubuntu-latest,    platform: linux-x64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install from the published script
        run: |
          set -eu
          curl -sSL https://install.tapstate.dev/cli | sh
          bin="$HOME/.tapstate/bin/tapstate"
          test -x "$bin"
          version="$("$bin" --version)"
          echo "installed: $version"
          case "$version" in
            *SNAPSHOT*) echo "the installer served a SNAPSHOT build" >&2; exit 1 ;;
          esac
      - name: Offline authoring loop on the installed binary
        run: |
          set -eu
          bin="$HOME/.tapstate/bin/tapstate"
          mkdir demo && cd demo
          "$bin" new -y --kind source --id my_db --connector mysql
          "$bin" validate
      - name: Re-run is an in-place upgrade, not an accretion
        # Compare the tree against itself before and after a second run, rather than against a
        # literal file count. The bundle's shape is not this test's subject and it does change --
        # a hard-coded count silently stopped testing re-runs the day the MCP sidecar, LICENSE and
        # NOTICE joined the binary, because it then failed on the *first* install. What accretion
        # actually looks like is a second version directory left standing beside the first, so
        # assert that directly too: an installer that unpacks beside the old version instead of
        # replacing it fails the version-count check even if the file count happened to match.
        run: |
          set -eu
          before="$(find "$HOME/.tapstate/bin" -type f | wc -l | tr -d ' ')"
          curl -sSL https://install.tapstate.dev/cli | sh
          after="$(find "$HOME/.tapstate/bin" -type f | wc -l | tr -d ' ')"
          test "$after" = "$before" || {
            echo "a re-run changed the file count: $before -> $after" >&2
            find "$HOME/.tapstate/bin" -type f >&2
            exit 1
          }
          versions="$(find "$HOME/.tapstate/bin/versions" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          test "$versions" = "1" || {
            echo "a re-run left $versions version directories, want 1" >&2
            find "$HOME/.tapstate/bin/versions" -mindepth 1 -maxdepth 1 -type d >&2
            exit 1
          }
          test -L "$HOME/.tapstate/bin/tapstate" || { echo "the stable entry is not a link" >&2; exit 1; }
      - name: Negative paths against the checked-in fixtures
        run: bash install/install-smoke.sh

  published-is-the-newest-release:
    # What the domain serves is a deployment, not a branch, so nothing about it is proven by reading
    # this checkout. This job resolves the newest published release, reconstructs what its tag would
    # deploy, and holds the live edge to it byte for byte.
    #
    # It exists because the jobs above could not see the failure they look like they cover. Their only
    # version assertion was "not a SNAPSHOT", which a script pinned to any older release passes: the
    # published one-liner installed 0.2.0 for a whole release cycle while every pin in the tree read
    # 0.2.1, and this lane was green every night of it.
    #
    # The comparison target is the release tag, not this branch. The edge's promise is "the newest
    # published release", so an installer change sitting unreleased on main is not a failure -- and a
    # lane that reddened on that would be red most weeks and read by nobody.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Both entry points serve the newest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$(.github/scripts/latest-release-tag.sh)"
          echo "newest published release: $tag"
          git fetch --quiet origin "refs/tags/$tag:refs/tags/$tag" 2>/dev/null || true
          site="$(mktemp -d)"
          git show "$tag:deploy/quickstart/quickstart.sh" > "$site/quickstart.sh"
          git show "$tag:install/install.sh"              > "$site/install.sh"
          sh deploy/install-site/verify-published.sh https://install.tapstate.dev "$site"

  musl-refuses-loudly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: The installer refuses Alpine with a usable message and no residue
        # The script under test is the local file on purpose here: the case is the refusal logic, and
        # published-is-the-newest-release below is what holds the served copy to the release's file.
        run: |
          set -eu
          docker run --rm -v "$PWD/install:/install:ro" alpine:3 sh -c '
            set -eu
            if sh /install/install.sh > /tmp/out 2>&1; then
              echo "the installer succeeded on musl, which it must not" >&2
              exit 1
            fi
            grep -qi musl /tmp/out || { echo "the refusal does not say why:"; cat /tmp/out; exit 1; } >&2
            test ! -e /root/.tapstate || { echo "a refused install left residue" >&2; exit 1; }
          '
