# SonarQube quality-gate analysis.
# Runs the SonarScanner against the SonarQube server, waits for the quality gate, and fails
# the job when the gate is not green. On a pull request it also posts a sticky comment with
# the gate status, the failing conditions, and a dashboard link, because this SonarQube
# instance is Community Edition and cannot decorate pull requests itself.
#
# Decoupled from the fast build gate (ci.yml) on purpose: this workflow depends on an external
# server, a secret, and network egress, none of which should be able to block the core build.
# A fork pull request has no access to secrets, so the guard step skips the analysis rather than
# failing - a red there would make outside contributions unmergeable, which no configuration can
# work around. It stays green but never silently: a skipped run says so in a notice annotation and
# in the job summary, because a required check's green tick otherwise reads as "quality measured"
# to every reviewer. The same guard means the workflow is a no-op until the SONAR_TOKEN /
# SONAR_HOST_URL secrets are configured, so adding this file never reddens CI.
#
# Secrets (repo Settings -> Secrets and variables -> Actions):
#   SONAR_TOKEN     a least-privilege project-analysis token (never an admin token)
#   SONAR_HOST_URL  the server base URL (kept out of the tree so the address is not public)
#
# Intended to become a required status check on main once a baseline analysis exists and the
# New Code definition is set on the server; until then it reports without blocking.
name: SonarQube

on:
  push:
    branches:
      - main
    # Release tags analyze main under the release version. The project's New Code definition
    # is "previous version", so a tagged release creates a version event that resets the
    # baseline; later analyses then measure new code since the last release.
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  # Manual trigger, so main can be re-analyzed on demand from the Actions tab after the
  # server-side quality gate or New Code definition changes, without waiting for a push.
  workflow_dispatch:

# Community Edition keeps a single project state, so concurrent analyses would clobber each
# other. Serialize them; do not cancel in progress, since a half-finished analysis is worse
# than a queued one.
concurrency:
  # Keep the Community Edition project serialized within each PR, but do not let one PR
  # consume or cancel another PR's required SonarQube check while it is waiting in the queue.
  group: sonarqube-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret availability
        id: guard
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          if [ -n "${SONAR_TOKEN:-}" ] && [ -n "${SONAR_HOST_URL:-}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=false" >> "$GITHUB_OUTPUT"

          # From here the job ends green having analyzed nothing, and saying that quietly is the
          # dangerous part: this is a required check, so the checks list shows the same tick here
          # as on a run where the quality gate genuinely passed. Whoever reviews an outside
          # contribution reads that tick as "quality measured" - and so do we, on our own repository,
          # if the secrets are ever rotated away.
          #
          # Failing instead is not the repair. A fork's workflow run cannot be given repository
          # secrets by any configuration, so a red here would mean no outside contribution can ever
          # merge - the failure this workflow's fork guard exists to avoid. The fix is not to change
          # the colour but to stop the colour from being the only thing said.
          if [ "${IS_FORK_PR:-false}" = "true" ]; then
            why="this pull request comes from a fork, and a fork's workflow run is never given repository secrets"
          else
            why="SONAR_TOKEN / SONAR_HOST_URL are not configured on this repository"
          fi
          echo "::notice title=SonarQube not evaluated::No analysis ran: ${why}. This check is green because it was skipped, not because the quality gate passed."
          {
            printf '## SonarQube: not evaluated\n\n'
            printf 'No analysis ran on this commit, because %s.\n\n' "$why"
            printf '**This check is green because it was skipped, not because the quality gate passed.**\n\n'
            printf 'Neither code quality nor the new-code coverage condition was measured here. The\n'
            printf 'diff-coverage summary on the CI workflow is what a run without secrets can still\n'
            printf 'produce; the quality gate itself is measured once the change reaches `main`.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for accurate new-code dating and SCM blame

      - name: Set up JDK 21
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # verify runs the reactor (tests + JaCoCo report), then sonar:sonar submits the analysis.
      # sonar.qualitygate.wait makes the scanner block on the gate and fail this step when it is
      # not green - that failure is what turns the PR check red. sonar.login carries the token
      # (the form the SonarQube 9.9 server documents).
      - name: Build, test and analyze
        id: analyze
        if: steps.guard.outputs.run == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          set -euo pipefail
          args=(
            -Dsonar.projectKey=tapstate
            -Dsonar.host.url="$SONAR_HOST_URL"
            -Dsonar.login="$SONAR_TOKEN"
            -Dsonar.qualitygate.wait=true
          )
          # On a release tag (e.g. v1.2.3) stamp the analysis with the release version (strip the
          # leading v), so it creates a version event. With the "previous version" New Code
          # definition, that resets the baseline; other builds keep the pom's default version.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            args+=("-Dsonar.projectVersion=${GITHUB_REF_NAME#v}")
          fi
          mvn -B verify

          # A second pass over the execution data before the analysis reads it. Each module's report
          # otherwise describes that module's classes against that module's own runs, and a type
          # declared in one ring and exercised from another therefore reads as untested while the
          # runs it really got sit in another module's exec file. Merging every exec file and
          # re-reporting rewrites each module's report against all of them - same classes per
          # module, all executions. Measured on the read face: seven spi-store types went from 0.0%
          # to 93.6% between the two passes, with no test added.
          mvn -B -N jacoco:merge@jacoco-merge-reactor
          mvn -B jacoco:report@jacoco-report-reactor

          mvn -B sonar:sonar "${args[@]}"

      # Best-effort PR decoration for Community Edition. Runs even when the analyze step failed
      # (that is exactly the gate-red case worth commenting on); continue-on-error keeps a comment
      # glitch from ever flipping a green job to red - the analyze step is the sole gate authority.
      - name: Comment quality gate on PR
        if: always() && steps.guard.outputs.run == 'true' && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          host="${SONAR_HOST_URL%/}"
          dashboard="$host/dashboard?id=tapstate&pullRequest=${PR_NUMBER}"

          # This instance has the Community Branch Plugin, so the PR is analyzed as a pull request
          # whose new code is its diff against the base branch. Query the gate in that PR context,
          # not the main branch (which would read empty). The analyze step already waited for the
          # gate and concurrency serializes runs, so this status is this run's.
          ps="$(curl -s -u "$SONAR_TOKEN:" "$host/api/qualitygates/project_status?projectKey=tapstate&pullRequest=${PR_NUMBER}" || true)"
          status="$(printf '%s' "$ps" | jq -r '.projectStatus.status // "UNKNOWN"' 2>/dev/null || echo UNKNOWN)"
          details="$(printf '%s' "$ps" | jq -r '.projectStatus.conditions[]? | select(.status=="ERROR") | "- `\(.metricKey)`: \(.actualValue) (fails \(.comparator) \(.errorThreshold))"' 2>/dev/null || true)"

          case "$status" in
            OK)    emoji="white_check_mark";   verdict="passed" ;;
            ERROR) emoji="x";                  verdict="failed" ;;
            # NONE = the gate could not be evaluated because there is no New Code to measure
            # (the "Sonar way" conditions are all on new code; the first analysis, or one with
            # no New Code baseline set on the server, has nothing to compare against). Not a failure.
            NONE)  emoji="information_source"; verdict="not evaluated (no New Code baseline yet)" ;;
            *)     emoji="warning";            verdict="unknown (see the workflow logs)" ;;
          esac

          {
            printf '<!-- sonarqube-gate -->\n'
            printf '### :%s: SonarQube quality gate: **%s**\n\n' "$emoji" "$verdict"
            if [ -n "${details:-}" ]; then
              printf 'Failing conditions:\n%s\n\n' "$details"
            fi
            printf '[Open the pull-request dashboard](%s)\n\n' "$dashboard"
            printf '_Posted by CI from the SonarQube pull-request quality gate._\n'
          } > comment.md

          existing="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | contains("<!-- sonarqube-gate -->")) | .id' 2>/dev/null | head -n1 || true)"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$(cat comment.md)" >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$(cat comment.md)" >/dev/null
          fi
          echo "Posted quality gate comment (status=${status})."
