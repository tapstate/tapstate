# Build a pinned release candidate or the next main-line version for Cloud development validation.
# Main owns the mutable -dev tag; branch builds use their source SHA in the tag.
# Configure cloud-ghcr-dev with VITE_CLOUD_CONSOLE_URL and reuse the Public
# tapstate-cloud package with workflow write access. The repository's
# RELEASE_SATELLITE_TOKEN supplies private Web reads; no plaintext artifacts are uploaded.
name: cloud-cluster-dev
run-name: Cloud cluster dev (${{ inputs.bump }})

on:
  workflow_call:
    inputs:
      version:
        description: "Release version already selected by the caller."
        type: string
        required: true
      source-sha:
        description: "Frozen Tapstate commit selected by the release."
        type: string
        required: true
      web-sha:
        description: "Frozen Web commit selected by the release."
        type: string
        required: true
  workflow_dispatch:
    inputs:
      bump:
        description: "Next version from main's release history. Branch images receive a source-specific dev tag."
        type: choice
        options: [minor, patch, major]
        required: true

permissions:
  contents: read

concurrency:
  group: cloud-cluster-dev-image
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'tapstate/tapstate' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    environment: cloud-ghcr-dev
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-sha || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: resolve the pinned candidate or standalone dev version
        id: source
        env:
          BUMP: ${{ inputs.bump }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.source-sha }}
          RELEASE_WEB_SHA: ${{ inputs.web-sha }}
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ -n "$RELEASE_VERSION" ]]; then
            [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$RELEASE_WEB_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
            echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          else
            test -z "$RELEASE_SHA$RELEASE_WEB_SHA"
            git fetch origin main --tags
            .github/scripts/next-version.sh "$BUMP" origin/main >> "$GITHUB_OUTPUT"
          fi
      - name: apply the version to build inputs
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: .github/scripts/set-version.sh "$VERSION"
      - uses: actions/checkout@v4
        with:
          repository: tapstate/tapstate-web
          ref: ${{ inputs.web-sha || github.ref_name }}
          token: ${{ secrets.RELEASE_SATELLITE_TOKEN }}
          path: tapstate-web
          persist-credentials: false
      - name: pin the selected Web ref
        id: web
        run: echo "sha=$(git -C tapstate-web rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: load registration tooling from the workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow-tools
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: validate the dev version registration configuration
        if: inputs.version != '' || github.ref == 'refs/heads/main'
        env:
          CLOUD_RELEASE_API_URL: ${{ vars.CLOUD_RELEASE_API_URL }}
          CLOUD_RELEASE_CODE: ${{ vars.CLOUD_RELEASE_CODE }}
          CLOUD_CLUSTER_VERSION_RELEASE_TOKEN: ${{ secrets.CLOUD_CLUSTER_VERSION_RELEASE_TOKEN_DEV }}
        run: node workflow-tools/scripts/notify-cloud-dev.mjs --validate
      - name: enable the pinned package manager
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: tapstate-web/pnpm-lock.yaml
      - name: build Cloud Web for the dev Console
        working-directory: tapstate-web
        env:
          VITE_CLOUD_CONSOLE_URL: ${{ vars.VITE_CLOUD_CONSOLE_URL }}
          WEB_SHA: ${{ steps.web.outputs.sha }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          bash ../scripts/build-web-assets.sh --web-root . \
            --web-revision "$WEB_SHA" --web-profile cloud \
            --cloud-console-url "$VITE_CLOUD_CONSOLE_URL"
      - name: stage the pinned Cloud Web bundle
        env:
          VITE_CLOUD_CONSOLE_URL: ${{ vars.VITE_CLOUD_CONSOLE_URL }}
          WEB_SHA: ${{ steps.web.outputs.sha }}
          TAPSTATE_SHA: ${{ steps.source.outputs.sha }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          bash scripts/prepare-web-assets.sh --web-root tapstate-web \
            --web-revision "$WEB_SHA" --web-profile cloud \
            --cloud-console-url "$VITE_CLOUD_CONSOLE_URL" \
            --tapstate-revision "$TAPSTATE_SHA" --release-version "$VERSION" \
            --output app/target/generated-resources/tapstate-web
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: build the Cloud Boot JAR
        run: mvn -B -pl app -am -DskipTests package
      - name: read the Cloud build provenance
        id: provenance
        env:
          WEB_SHA: ${{ steps.web.outputs.sha }}
        run: |
          set -euo pipefail
          properties=app/target/classes/META-INF/tapstate-web.properties
          files_sha256="$(sed -n 's/^files.sha256=//p' "$properties")"
          console_url="$(sed -n 's/^cloud.console.url=//p' "$properties")"
          [[ "$files_sha256" =~ ^[0-9a-f]{64}$ ]]
          grep -Fxq "revision=$WEB_SHA" "$properties"
          grep -Fxq 'web.profile=cloud' "$properties"
          test -n "$console_url"
          mapfile -t boot_jars < <(find app/target -maxdepth 1 -type f -name 'app-*-boot.jar')
          test "${#boot_jars[@]}" -eq 1
          {
            echo "files-sha256=$files_sha256"
            echo "console-url=$console_url"
            echo "boot-jar-sha256=$(sha256sum "${boot_jars[0]}" | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"
      - name: stage the locked connector and license bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cloud-jars"
          assets="$(jq -r '.connectors[].id + "-connector.jar", .licenseFiles[].name' deploy/cloud/connectors.lock.json)"
          patterns=()
          while IFS= read -r asset; do
            patterns+=(--pattern "$asset")
          done <<< "$assets"
          gh release download connectors-preview --repo tapstate/tapstate \
            "${patterns[@]}" --dir "$RUNNER_TEMP/cloud-jars"
          PYTHONDONTWRITEBYTECODE=1 python3 deploy/cloud/stage-connectors.py \
            --lock deploy/cloud/connectors.lock.json --jar-dir "$RUNNER_TEMP/cloud-jars" \
            --stage-dir "$RUNNER_TEMP/cloud-stage"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: build the dual-platform Cloud OCI archive
        env:
          VERSION: ${{ steps.source.outputs.version }}
          TAPSTATE_SHA: ${{ steps.source.outputs.sha }}
          WEB_SHA: ${{ steps.web.outputs.sha }}
          WEB_FILES_SHA256: ${{ steps.provenance.outputs.files-sha256 }}
          CLOUD_CONSOLE_URL: ${{ steps.provenance.outputs.console-url }}
        run: |
          docker buildx build --progress=plain --target cloud \
            --file deploy/docker/Dockerfile --platform linux/amd64,linux/arm64 \
            --build-context "cloud_connectors=$RUNNER_TEMP/cloud-stage" \
            --build-arg "TAPSTATE_RELEASE_VERSION=$VERSION" \
            --build-arg "TAPSTATE_REVISION=$TAPSTATE_SHA" \
            --build-arg "TAPSTATE_WEB_REVISION=$WEB_SHA" \
            --build-arg "TAPSTATE_WEB_FILES_SHA256=$WEB_FILES_SHA256" \
            --build-arg TAPSTATE_WEB_PROFILE=cloud \
            --build-arg "TAPSTATE_WEB_CLOUD_CONSOLE_URL=$CLOUD_CONSOLE_URL" \
            --output "type=oci,dest=$RUNNER_TEMP/cloud-image.tar" .
      - name: verify both platforms and their build inputs
        id: verify
        env:
          VERSION: ${{ steps.source.outputs.version }}
          TAPSTATE_SHA: ${{ steps.source.outputs.sha }}
          WEB_SHA: ${{ steps.web.outputs.sha }}
          CLOUD_CONSOLE_URL: ${{ steps.provenance.outputs.console-url }}
          BOOT_SHA256: ${{ steps.provenance.outputs.boot-jar-sha256 }}
        run: |
          set -euo pipefail
          mapfile -t boot_jars < <(find app/target -maxdepth 1 -type f -name 'app-*-boot.jar')
          test "${#boot_jars[@]}" -eq 1
          mkdir "$RUNNER_TEMP/cloud-layout"
          tar -xf "$RUNNER_TEMP/cloud-image.tar" -C "$RUNNER_TEMP/cloud-layout"
          PYTHONDONTWRITEBYTECODE=1 python3 deploy/cloud/verify-image.py \
            --oci-layout "$RUNNER_TEMP/cloud-layout" --lock deploy/cloud/connectors.lock.json \
            --boot-jar "${boot_jars[0]}" --web-profile cloud --cloud-console-url "$CLOUD_CONSOLE_URL"
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/web-provenance.py create \
            --oci-layout "$RUNNER_TEMP/cloud-layout" --output "$RUNNER_TEMP/cloud-provenance.json" \
            --version "$VERSION" --tapstate-revision "$TAPSTATE_SHA" --web-revision "$WEB_SHA" \
            --web-profile cloud --cloud-console-url "$CLOUD_CONSOLE_URL" --boot-jar-sha256 "$BOOT_SHA256"
          digest="$(jq -er '.manifests | if length == 1 then .[0].digest else error("root count") end' \
            "$RUNNER_TEMP/cloud-layout/index.json")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: publish only the checked dev image
        id: publish
        env:
          CLOUD_GHCR_USERNAME: ${{ vars.CLOUD_GHCR_USERNAME }}
          CLOUD_GHCR_TOKEN: ${{ secrets.CLOUD_GHCR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.source.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          DIGEST: ${{ steps.verify.outputs.digest }}
        run: |
          args=(publish-dev --archive "$RUNNER_TEMP/cloud-image.tar" \
            --version "$VERSION" --expected-digest "$DIGEST")
          if [[ -z "$RELEASE_VERSION" && "$GITHUB_REF" != refs/heads/main ]]; then
            args+=(--dev-source-sha "$SOURCE_SHA")
          fi
          bash deploy/cloud/ghcr-publish.sh "${args[@]}"
      - name: report the dev deployment image
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          TAG: ${{ steps.publish.outputs.tag }}
          TAPSTATE_SHA: ${{ steps.source.outputs.sha }}
          WEB_SHA: ${{ steps.web.outputs.sha }}
        run: |
          test -n "$IMAGE"
          printf "Dev image: \`%s\`\n\nDigest reference: \`%s\`\n\nTapstate source: \`%s\`\n\nWeb source: \`%s\`\n" \
            "$TAG" "$IMAGE" "$TAPSTATE_SHA" "$WEB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: register the checked image in the dev Cloud version catalog
        if: inputs.version != '' || github.ref == 'refs/heads/main'
        env:
          DEV_VERSION: ${{ steps.source.outputs.version }}
          DEV_SHA: ${{ steps.source.outputs.sha }}
          DEV_WEB_SHA: ${{ steps.web.outputs.sha }}
          DEV_BRANCH: main
          DEV_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLOUD_IMAGE: ${{ steps.publish.outputs.image }}
          CLOUD_IMAGE_TAG: ${{ steps.publish.outputs.tag }}
          CLOUD_IMAGE_DIGEST: ${{ steps.verify.outputs.digest }}
          CLOUD_RELEASE_API_URL: ${{ vars.CLOUD_RELEASE_API_URL }}
          CLOUD_RELEASE_CODE: ${{ vars.CLOUD_RELEASE_CODE }}
          CLOUD_CLUSTER_VERSION_RELEASE_TOKEN: ${{ secrets.CLOUD_CLUSTER_VERSION_RELEASE_TOKEN_DEV }}
        run: node workflow-tools/scripts/notify-cloud-dev.mjs
      - name: explain the release validation checkpoint
        if: inputs.version != ''
        run: |
          {
            echo "Validate the dev image above in Cloud dev, using its digest reference."
            echo "A repeated dev version may retain an older catalog record; verify the running image digest."
            echo "Then review the draft release and use Review deployments to Approve or Reject this run."
            echo "Reject stops the release; the dev image and catalog entry remain available for diagnosis."
          } >> "$GITHUB_STEP_SUMMARY"
