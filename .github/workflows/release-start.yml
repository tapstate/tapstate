name: release-start

# Pin what a release ships, in every repository it ships from, before the expensive part starts.
#
# There is exactly one manual step in a release, and it is here: stop merging to the default branch,
# dispatch this, and start merging again as soon as it reports the branch. Everything this runs is a
# read -- the conclusions already recorded on the commit, the version implied by its ancestry, the
# documentation follow-ups for the range, whether the token reaches the satellites -- plus four ref
# creations. No build, no test, no image. That is deliberate: the freeze is only as long as this
# workflow, so this workflow does nothing that takes time.
#
# The heavy half runs afterwards, dispatched against the branch: building four binaries and two image
# architectures, the release gates, the approval. That is the part a release actually waits on, and
# it is also the part during which the default branch has to be free -- which it is, because what
# ships is `ws/release-<version>` from here on and nothing merged after this point is in it.
#
# What this asks of the commit before pinning it, and why each one is here rather than later:
#
#   the required checks are green   the commit is sound. Read off what already ran on it; nothing is
#                                   started here, so a commit whose checks are still running is
#                                   refused rather than waited for
#   the documentation has landed    the satellites are pinned at their default branch tips, so a
#                                   release started before its pages are merged cuts a documentation
#                                   tag from a commit that predates them -- and that tag is what
#                                   publishes the documentation
#
# What it does NOT ask is the rest of the release gates. They answer "may this go out", which is the
# question the branch exists to let you work towards, and they need the build this deliberately does
# not run.
#
# Fixes for the release land on `main` first and are cherry-picked onto the branch, never the other
# way round: a fix born on a release branch is one somebody has to remember to carry forward, and
# forgetting leaves no trace until the same bug ships again.
#
# Nothing here is irreversible. A branch created against the wrong commit is deleted and made again.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "How big is this release? The version number follows from this and the commit's history."
        type: choice
        options: [minor, patch, major]
        required: true
      commit:
        description: "Which commit to pin. Leave empty for the tip of the default branch."
        type: string
        required: false

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: which commit is being pinned
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          want="${{ inputs.commit }}"
          if [ -z "$want" ]; then
            want="$(git rev-parse HEAD)"
          fi
          sha="$(git rev-parse "$want^{commit}")"
          # A commit that is not on the default branch has not been through the merge-result build, so
          # "its checks are green" would be answering about something else.
          if ! git merge-base --is-ancestor "$sha" origin/${{ github.event.repository.default_branch }}; then
            echo "$sha is not an ancestor of the default branch; it has not been built as a merge result." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Pinning $sha" >> "$GITHUB_STEP_SUMMARY"

      # Both of the next two let the script's own exit code fail the step. Each explains its refusal
      # in its own words -- including the difference between a check still running and one that has
      # concluded red, which need different answers from a person -- and a wrapper here would only
      # restate that less well, or not at all: the default shell runs with -e, so anything after the
      # failing line never runs.
      - name: the required checks are green on that commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/checks-on-commit.sh \
            --sha "${{ steps.sha.outputs.sha }}" \
            --from-ruleset "${{ github.event.repository.default_branch }}"

      - name: what version this becomes
        id: version
        run: |
          set -euo pipefail
          bash .github/scripts/next-version.sh "${{ inputs.bump }}" "${{ steps.sha.outputs.sha }}" \
            | tee -a "$GITHUB_OUTPUT"

      # The pages for this release have to be written and merged before it starts. That is the same
      # gate the release itself runs, asked here because here it is cheap to act on -- nothing has
      # been created yet, so finishing the pages and dispatching again costs nothing. Asked later it
      # is a release sitting at its first gate with three branches already cut.
      #
      # This is about the pages for what is shipping. Publishing the site is a separate thing, asked
      # for below in an issue, and it deliberately does not gate anything.
      - name: the documentation for this range has landed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/docs-gate.sh \
            --base "${{ steps.version.outputs.base }}" \
            --sha "${{ steps.sha.outputs.sha }}" \
            --bump "${{ inputs.bump }}"

      - name: the satellite token reaches every satellite
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SATELLITE_TOKEN }}
        run: |
          set -euo pipefail
          # Before any branch exists, not after. A token that cannot reach one of them is worth finding
          # out about while nothing has been created, rather than with three of four repositories pinned.
          bash .github/scripts/satellites.sh reach | tee -a "$GITHUB_STEP_SUMMARY"

      - name: pin tapstate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="ws/release-${{ steps.version.outputs.version }}"
          # An existing branch is refused rather than moved. Moving it is the one operation that would
          # silently change what a release ships after somebody has already looked at it.
          if gh api "repos/${{ github.repository }}/git/ref/heads/$branch" >/dev/null 2>&1; then
            echo "$branch already exists. Delete it if this release is being re-pinned." >&2
            exit 1
          fi
          gh api "repos/${{ github.repository }}/git/refs" \
            -f "ref=refs/heads/$branch" -f "sha=${{ steps.sha.outputs.sha }}" >/dev/null
          echo "${{ github.repository }}  $branch created at ${{ steps.sha.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"

      - name: pin every satellite
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SATELLITE_TOKEN }}
        run: |
          set -euo pipefail
          bash .github/scripts/satellites.sh branch "${{ steps.version.outputs.version }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # The documentation site is not pinned and gets no branch: Netlify builds it from `next` as the
      # preview and `main` as what the public sees, so a third branch across that pair would publish
      # nothing or publish the wrong thing. What the release needs from it is a person merging `next`
      # into `main`, so it is asked for in an issue. It gates nothing -- see the script for what
      # happens when it is not done by the time the release publishes.
      - name: ask for the documentation site to be published
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SATELLITE_TOKEN }}
        run: |
          bash .github/scripts/docs-release.sh open "${{ steps.version.outputs.version }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: what happens next
        run: |
          {
            echo
            echo "### Pinned — start merging again"
            echo
            echo "\`ws/release-${{ steps.version.outputs.version }}\` now exists in tapstate, tapstate-skills and tapstate-web."
            echo "The documentation site is not pinned and gets no branch; it was asked for in an issue, and it gates nothing."
            echo "The freeze is over: \`main\` is free to carry on, and nothing merged from here is in this release."
            echo "The expensive half runs next, against the branch, and the default branch is not part of it."
            echo
            echo "Fixes for this release land on \`main\` first, then are cherry-picked onto the branch."
            echo "When the release gates are green on it, dispatch \`release\` with"
            echo "\`bump=${{ inputs.bump }}\` and \`commit\` set to the branch tip."
          } >> "$GITHUB_STEP_SUMMARY"
