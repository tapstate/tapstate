# Making a release, end to end, from two answers a person gives and nothing else.
#
# The person says how big the change is (`bump`) and, if it is not the tip of the default branch,
# which commit ships (`commit`). Everything else is worked out: the version number, every file that
# pins it, the assets, the checksums, the platform minimums, whether this release is the newest line.
# There is deliberately no input for the version, for the release notes, for skipping a check, or for
# "docs are ready" -- a switch a person can flip is not a check, and each one is another way to
# produce a release that did not go the standard way.
#
# One dispatch, two halves, with a person in the middle:
#
#   1. machine   work out the version -> write it into all six places that pin it -> build and smoke
#                four native CLI binaries -> build both server image architectures into a local
#                archive, pushing nothing -> check the release is complete -> create a DRAFT release,
#                which is private and creates no tag
#   2. person    the run pauses on an environment with required reviewers. Read the draft on the
#                Releases page, edit the body if it needs it, then Approve or Reject in Actions
#   3. machine   publish the draft, which creates the tag -> push the image archive -> point the
#                floating "latest" marker here, but only if this release is ahead of every other
#
# The three irreversible acts -- creating the tag, publishing, pushing the image -- are all in step 3,
# all after the pause, and all done by the machine. A person judges; a person does not operate. Moving
# a tag by hand used to be a step in this process, and it was the one step nothing checked.
#
# Reject, or let the approval time out, and nothing is left behind: the draft is deleted, no tag was
# ever created, no image was ever pushed, and the version number is unspent -- the next dispatch works
# out the same one. That is also how a rehearsal is done now. There used to be a `dry_run` input for
# it, which had the property that the rehearsal did not go down the same code path as the real thing;
# the part it could never rehearse was the release body.
#
# The image is built early and pushed late for the same reason. Building it before the check means the
# completeness check can look inside the archive and see both architectures -- a registry manifest
# would only exist after the push, which would put an irreversible act before the check that is
# supposed to gate it. The archive is two independent sources reconciled, not a build grading itself.
#
# Connector jars are not part of a versioned release; they are carried by a floating prerelease that
# is republished on its own schedule. The completeness check knows that, so their absence here is a
# recorded boundary rather than a gap nobody noticed.
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "How big is this release? The version number follows from this and the commit's history."
        type: choice
        options: [minor, patch, major]
        required: true
      commit:
        description: "Which commit ships. Leave empty for the tip of the default branch."
        type: string
        required: false

permissions:
  contents: read

jobs:
  version:
    # The pin, and the whole of the freeze. Merging to the default branch stops when this is
    # dispatched and may resume the moment this job goes green. That it is a job and not a step is the
    # point: a person watching the run sees it finish, rather than having to find one step inside a
    # long-running one to know the freeze is over.
    #
    # Everything here is a read plus four ref creations -- the conclusions already recorded on the
    # commit, the version its ancestry implies, the documentation follow-ups for the range, whether
    # the token reaches the satellites. No build, no test, no image. That is what keeps the freeze
    # short, and it is why a commit whose checks are still running is refused rather than waited for.
    #
    # An attempt is atomic. What this pins is what the attempt releases or throws away; no branch
    # outlives the attempt that made it, and nothing is carried by hand from one attempt to the next.
    # A fix for a failed attempt goes to the default branch, and the next attempt picks it up by
    # starting from there.
    name: pin (the freeze lasts exactly this long)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # this repository's own release branch
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      is_latest: ${{ steps.next.outputs.is_latest }}
      sha: ${{ steps.sha.outputs.sha }}
      # The tag the version was counted up from. Two jobs downstream need the same range -- the
      # documentation gate and the notes -- and working it out a second time is a second chance to
      # take the newest tag in the repository rather than the newest one on this commit's ancestry.
      base: ${{ steps.next.outputs.base }}
    steps:
      # Full history and every tag: the version is counted up from the newest version tag on this
      # commit's own ancestry, and a shallow checkout can see neither the ancestry nor the tags.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.ref }}
          fetch-depth: 0
      - id: sha
        run: |
          set -euo pipefail
          default='${{ github.event.repository.default_branch }}'
          # Asked for by name rather than assumed to be present: checking out an explicit commit does
          # not guarantee a remote-tracking ref for the default branch, and the ancestry test below
          # would then fail for the wrong reason.
          git fetch --no-tags origin "+refs/heads/$default:refs/remotes/origin/$default"
          sha="$(git rev-parse HEAD)"
          # A commit that is not on the default branch has not been through the merge-result build, so
          # "its checks are green" would be answering about something else.
          if ! git merge-base --is-ancestor "$sha" "origin/$default"; then
            echo "$sha is not an ancestor of the default branch; it has not been built as a merge result." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Let the script's own exit code fail the step. It explains its refusal in its own words --
      # including the difference between a check still running and one that has concluded red, which
      # need different answers from a person -- and a wrapper here would restate that less well.
      - name: the required checks are green on that commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/checks-on-commit.sh \
            --sha "${{ steps.sha.outputs.sha }}" \
            --from-ruleset "${{ github.event.repository.default_branch }}"

      - id: next
        run: .github/scripts/next-version.sh "${{ inputs.bump }}" HEAD >> "$GITHUB_OUTPUT"
      # A patch is cherry-picked onto a line that has been overtaken, and a changeset riding along on
      # one is the failure nothing downstream can see: 0.5.1 takes a database to changeset 8, and
      # 0.6.0 -- which knows up to 7 -- then refuses to start against every instance 0.5.1 upgraded.
      # Both releases build, both install, and the two only ever meet on somebody's server.
      #
      # Vacuous today, and it says so in the log rather than passing in silence: no changeset exists
      # in any tree yet. It is here now because the path that would carry one onto an old line is
      # being built now, and a check added after the first patch release was not there for it.
      - name: a patch ships the same changesets as the release it patches
        if: inputs.bump == 'patch'
        run: .github/scripts/changeset-parity.sh "${{ steps.next.outputs.base }}" HEAD

      # The pages for this release have to be written and merged before it starts. That is the same
      # gate the release itself runs, asked here because here it is cheap to act on -- nothing has
      # been created yet, so finishing the pages and dispatching again costs nothing. Asked later it
      # is a release sitting at its first gate with three branches already cut.
      #
      # This is about the pages for what is shipping. Publishing the site is a separate thing, asked
      # for below in an issue, and it deliberately does not gate anything.
      - name: the documentation for this range has landed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/docs-gate.sh \
            --base "${{ steps.next.outputs.base }}" \
            --sha "${{ steps.sha.outputs.sha }}" \
            --bump "${{ inputs.bump }}"

      - name: the satellite token reaches every satellite
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SATELLITE_TOKEN }}
        run: |
          set -euo pipefail
          # Before any branch exists, not after. A token that cannot reach one of them is worth finding
          # out about while nothing has been created, rather than with three of four repositories pinned.
          bash .github/scripts/satellites.sh reach | tee -a "$GITHUB_STEP_SUMMARY"

      - name: pin this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="ws/release-${{ steps.next.outputs.version }}"
          # An existing branch is refused rather than moved. Moving it is the one operation that would
          # silently change what a release ships after somebody has already looked at it. Nothing
          # legitimately leaves one behind any more -- the cleanup job retires them however an attempt
          # ends -- so one standing here means an attempt is still running, or one died in a way worth
          # looking at before starting another.
          if gh api "repos/${{ github.repository }}/git/ref/heads/$branch" >/dev/null 2>&1; then
            echo "$branch already exists. An attempt for this version is running, or one ended without cleaning up." >&2
            exit 1
          fi
          gh api "repos/${{ github.repository }}/git/refs" \
            -f "ref=refs/heads/$branch" -f "sha=${{ steps.sha.outputs.sha }}" >/dev/null
          echo "${{ github.repository }}  $branch created at ${{ steps.sha.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"

      - name: pin every satellite
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SATELLITE_TOKEN }}
        run: |
          set -euo pipefail
          bash .github/scripts/satellites.sh branch "${{ steps.next.outputs.version }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # The documentation site is not pinned and gets no branch: Netlify builds it from `next` as the
      # preview and `main` as what the public sees, so a third branch across that pair would publish
      # nothing or publish the wrong thing. What the release needs from it is a person merging `next`
      # into `main`, so it is asked for in an issue. It gates nothing -- see the script for what
      # happens when it is not done by the time the release publishes, and for what happens to the
      # request when the attempt is abandoned instead.
      - name: ask for the documentation site to be published
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SATELLITE_TOKEN }}
        run: |
          bash .github/scripts/docs-release.sh open "${{ steps.next.outputs.version }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: say what this run is about to make
        run: |
          {
            echo "### Releasing ${{ steps.next.outputs.tag }} -- start merging again"
            echo
            echo "* commit: \`${{ steps.sha.outputs.sha }}\`"
            echo "* newest line: ${{ steps.next.outputs.is_latest }} (decides whether the floating \`latest\` marker moves here)"
            echo
            echo "The freeze is over: the default branch is free to carry on, and nothing merged from here is in this release."
            echo "The expensive half runs next, against \`ws/release-${{ steps.next.outputs.version }}\`, and the default branch is not part of it."
            echo
            echo "If this attempt does not publish, everything it created is retired and nothing is carried forward."
            echo "A fix goes to the default branch, and the next attempt starts from there."
          } >> "$GITHUB_STEP_SUMMARY"

  cli-native:
    needs: version
    strategy:
      fail-fast: false
      # Platform differences come from the runner + toolchain, never a Maven profile; os/arch are fixed
      # labels here so the published asset names are a stable contract, not uname output. Only the
      # newest two macOS versions are hosted, so a runner label ages out of existence rather than
      # failing loudly: a job asking for a removed one queues forever with no runner assigned and never
      # reports an error. The Intel image carries an explicit -intel label; the plain label is Apple
      # Silicon.
      matrix:
        include:
          - { runner: macos-15,         os: darwin, arch: arm64 }
          - { runner: macos-15-intel,   os: darwin, arch: x64 }
          - { runner: ubuntu-latest,    os: linux,  arch: x64 }
          - { runner: ubuntu-24.04-arm, os: linux,  arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      # Before anything is built. The version enters the tree once, here, and the build downstream of
      # it cannot disagree with the release it is part of.
      - name: write the release version into every file that pins one
        shell: bash
        run: .github/scripts/set-version.sh "${{ needs.version.outputs.version }}"
      - uses: graalvm/setup-graalvm@v1
        with:
          # The native artifact is the CLI only. The MCP sidecar remains a JVM Boot JAR, so this
          # release stays on the project's JDK 21 baseline instead of requiring a Java 25 AOT toolchain.
          java-version: '21'
          distribution: 'liberica'   # Liberica NIK 21 (GPLv2+CPE) -- the release toolchain; Oracle GraalVM (GFTC) is local dev only
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: register the Liberica NIK JDK as the Maven toolchain (version 21, any vendor)
        shell: bash
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/toolchains.xml <<EOF
          <toolchains>
            <toolchain>
              <type>jdk</type>
              <provides><version>21</version></provides>
              <configuration><jdkHome>${JAVA_HOME}</jdkHome></configuration>
            </toolchain>
          </toolchains>
          EOF
      - name: build the native CLI, MCP Boot JAR, and bundle assembly
        run: mvn -B -Pnative -pl cli,control/mcp-server,distribution/cli-bundle -am -DskipTests package
      - name: native smoke (black-box against the produced binary, offline + online)
        run: bash cli/native-smoke.sh cli/target/tapstate
      - name: MCP stdio smoke (Boot JAR sidecar)
        shell: bash
        run: |
          jar="$(find control/mcp-server/target -maxdepth 1 -name 'mcp-server-*-boot.jar' -print -quit)"
          test -n "$jar"
          bash control/mcp-server/mcp-smoke.sh "$jar"
      # Read the oldest system this binary can run on back out of the binary, rather than asserting one.
      # Both platforms tie the answer to the machine that built it, and the hosted build machines move,
      # so measuring is what keeps the published number true without anyone having to remember. The two
      # measurements answer the same question and differ only in where the answer is written down.
      #
      # macOS: a native image is stamped with the build machine's deployment target, dyld enforces it at
      # load time, and no build flag tried so far moves it -- so the number is a fact about this runner,
      # not a choice, and it rises on its own as runner labels age out.
      - name: measure the macOS version this binary was stamped with
        if: matrix.os == 'darwin'
        shell: bash
        run: |
          floor="$(vtool -show-build cli/target/tapstate | awk '/minos/ { print $2; exit }')"
          [ -n "$floor" ] || { echo "vtool reported no minos for cli/target/tapstate"; exit 1; }
          echo "${{ matrix.os }}-${{ matrix.arch }} macos $floor" > "${{ matrix.os }}-${{ matrix.arch }}.minimum"
          cat "${{ matrix.os }}-${{ matrix.arch }}.minimum"
      # Linux: the binary links glibc dynamically, and the loader refuses any symbol version the running
      # glibc does not carry. The answer is the newest GLIBC_x.y it actually references, which is not the
      # build image's own glibc -- these are built against a far newer one than they need. Nor can it be
      # read off a failure: the loader lists the versions whichever machine you tried happens to lack, so
      # the list depends on that machine and its first line is not the highest. Ask the binary instead.
      - name: measure the glibc version this binary requires
        if: matrix.os == 'linux'
        shell: bash
        run: |
          floor="$(objdump -T cli/target/tapstate | grep -oE 'GLIBC_[0-9.]+' | sed 's/GLIBC_//' | sort -uV | tail -1)"
          [ -n "$floor" ] || { echo "objdump found no GLIBC_ symbol versions in cli/target/tapstate"; exit 1; }
          echo "${{ matrix.os }}-${{ matrix.arch }} glibc $floor" > "${{ matrix.os }}-${{ matrix.arch }}.minimum"
          cat "${{ matrix.os }}-${{ matrix.arch }}.minimum"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-minimum-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ matrix.os }}-${{ matrix.arch }}.minimum
          if-no-files-found: error
      - name: package the release asset
        shell: bash
        run: |
          version='${{ needs.version.outputs.version }}'
          asset="tapstate-${version}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          bundle="$(find distribution/cli-bundle/target -type f -name '*-native.tar.gz' | head -1)"
          [ -n "$bundle" ] || { echo "native CLI bundle assembly not found" >&2; exit 1; }
          cp "$bundle" "$asset"
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  server-image:
    # A sibling of the CLI matrix again, which it could not be while it pushed: the push is the one act
    # here that cannot be taken back, and it has moved to after the approval. What is left is a build,
    # and a build that fails costs nothing. The Spring Boot jar is platform-independent, so both
    # architectures share the one jar and differ only in the JRE base image and its apt layer, which is
    # what makes building arm64 under emulation cheap.
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: write the release version into every file that pins one
        run: .github/scripts/set-version.sh "${{ needs.version.outputs.version }}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: build the boot jar the image ships
        run: mvn -B -pl app -am -DskipTests package
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # Into a local archive, not a registry. The completeness check reads both architectures out of
      # this archive; a registry manifest would only exist after a push, and a push before the approval
      # is exactly what this rearrangement removes.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}
          outputs: type=oci,dest=${{ runner.temp }}/server-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: server-image
          path: ${{ runner.temp }}/server-image.tar
          if-no-files-found: error

  connectors:
    # The one lane that drives real Tapdata connectors, started here so it overlaps the build
    # instead of following it. It is not in any merge gate -- the default build has no connector
    # jars -- so without this a release could go out having never been run against the connectors
    # at all, which is the first thing a user touches.
    #
    # Dispatched, not waited on here: this job starts it and the gate below joins. Measured medians
    # are ~38 minutes for the lane against ~7 for everything else, so starting it after the build
    # would add the whole 38 to every release rather than overlapping it.
    #
    # `workflow_dispatch` takes a branch or tag, never a bare commit. When the release commit is the
    # tip of the ref this was dispatched from, that ref is the commit and the lane can be started.
    # When it is not -- a fix built from an older line's branch -- nothing is started, and the gate
    # then asks for a run that already exists on that commit. It refuses if there is none, which is
    # the correct answer: it says the lane has not seen this commit.
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write   # dispatch the connector lane
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: start the real-connector lane on the commit being released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip="$(gh api "repos/${{ github.repository }}/commits/${GITHUB_REF_NAME}" --jq '.sha' 2>/dev/null || true)"
          if [ "$tip" != "${{ needs.version.outputs.sha }}" ]; then
            echo "The release commit is not the tip of ${GITHUB_REF_NAME}, so the lane cannot be dispatched at it."
            echo "The gate will ask for a run that already succeeded on ${{ needs.version.outputs.sha }}."
            exit 0
          fi
          gh workflow run nightly-real-connectors.yml --ref "${GITHUB_REF_NAME}"
          echo "Dispatched the real-connector lane on ${GITHUB_REF_NAME} (${tip})."

  gates:
    # The release gate. Six conditions, all decided by machine, none of them a box a person can tick
    # -- a switch somebody can flip is not a check, and every one of them is another way to produce a
    # release that did not go the standard way.
    #
    # Two of the six are not steps here, because they are already the reason this job can run at all,
    # and re-asserting them would be this workflow grading its own dependency graph:
    #
    #   2. the release smoke tests are green   `cli-native` runs the native and MCP smokes against
    #                                          each produced binary; a red one fails that job and
    #                                          nothing downstream of it starts
    #   3. the distribution is complete        `release-manifest.sh`, in the job below, opening every
    #                                          asset before the draft is assembled
    #
    # The four that are steps are the ones nothing else was asking.
    needs: [version, connectors, cli-native, server-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0   # the notes and the docs gate both read the range back to the previous tag

      - name: The gates still decide the way they are supposed to
        run: |
          shellcheck .github/scripts/checks-on-commit.sh .github/scripts/checks-on-commit-smoke.sh \
            .github/scripts/docs-gate.sh .github/scripts/docs-gate-smoke.sh \
            .github/scripts/release-notes.sh .github/scripts/release-notes-smoke.sh \
            .github/scripts/docs-impact.sh .github/scripts/_pr-section.sh
          bash .github/scripts/checks-on-commit-smoke.sh
          bash .github/scripts/docs-gate-smoke.sh
          bash .github/scripts/release-notes-smoke.sh

      # 1. The required checks ran on this commit and were green. Not "the last run was green" -- the
      #    set is read from the branch's rules at this moment rather than copied into this file, and
      #    every name in it has to be present before any conclusion is looked at.
      - name: 1. the required checks are green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/checks-on-commit.sh \
            --sha "${{ needs.version.outputs.sha }}" \
            --from-ruleset "${{ github.event.repository.default_branch }}"

      # 6. And so is the connector lane, which no merge gate covers. This is where the lane started
      #    in `connectors` is joined: poll until it has finished on this commit, then judge it the
      #    same way as everything else. Failing closed in both directions is the point -- a lane that
      #    never started and a lane still running are both refusals, and neither can be read off a
      #    count of failures.
      - name: 6. the real-connector lane is green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$(( SECONDS + 75 * 60 ))
          while true; do
            .github/scripts/checks-on-commit.sh --sha "${{ needs.version.outputs.sha }}" --required real-connectors && break
            # 3 is the only answer worth waiting on: nothing has concluded yet. Anything else has
            # concluded something, and polling a lane that already failed would burn the whole
            # deadline printing that it is waiting.
            [ "$?" = 3 ] || exit 1
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::the real-connector lane has not finished on ${{ needs.version.outputs.sha }} within 75 minutes"
              exit 1
            fi
            echo "waiting for the real-connector lane..."
            sleep 60
          done

      # 4. Every pull request in this release's range answered its documentation impact, and the ones
      #    that said documentation was needed have it. How strictly the second half is read comes from
      #    this release's own bump, which is the only semantic thing a person stated.
      - name: 4. the documentation for this range has landed
        env:
          GH_TOKEN: ${{ secrets.DOCS_REPO_TOKEN || github.token }}
        run: |
          .github/scripts/docs-gate.sh \
            --base "${{ needs.version.outputs.base }}" \
            --sha "${{ needs.version.outputs.sha }}" \
            --bump "${{ inputs.bump }}"

      # 5. The notes exist, assembled rather than remembered. Assembling them here rather than in the
      #    job that creates the draft is what makes this a gate: a range that cannot be collected, or
      #    a base tag that is not in this history, stops the release instead of producing a release
      #    with an empty body.
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-minimum-*
          path: minimums
          merge-multiple: true
      # Publish the minimums as an asset the installer reads, and say the same thing in the notes. Both
      # come from the same measurement, so the promise made to a reader and the check made on a user's
      # machine can never drift apart -- and neither needs anyone to remember to update a number.
      - name: platform-minimums.txt + the requirement sentences for the notes
        shell: bash
        run: |
          cat minimums/*.minimum | sort > platform-minimums.txt
          cat platform-minimums.txt
          # One sentence per requirement kind: a single version when every platform agrees, and per
          # platform when they do not, which they need not -- the legs are built on separate machines.
          summarize() {   # $1 = requirement, $2 = how to name it to a reader
            local distinct
            distinct="$(awk -v k="$1" '$2 == k { print $3 }' platform-minimums.txt | sort -uV)"
            [ -n "$distinct" ] || return 0
            if [ "$(echo "$distinct" | wc -l)" -eq 1 ]; then
              echo "Recommended $2: $distinct or newer."
            else
              echo "Recommended $2: $(awk -v k="$1" '$2 == k { printf "%s%s or newer on %s", sep, $3, $1; sep="; " } END { print "." }' platform-minimums.txt)"
            fi
          }
          {
            echo "MACOS_REQ=$(summarize macos macOS)"
            echo "GLIBC_REQ=$(summarize glibc glibc)"
          } | tee -a "$GITHUB_ENV"
      - name: 5. the release notes assemble
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/release-notes.sh \
            --version "${{ needs.version.outputs.version }}" \
            --base "${{ needs.version.outputs.base }}" \
            --sha "${{ needs.version.outputs.sha }}" \
            --macos-req "${MACOS_REQ}" \
            --glibc-req "${GLIBC_REQ}" \
            > release-notes.md
          test -s release-notes.md
      # Both halves of what the next job needs from this one: the body it publishes, and the asset
      # whose numbers that body quotes. One measurement, so the sentence a reader is given and the
      # check made on their machine cannot drift apart.
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: |
            release-notes.md
            platform-minimums.txt
          if-no-files-found: error

      # Before the tag exists, deliberately. Publishing is irreversible, and a token that turns out not
      # to reach one of the satellites afterwards leaves a released tapstate whose documentation
      # repository never got the tag -- and there the tag is not bookkeeping, it is what makes the
      # documentation public. This is the only gate here about a credential rather than about the code.
      - name: 7. the satellite token reaches every satellite
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SATELLITE_TOKEN }}
        run: |
          .github/scripts/satellites.sh reach

      - name: what the gate decided
        run: |
          {
            echo "### Release gate for ${{ needs.version.outputs.tag }}"
            echo
            echo "| | gate | where it was decided |"
            echo "|---|---|---|"
            echo "| 1 | required CI green on \`${{ needs.version.outputs.sha }}\` | this job |"
            echo "| 2 | release smoke green | \`cli-native\`, which this job needs |"
            echo "| 3 | distribution complete | \`draft\`, before the release is assembled |"
            echo "| 4 | documentation for the range has landed | this job |"
            echo "| 5 | release notes assemble | this job |"
            echo "| 6 | real-connector lane green on that commit | this job |"
            echo "| 7 | satellite token reaches every satellite | this job |"
          } >> "$GITHUB_STEP_SUMMARY"

  draft:
    needs: [version, cli-native, server-image, gates]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the draft release
    outputs:
      url: ${{ steps.create.outputs.url }}
      # The handle everything downstream uses. A release's tag name is not one: the approver is asked
      # to edit this draft's body, and an edit that does not re-send `tag_name` blanks it to
      # `untagged-<hex>`, after which a lookup by tag misses a release sitting right there.
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      # The completeness check asks the compose file which image a quickstart user runs, so the tree it
      # asks has to be the tree this release was built from.
      - name: write the release version into every file that pins one
        run: .github/scripts/set-version.sh "${{ needs.version.outputs.version }}"
      # Take only the CLI assets. An unfiltered download pulls in whatever else the other jobs upload,
      # so this job's success came to depend on artifacts it never uses, and one that failed to download
      # sank the whole release step.
      - uses: actions/download-artifact@v4
        with:
          pattern: tapstate-*.tar.gz
          path: staging
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: server-image
          path: image
      # The body the gate assembled, and the minimums asset whose numbers that body quotes. Both are
      # taken from the gate rather than rebuilt here: a body assembled twice can differ from the one
      # that was checked, and a release whose notes were never gated is what gate 5 exists to prevent.
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes
      - name: checksums (per-asset .sha256 + aggregate checksums.txt)
        shell: bash
        run: |
          cp notes/platform-minimums.txt staging/
          cd staging
          for f in tapstate-*.tar.gz; do sha256sum "$f" > "$f.sha256"; done
          sha256sum tapstate-*.tar.gz > checksums.txt
          ls -la
      # Every check that can be made before anything leaves the runner, is made before anything leaves
      # the runner. What this catches is a release that looks successful and is missing a piece: a
      # platform the installer offers with no asset behind it, an architecture that quietly did not
      # build, or one of the two files nothing automated ever fetches.
      - name: the release is complete
        shell: bash
        run: |
          mkdir -p image/layout
          tar -xf image/server-image.tar -C image/layout
          .github/scripts/release-manifest.sh "${{ needs.version.outputs.version }}" staging image/layout
      - name: assemble the draft release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ needs.version.outputs.sha }}
          # Private until a person publishes it, and it creates no tag while it is a draft. Whether this
          # release becomes the floating `latest` is decided at publish time, from whether it is ahead
          # of every other version -- not here, and never by hand.
          draft: true
          name: tapstate ${{ needs.version.outputs.tag }}
          # The body was assembled and checked under gate 5. `body_path`, never an inline body: the
          # four disclosures in it -- what an insert-only target can end up with, what a positioning
          # change stream can miss, that this is not for production, and that delivery is at-least-once
          # -- are load-bearing, and as a literal here nothing could assert they were still present.
          body_path: notes/release-notes.md
          # GitHub's own list of merged pull requests, appended after that body. It is the backstop for
          # everything nobody wrote a sentence for, and it is the reason the assembled body never
          # writes a "## What's Changed" of its own.
          generate_release_notes: true
          files: |
            staging/tapstate-*.tar.gz
            staging/tapstate-*.tar.gz.sha256
            staging/checksums.txt
            staging/platform-minimums.txt
      - name: where to look before approving
        run: |
          {
            echo "### Draft ${{ needs.version.outputs.tag }} is ready for review"
            echo
            echo "[Read it here](${{ steps.create.outputs.url }}), edit the body if it needs editing,"
            echo "then come back to this run and Approve or Reject."
            echo
            echo "Reject and nothing is left: the draft is deleted, no tag exists, no image was pushed,"
            echo "and the next dispatch works out ${{ needs.version.outputs.tag }} again."
          } >> "$GITHUB_STEP_SUMMARY"

  approve:
    # Nothing but the pause. The environment carries the required reviewers, and this job exists so the
    # run stops here rather than inside the job that does the irreversible work.
    #
    # The `release` environment needs required reviewers configured, and needs "Prevent self-review"
    # left OFF -- what this pause is for is that somebody looked, not that a second person did, and
    # switching it on deadlocks a release nobody else is around for. It must also not carry a
    # deployment branch policy limiting it to the default branch: a release can legitimately be built
    # from an older line's branch, and the policy would refuse exactly those.
    needs: [version, draft]
    runs-on: ubuntu-latest
    environment: release
    steps:
      # An environment that does not exist is created on first use with no rules at all, and a job
      # naming it then runs straight through. That failure is invisible in every direction: the YAML
      # says `environment: release`, the run is green, the release goes out, and nothing anywhere
      # reports that the review step did not happen. So the pause checks that it was a pause. Refusing
      # here still costs nothing -- the draft is deleted, no tag was created, no image was pushed.
      - name: the pause has to be a real pause
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reviewers="$(gh api "repos/${{ github.repository }}/environments/release" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length' 2>/dev/null || echo 0)"
          if [ "${reviewers:-0}" -lt 1 ]; then
            echo "the 'release' environment has no required reviewers, so this run never paused for one." >&2
            echo "nothing was published. Add reviewers under Settings > Environments > release, then dispatch again." >&2
            exit 1
          fi
          echo "Approved ${{ needs.version.outputs.tag }}."

  publish:
    needs: [version, draft, approve]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publishing the draft is what creates the tag
      packages: write   # push the image to GHCR under the repository's own namespace
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: server-image
          path: image
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The archive built before the approval, pushed unchanged. Not rebuilt: a rebuild here would push
      # something no check has looked at, and the whole point of the archive is that what ships is what
      # was checked.
      - name: push the server image that was built and checked
        shell: bash
        run: |
          mkdir -p image/layout
          tar -xf image/server-image.tar -C image/layout
          digest="$(jq -r '.manifests[0].digest' image/layout/index.json)"
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}" \
            "oci-layout://$(pwd)/image/layout@${digest}"
      # Publishing is what creates the tag, at the commit the draft named. `--notes` is deliberately not
      # passed: whoever reviewed the draft may have edited the body, and re-sending the assembled body
      # would silently put their edit back the way it was.
      #
      # `make_latest` is the floating pointer, and it is the reason a fix to an older line is worked
      # out from that line's own history. Publishing 0.5.1 after 0.6.0 must not point new installs at
      # 0.5.1.
      #
      # By release id, and `tag_name` sent rather than inherited. The draft is reached by the one
      # handle the approval point cannot change: an edit to the body that omits `tag_name` blanks it
      # to `untagged-<hex>`, and both this step and the cleanup meant to catch it then look for a
      # release by a name it no longer answers to. Measured 2026-09-02 -- the publish failed, the
      # orphan draft outlived the run, and the version was spent.
      - name: publish the draft, and move the floating pointer only if this is the newest line
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          published="$(gh api -X PATCH \
            "repos/${{ github.repository }}/releases/${{ needs.draft.outputs.id }}" \
            -F draft=false \
            -f tag_name="${{ needs.version.outputs.tag }}" \
            -f make_latest="${{ needs.version.outputs.is_latest }}" \
            --jq '.tag_name')"
          # The one field that changed silently the day this went wrong, so it is the one read back.
          # Publishing under a blanked tag would put `untagged-<hex>` on a real release and a real
          # git tag -- worse than the failure it replaced, because that one at least stopped.
          if [ "$published" != "${{ needs.version.outputs.tag }}" ]; then
            echo "published as '$published', expected '${{ needs.version.outputs.tag }}'" >&2
            exit 1
          fi
      - name: what went out
        run: |
          {
            echo "### Published ${{ needs.version.outputs.tag }}"
            echo
            echo "* image: \`ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}\`"
            echo "* floating \`latest\` marker moved here: ${{ needs.version.outputs.is_latest }}"
          } >> "$GITHUB_STEP_SUMMARY"

  satellites:
    # Tagged only after tapstate's own release is published, never alongside it. A satellite release
    # points at the tapstate release, so one tagged first would link to a page that does not exist yet;
    # and for the documentation repository the tag is not bookkeeping but the thing that makes the
    # documentation public, which must not happen ahead of the release it documents.
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # deleting tapstate's own release branch at the end
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: tag and release every satellite
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SATELLITE_TOKEN }}
        run: |
          .github/scripts/satellites.sh release "${{ needs.version.outputs.version }}" \
            --notes-url "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.version.outputs.tag }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      # Not pinned, not gated, and not allowed to stop this. The site is published by a person merging
      # one branch into another, which was asked for when the release started; this either finds that
      # done and creates the tag, or asks again in a new issue. It exits 0 either way -- a release
      # that stopped here would be hostage to one person's morning.
      - name: settle the documentation site
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SATELLITE_TOKEN }}
        run: |
          .github/scripts/docs-release.sh settle "${{ needs.version.outputs.version }}" \
            --notes-url "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.version.outputs.tag }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"


  roadmap:
    # The board says what shipped, and in which release. Nothing else does: the execution issue for a
    # line is closed when its pull request merges, which is before the release that carries it, so by
    # the time anything goes out the issue has been closed for days and cannot carry the answer.
    #
    # Every release, not only the newest line. A fix released onto an overtaken line shipped work too,
    # and leaving it off the roadmap is how an old line looks abandoned while it is being maintained.
    #
    # Allowed to fail, and that is the whole reason it is a job of its own. The release is already out
    # by the time this runs; holding it back over a roadmap that can be corrected by hand would trade
    # something that cannot be undone for something that can.
    needs: [version, publish]
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read   # the board is written with the app token below, not with this one
    steps:
      # Not GITHUB_TOKEN: it reaches this repository and nothing above it, and the board belongs to
      # the organization. `owner` is what widens the app token past this one repository.
      - id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CATALOG_BOT_APP_ID }}
          private-key: ${{ secrets.CATALOG_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0   # the range back to the previous tag is where the shipped work is read from
      - name: move what this release shipped to Shipped
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          # pipefail is on under `shell: bash`, so this pipeline would trip errexit and skip the
          # summary that exists to name which of the board, the field, the option or the credential
          # was the problem. Off for this one pipeline; PIPESTATUS still carries the script's status.
          set +o pipefail
          .github/scripts/roadmap-shipped.sh \
            --version "${{ needs.version.outputs.version }}" \
            --base "${{ needs.version.outputs.base }}" \
            --sha "${{ needs.version.outputs.sha }}" 2>&1 | tee roadmap.log
          code=${PIPESTATUS[0]}
          {
            echo "### Roadmap"
            echo
            sed 's/^/    /' roadmap.log
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

  write-back:
    # The version this release just took is written into the default branch, so the next release
    # counts up from it and the one-click demo on main points at something that exists.
    #
    # Only when this release is the newest line, and that condition is the whole job. Opening it for
    # a fix to an older line walks the default branch's version *backwards* -- 0.5.1 over 0.6.0 --
    # in a pull request where all six pins agree with each other, every existing check is green
    # (they compare the six against each other, not against what came before), and the person
    # merging it has no reason to look twice. Afterwards the demo on main installs an old tag and
    # the next `bump=minor` counts up from the wrong number.
    #
    # Forgetting to merge this is soft: main stays a version behind, pinned to a release that exists
    # and installs. That is why an app token is enough and no admin credential is wanted here -- this
    # pull request goes through the same checks as any other, and is allowed to wait.
    needs: [version, publish]
    if: needs.version.outputs.is_latest == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read   # everything this job writes, it writes with the app token below
    steps:
      # Not GITHUB_TOKEN. A push or a pull request made with it triggers no push or pull_request
      # workflow, by design, so every required check on the default branch would be permanently
      # absent -- not unverified but unmergeable. The token goes to checkout as well as to the pull
      # request step: with only the latter, the credentials checkout persisted are what push the
      # branch, the checks stay absent, and it looks exactly like the secret not being set.
      - id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CATALOG_BOT_APP_ID }}
          private-key: ${{ secrets.CATALOG_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.token.outputs.token }}
          ref: ${{ github.event.repository.default_branch }}
      - name: write the released version into every file that pins one
        run: .github/scripts/set-version.sh "${{ needs.version.outputs.version }}"
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.token.outputs.token }}
          branch: ws/write-back-${{ needs.version.outputs.version }}
          # Only the files that pin a version. Anything else in the tree at this point is not part of
          # this change and would arrive as a diff nobody asked a reviewer to read.
          add-paths: |
            pom.xml
            cli/src/main/java/io/tapstate/cli/Cli.java
            control/mcp-server/src/main/resources/application.properties
            deploy/quickstart/quickstart.sh
            install/install.sh
            deploy/quickstart/docker-compose.yml
          title: "Write ${{ needs.version.outputs.version }} into the version pins"
          commit-message: "Write ${{ needs.version.outputs.version }} into the version pins"
          body: |
            ${{ needs.version.outputs.tag }} is published and is the newest line, so the default
            branch should say so.

            Every one of these six files is written by `.github/scripts/set-version.sh`, which the
            release run had already applied inside its own runner -- that write is never committed,
            which is why the tag points at a tree still pinning the previous release and why this
            pull request exists.

            ## Linked issue

            none -- this pull request is not work anybody asked for. It is opened by the release run
            that has just published, and its whole content is the version that run took.

            ## Live verification scenario

            Check out this branch and run `.github/scripts/set-version.sh` with no argument: it makes
            every pin agree with `pom.xml`, so on this branch it must produce no diff at all. Then
            `mvn -q -pl cli -am package && java -jar cli/target/tapstate.jar --version` prints the
            same version this pull request writes.

            ## Documentation impact

            - **Draft in this repository:** none
            - **Public page it is headed for:** none

            ### Release note

            none -- version pins only, no user-visible change.

  cleanup:
    # However the attempt ended. An attempt is atomic: what it pinned is either released or thrown
    # away, and no branch outlives it -- a leftover one is not a pin anybody still needs, it is the
    # thing that refuses the next attempt. Measured twice in one day: a run died in `cli-native`,
    # before a draft existed, and the cleanup was conditional on a draft having been assembled, so it
    # never started; three branches in three repositories were deleted by hand both times.
    #
    # The condition carries the one exception rather than leaving it to a reader. A release that
    # published while its satellites were not finished being tagged still owes them those tags, and
    # their branches are the only remaining record of what the tags were meant to point at. Deleting
    # them there turns a half-finished release into one nobody can finish.
    #
    # Guarded on the version output rather than on the pin job's result: a pin that failed part way
    # through creating four refs is exactly the case with orphans to clear, and its job result is
    # `failure`. The output exists as soon as the version was computed, which is before any ref.
    needs: [version, draft, publish, satellites, roadmap, write-back]
    if: >-
      always()
      && needs.version.outputs.version != ''
      && !(needs.publish.result == 'success' && needs.satellites.result != 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: delete the draft that was not published
        if: needs.publish.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # An attempt that died before the draft was assembled has none to collect, and saying so is
          # not the same as saying it found a published release and left it alone. Both have happened.
          if [ -z "${{ needs.draft.outputs.id }}" ]; then
            echo "No draft was assembled, so there is none to delete." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Only ever a draft. Publish creates the tag and makes the release public one step before
          # its last, and `always()` fires on cancellation too, so a half-finished publish can leave a
          # real release here -- deleting that one keeps the tag and spends the version for good.
          #
          # By id, for the reason the publish is: the body edit that blanks a draft's tag orphans it
          # from every lookup by name, and this is the step that was supposed to collect it.
          if [ "$(gh api "repos/${{ github.repository }}/releases/${{ needs.draft.outputs.id }}" --jq '.draft' 2>/dev/null)" != true ]; then
            echo "${{ needs.version.outputs.tag }} is not an unpublished draft; leaving it alone." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api -X DELETE "repos/${{ github.repository }}/releases/${{ needs.draft.outputs.id }}"
          echo "Deleted the unpublished draft ${{ needs.version.outputs.tag }}. No tag was created, no image was pushed." >> "$GITHUB_STEP_SUMMARY"

      # The documentation site was asked, in an issue, to publish a version that is now not coming.
      # Nothing used to retire that request: two abandoned attempts at one version left two open
      # issues asking for it, side by side, and the person they are assigned to had no way to tell
      # either of them from a real one.
      - name: tell the documentation site this version is not coming
        if: needs.publish.result != 'success'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SATELLITE_TOKEN }}
        run: |
          .github/scripts/docs-release.sh retire "${{ needs.version.outputs.version }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Unconditional within this job, which is what the `if` above is for. Both of these are
      # idempotent: a branch that is already gone is reported and passes.
      - name: retire the satellite release branches
        if: always()
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SATELLITE_TOKEN }}
        run: |
          .github/scripts/satellites.sh unbranch "${{ needs.version.outputs.version }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: retire this repository's own release branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="ws/release-${{ needs.version.outputs.version }}"
          # On the published path the tag is the anchor from here on, and unlike a branch it cannot be
          # moved: a later patch for this line starts from the tag, so deleting this loses nothing.
          if gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$branch" >/dev/null 2>&1; then
            echo "${{ github.repository }}  $branch deleted" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "${{ github.repository }}  $branch was already gone" >> "$GITHUB_STEP_SUMMARY"
          fi
