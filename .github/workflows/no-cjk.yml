# Character check for an English-only repository.
#
# It asks whether every character is one this repository has agreed to use, and names the ones
# that are not. It used to ask the opposite - whether any character fell inside a list of CJK
# ranges - and the difference is which way it fails. The ranges in use here admitted Japanese
# kana, Korean hangul, Cyrillic look-alikes, the zero-width space and the right-to-left override,
# and when the check itself broke it turned green rather than red.
#
# What is allowed: ASCII, plus the code points enumerated in .github/charset-allowlist.txt. That
# file is the only place they are written down. Adding a character to it is a reviewed decision,
# the same as adding a path to .cjk-allowlist, which stays the escape hatch for a whole file.
#
# The workflow keeps the name it is registered under as a required status check. Renaming it would
# leave every pull request waiting on a check that never reports, which is worse than any red.
#
# The decision lives in a script, held to its own cases, which run first. It used to live in the
# `run:` blocks here, and that made this the one check nothing could reach: when its
# commit-message scan was broken into scanning nothing at all, it reported clean on every push
# until a person happened to read the diff. A false green is the same text as a real one.
name: no-cjk

on:
  push:
    branches:
      - main
      - "ws/**"
  pull_request:
    branches:
      - main
    # `edited` is not in the default set, and without it a red here cannot be cleared by fixing
    # what made it red: the body and the title are both editable, and editing one re-runs nothing.
    # The contributor's only remaining move is to push another commit, which is a strange thing to
    # ask for a typo in prose.
    types: [opened, synchronize, reopened, edited]

jobs:
  no-cjk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the commit-message scan

      - name: The gate still decides the way it is supposed to
        run: |
          shellcheck .github/scripts/no-cjk.sh .github/scripts/no-cjk-smoke.sh
          bash .github/scripts/no-cjk-smoke.sh

      - name: Every character in tracked files is on the allow-list
        run: bash .github/scripts/no-cjk.sh files

      # A commit message is repository content: this repository squashes with the commit-message
      # mode, so a message written in another language lands in main's history verbatim and the
      # merge does not launder it. Rewriting one afterwards means a force-push. So this step, like
      # the tracked-files step above, applies to everyone with no exception.
      - name: Every character in the commit messages is on the allow-list
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: bash .github/scripts/no-cjk.sh messages

      # A pull request body is conversational text, and that is a different thing from repository
      # content even though the same gate used to check both. English is this project's public
      # working language, but a person reporting a real defect in their own language is a
      # submission worth having, and a required check that reddens on their prose turns a habit
      # into a door. So the English-only habit is enforced here only where it is ours to keep:
      # pull requests from a branch in this repository.
      #
      # Narrowed at the step, never at the job. A job skipped by an `if` never reports its check
      # at all, and a required check that never reports leaves the pull request permanently
      # unmergeable - which converts "wrote CJK, so red" into something far worse and entirely
      # silent.
      - name: Every character in the pull request body is on the allow-list
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash .github/scripts/no-cjk.sh pr-body
