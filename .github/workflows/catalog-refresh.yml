name: Cloud version credential probe
run-name: Cloud version credential probe (dev and prod)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'tapstate/tapstate' && github.ref == 'refs/heads/ws/release-cloud-credential-probe'
    name: version API probe (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: dev
            endpoint: https://dev.cloud.tapstate.com/v1/api/cluster-versions
            secret_name: CLOUD_CLUSTER_VERSION_RELEASE_TOKEN_DEV
          - target: prod
            endpoint: https://cloud.tapstate.com/v1/api/cluster-versions
            secret_name: CLOUD_CLUSTER_VERSION_RELEASE_TOKEN_PROD
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify authentication without changing version records
        env:
          TARGET: ${{ matrix.target }}
          ENDPOINT: ${{ matrix.endpoint }}
          RELEASE_TOKEN: ${{ secrets[matrix.secret_name] }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { randomUUID } from 'node:crypto';
          import { appendFileSync } from 'node:fs';

          const target = process.env.TARGET;
          const endpoint = process.env.ENDPOINT;
          const token = (process.env.RELEASE_TOKEN || '').trim();
          const expectedEndpoint = {
            dev: 'https://dev.cloud.tapstate.com/v1/api/cluster-versions',
            prod: 'https://cloud.tapstate.com/v1/api/cluster-versions',
          }[target];
          if (!expectedEndpoint || endpoint !== expectedEndpoint || !token || /[\r\n]/.test(token)) {
            console.error('Probe configuration is missing or invalid.');
            process.exit(1);
          }

          // A random nonexistent version fails before any catalog state is saved.
          const url = `${endpoint}/connectivity-probe-${randomUUID()}/state`;
          const allowedCodes = new Set([
            'cluster.version-not-found',
            'cluster.release-token-invalid',
            'cluster.release-token-missing',
            'cluster.release-disabled',
          ]);
          async function probe(label, bearer, expectedStatus, expectedCode) {
            try {
              const response = await fetch(url, {
                method: 'PATCH',
                redirect: 'error',
                signal: AbortSignal.timeout(30000),
                headers: {
                  Authorization: `Bearer ${bearer}`,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({ state: 'OFFLINE' }),
              });
              const payload = await response.json().catch(() => null);
              const code = allowedCodes.has(payload?.code) ? payload.code : 'unexpected-response';
              const passed = response.status === expectedStatus && code === expectedCode;
              const result = `${target} ${label}: HTTP ${response.status}, code=${code}, ${passed ? 'PASS' : 'FAIL'}`;
              console.log(result);
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${result}\n\n`);
              return passed;
            } catch {
              // Never print request headers, token values, or raw remote content.
              console.error(`${target} ${label}: request failed before a verifiable API response.`);
              return false;
            }
          }

          const rejected = await probe('invalid-token control', `invalid-${randomUUID()}`, 401, 'cluster.release-token-invalid');
          const accepted = await probe('configured-secret', token, 404, 'cluster.version-not-found');
          if (!rejected || !accepted) process.exitCode = 1;
          NODE
