# Build one Cloud cluster image from the branch pair an operator selects, then publish it
# as ghcr.io/tapstate/tapstate-cloud:<next minor>-dev.
#
# The Tapstate branch supplies the server and its packaging scripts; the tapstate-web branch
# supplies the Cloud Web bundle. Both are read at the exact commits checked out here, so the
# published image carries their revisions in its labels.
#
# Environment cloud-ghcr-dev must provide:
#   vars.VITE_CLOUD_CONSOLE_URL   HTTPS Console URL baked into the Web bundle
#   vars.CLOUD_GHCR_USERNAME      GHCR account, or the workflow identity when omitted
#   secrets.CLOUD_GHCR_TOKEN      GHCR token with packages: write
#   secrets.RELEASE_SATELLITE_TOKEN  read access to the private tapstate-web repository
#
# This lane runs no test suite: the reactor packages the Boot JAR with -DskipTests, which skips
# test execution while test sources still compile for the modules that publish test-jars. The Web
# step only bundles its pinned checkout, and the image check below is a packaging assertion.
#
# Nothing is published when verification fails: the connector seed, the Web bundle, the Boot
# JAR and both image platforms are checked against the build inputs before the push.
name: build-cluster-image
run-name: Build cluster image (${{ inputs.tapstate_branch }} / ${{ inputs.tapstate_web_branch }})

on:
  workflow_dispatch:
    inputs:
      tapstate_branch:
        description: "tapstate branch to build"
        type: string
        default: main
        required: true
      tapstate_web_branch:
        description: "tapstate-web branch to package as the Cloud Web bundle"
        type: string
        default: main
        required: true

permissions:
  contents: read

concurrency:
  group: build-cluster-image-${{ inputs.tapstate_branch }}-${{ inputs.tapstate_web_branch }}
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'tapstate/tapstate'
    runs-on: ubuntu-latest
    environment: cloud-ghcr-dev
    permissions:
      contents: read
      packages: write
    outputs:
      json: ${{ steps.report.outputs.json }}
      buildVersion: ${{ steps.version.outputs.version }}
      image: ${{ steps.publish.outputs.image }}
      imageTag: ${{ steps.publish.outputs.tag }}
      imageDigest: ${{ steps.verify.outputs.digest }}
      webCommitId: ${{ steps.web.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tapstate_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: pin the Tapstate source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: resolve the build version
        id: version
        run: |
          set -euo pipefail
          git fetch --force --tags origin main
          .github/scripts/next-version.sh minor origin/main >> "$GITHUB_OUTPUT"
      - name: apply the version to build inputs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/set-version.sh "$VERSION"
      - uses: actions/checkout@v4
        with:
          repository: tapstate/tapstate-web
          ref: ${{ inputs.tapstate_web_branch }}
          token: ${{ secrets.RELEASE_SATELLITE_TOKEN }}
          path: tapstate-web
          persist-credentials: false
      - name: pin the Web source
        id: web
        run: echo "sha=$(git -C tapstate-web rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: enable the pinned package manager
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: tapstate-web/pnpm-lock.yaml
      - name: build Cloud Web for the Console
        working-directory: tapstate-web
        env:
          VITE_CLOUD_CONSOLE_URL: ${{ vars.VITE_CLOUD_CONSOLE_URL }}
          WEB_SHA: ${{ steps.web.outputs.sha }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          bash ../scripts/build-web-assets.sh --web-root . \
            --web-revision "$WEB_SHA" --web-profile cloud \
            --cloud-console-url "$VITE_CLOUD_CONSOLE_URL"
      - name: stage the pinned Cloud Web bundle
        env:
          VITE_CLOUD_CONSOLE_URL: ${{ vars.VITE_CLOUD_CONSOLE_URL }}
          WEB_SHA: ${{ steps.web.outputs.sha }}
          TAPSTATE_SHA: ${{ steps.source.outputs.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/prepare-web-assets.sh --web-root tapstate-web \
            --web-revision "$WEB_SHA" --web-profile cloud \
            --cloud-console-url "$VITE_CLOUD_CONSOLE_URL" \
            --tapstate-revision "$TAPSTATE_SHA" --release-version "$VERSION" \
            --output app/target/generated-resources/tapstate-web
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: build the Cloud Boot JAR
        run: mvn -B -pl app -am -DskipTests package
      - name: read the Cloud build provenance
        id: provenance
        env:
          WEB_SHA: ${{ steps.web.outputs.sha }}
        run: |
          set -euo pipefail
          properties=app/target/classes/META-INF/tapstate-web.properties
          files_sha256="$(sed -n 's/^files.sha256=//p' "$properties")"
          console_url="$(sed -n 's/^cloud.console.url=//p' "$properties")"
          [[ "$files_sha256" =~ ^[0-9a-f]{64}$ ]]
          grep -Fxq "revision=$WEB_SHA" "$properties"
          grep -Fxq 'web.profile=cloud' "$properties"
          test -n "$console_url"
          mapfile -t boot_jars < <(find app/target -maxdepth 1 -type f -name 'app-*-boot.jar')
          test "${#boot_jars[@]}" -eq 1
          {
            echo "files-sha256=$files_sha256"
            echo "console-url=$console_url"
            echo "boot-jar-sha256=$(sha256sum "${boot_jars[0]}" | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"
      - name: stage the locked connector and license bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cloud-jars"
          assets="$(jq -r '.connectors[].id + "-connector.jar", .licenseFiles[].name' deploy/cloud/connectors.lock.json)"
          patterns=()
          while IFS= read -r asset; do
            patterns+=(--pattern "$asset")
          done <<< "$assets"
          gh release download connectors-preview --repo tapstate/tapstate \
            "${patterns[@]}" --dir "$RUNNER_TEMP/cloud-jars"
          PYTHONDONTWRITEBYTECODE=1 python3 deploy/cloud/stage-connectors.py \
            --lock deploy/cloud/connectors.lock.json --jar-dir "$RUNNER_TEMP/cloud-jars" \
            --stage-dir "$RUNNER_TEMP/cloud-stage"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: build the dual-platform Cloud OCI archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAPSTATE_SHA: ${{ steps.source.outputs.sha }}
          WEB_SHA: ${{ steps.web.outputs.sha }}
          WEB_FILES_SHA256: ${{ steps.provenance.outputs.files-sha256 }}
          CLOUD_CONSOLE_URL: ${{ steps.provenance.outputs.console-url }}
        run: |
          set -euo pipefail
          docker buildx build --progress=plain --target cloud \
            --file deploy/docker/Dockerfile --platform linux/amd64,linux/arm64 \
            --build-context "cloud_connectors=$RUNNER_TEMP/cloud-stage" \
            --build-arg "TAPSTATE_RELEASE_VERSION=$VERSION" \
            --build-arg "TAPSTATE_REVISION=$TAPSTATE_SHA" \
            --build-arg "TAPSTATE_WEB_REVISION=$WEB_SHA" \
            --build-arg "TAPSTATE_WEB_FILES_SHA256=$WEB_FILES_SHA256" \
            --build-arg TAPSTATE_WEB_PROFILE=cloud \
            --build-arg "TAPSTATE_WEB_CLOUD_CONSOLE_URL=$CLOUD_CONSOLE_URL" \
            --output "type=oci,dest=$RUNNER_TEMP/cloud-image.tar" .
      - name: verify both platforms and their build inputs
        id: verify
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAPSTATE_SHA: ${{ steps.source.outputs.sha }}
          WEB_SHA: ${{ steps.web.outputs.sha }}
          CLOUD_CONSOLE_URL: ${{ steps.provenance.outputs.console-url }}
          BOOT_SHA256: ${{ steps.provenance.outputs.boot-jar-sha256 }}
        run: |
          set -euo pipefail
          mapfile -t boot_jars < <(find app/target -maxdepth 1 -type f -name 'app-*-boot.jar')
          test "${#boot_jars[@]}" -eq 1
          mkdir "$RUNNER_TEMP/cloud-layout"
          tar -xf "$RUNNER_TEMP/cloud-image.tar" -C "$RUNNER_TEMP/cloud-layout"
          PYTHONDONTWRITEBYTECODE=1 python3 deploy/cloud/verify-image.py \
            --oci-layout "$RUNNER_TEMP/cloud-layout" --lock deploy/cloud/connectors.lock.json \
            --boot-jar "${boot_jars[0]}" --web-profile cloud --cloud-console-url "$CLOUD_CONSOLE_URL"
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/web-provenance.py create \
            --oci-layout "$RUNNER_TEMP/cloud-layout" --output "$RUNNER_TEMP/cloud-provenance.json" \
            --version "$VERSION" --tapstate-revision "$TAPSTATE_SHA" --web-revision "$WEB_SHA" \
            --web-profile cloud --cloud-console-url "$CLOUD_CONSOLE_URL" --boot-jar-sha256 "$BOOT_SHA256"
          digest="$(jq -er '.manifests | if length == 1 then .[0].digest else error("root count") end' \
            "$RUNNER_TEMP/cloud-layout/index.json")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: publish the verified dev image
        id: publish
        env:
          CLOUD_GHCR_USERNAME: ${{ vars.CLOUD_GHCR_USERNAME }}
          CLOUD_GHCR_TOKEN: ${{ secrets.CLOUD_GHCR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.verify.outputs.digest }}
        run: |
          set -euo pipefail
          bash deploy/cloud/ghcr-publish.sh publish-dev \
            --archive "$RUNNER_TEMP/cloud-image.tar" \
            --version "$VERSION" --expected-digest "$DIGEST"
      - name: report the cluster image
        id: report
        env:
          TAPSTATE_BRANCH: ${{ inputs.tapstate_branch }}
          WEB_BRANCH: ${{ inputs.tapstate_web_branch }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.publish.outputs.image }}
          IMAGE_TAG: ${{ steps.publish.outputs.tag }}
          DIGEST: ${{ steps.verify.outputs.digest }}
          WEB_SHA: ${{ steps.web.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          json="$(jq -cn \
            --arg tapstate "$TAPSTATE_BRANCH" \
            --arg tapstateWeb "$WEB_BRANCH" \
            --arg buildVersion "$VERSION" \
            --arg image "$IMAGE" \
            --arg imageTag "$IMAGE_TAG" \
            --arg imageDigest "$DIGEST" \
            --arg webCommitId "$WEB_SHA" \
            --arg actionUri "$RUN_URL" \
            '{tapstate: $tapstate, tapstateWeb: $tapstateWeb, buildVersion: $buildVersion,
              image: $image, imageTag: $imageTag, imageDigest: $imageDigest,
              webCommitId: $webCommitId, actionUri: $actionUri}')"
          printf 'json=%s\n' "$json" >> "$GITHUB_OUTPUT"
          printf '```json\n%s\n```\n' "$json" >> "$GITHUB_STEP_SUMMARY"
