# Sharded tests and their merge-blocking aggregate build gate.
#   mvn verify — compile + unit tests + enforcer rules + ArchUnit ring rules + specifications
# Docs frontmatter validation (gen-index --check) lives with the docs in the
# separate private repo and is not run here. The zero-agent-footprint gate is a
# separate workflow (no-agent-footprint.yml).
# Specifications (e2e/*IT) run here against real containers: this runner has a Docker daemon, and
# the e2e module fails rather than skips when one is missing, so a green build here means they ran.
# On a developer machine they skip instead — and note Docker 29 rejects the API version the client
# negotiates by default, so running them locally needs -Dapi.version=1.44.
# Deliberately excluded for now: native-image build (pinned to local darwin-arm64 until D5) and the
# connector catalog *refresh* - regenerating it needs a connectors checkout and built connector jars.
# The catalog's own consistency gates are PDK-free and run in the build above; the shell that drives
# the refresh has its cases in the catalog-scripts job below.
name: CI

# PR events own automatic feature-branch tests. A branch push before or during a
# PR must not execute another suite. Use workflow_dispatch for pre-PR validation.
on:
  push:
    branches:
      - main
    # Release versions reset the previous-version new-code baseline.
    tags:
      - "v*"
  pull_request:
    branches:
      - main

  workflow_dispatch:

# Keep analyses serialized with manual pull-request analysis. Branch pushes can
# cancel superseded builds; an analysis already in progress must finish.
concurrency:
  group: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ws/') && format('ci-{0}-{1}', github.workflow, github.ref) || format('sonarqube-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ws/') }}

permissions:
  contents: read
  pull-requests: write

jobs:
  shard-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Derive every test from the current reactor
        run: .github/scripts/ci-shard.sh plan --root . --durations .github/ci-test-durations.json --output "$RUNNER_TEMP/shards.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-shard-plan
          path: ${{ runner.temp }}/shards.json
          if-no-files-found: error
          retention-days: 7

  test-shards:
    needs: shard-plan
    strategy:
      fail-fast: false
      matrix:
        shard: [e2e-1, e2e-2, engine, rest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: ci-shard-plan
          path: ${{ runner.temp }}
      # Only third-party dependencies are copied from the shared cache. This job's
      # install outputs live in its temporary repository and never enter that cache.
      - name: Seed an isolated dependency repository
        run: .github/scripts/ci-maven-cache.sh seed "$HOME/.m2/repository" "$RUNNER_TEMP/m2"
      - name: Build the reactor without running tests
        run: mvn -B -Dmaven.repo.local="$RUNNER_TEMP/m2" -DskipTests install
      - name: Execute exactly this shard
        env:
          SHARD: ${{ matrix.shard }}
        run: .github/scripts/ci-shard.sh run --plan "$RUNNER_TEMP/shards.json" --shard "$SHARD" --repo-local "$RUNNER_TEMP/m2"
      - name: Preserve downloaded dependencies
        if: always()
        run: .github/scripts/ci-maven-cache.sh collect "$HOME/.m2/repository" "$RUNNER_TEMP/m2"
      - name: Validate and package this shard's evidence
        env:
          SHARD: ${{ matrix.shard }}
        run: .github/scripts/ci-aggregate.sh pack --plan "$RUNNER_TEMP/shards.json" --shard "$SHARD" --output "$RUNNER_TEMP/ci-artifacts/$SHARD"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-test-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/ci-artifacts/
          if-no-files-found: error
          retention-days: 7
      - name: The scene where a shard failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-${{ matrix.shard }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            e2e/target/failure-scenes/
          if-no-files-found: ignore
          retention-days: 7

  # This stable, non-matrix name is the required check. It admits the union,
  # including every shard's declared report and coverage files, before reporting green.
  build:
    outputs:
      sonar-required: ${{ env.SONAR_REQUIRED }}
      sonar-enabled: ${{ steps.guard.outputs.run }}
      sonar-outcome: ${{ steps.analyze.outcome }}
    env:
      SONAR_REQUIRED: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ws/')) }}
    needs: [shard-plan, test-shards]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check secret availability
        id: guard
        if: env.SONAR_REQUIRED == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          if [ -n "${SONAR_TOKEN:-}" ] && [ -n "${SONAR_HOST_URL:-}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=false" >> "$GITHUB_OUTPUT"

          # From here the job ends green having analyzed nothing, and saying that quietly is the
          # dangerous part: this is a required check, so the checks list shows the same tick here
          # as on a run where the quality gate genuinely passed. Whoever reviews an outside
          # contribution reads that tick as "quality measured" - and so do we, on our own repository,
          # if the secrets are ever rotated away.
          #
          # Failing instead is not the repair. A fork's workflow run cannot be given repository
          # secrets by any configuration, so a red here would mean no outside contribution can ever
          # merge - the failure this workflow's fork guard exists to avoid. The fix is not to change
          # the colour but to stop the colour from being the only thing said.
          if [ "${IS_FORK_PR:-false}" = "true" ]; then
            why="this pull request comes from a fork, and a fork's workflow run is never given repository secrets"
          else
            why="SONAR_TOKEN / SONAR_HOST_URL are not configured on this repository"
          fi
          echo "::notice title=SonarQube not evaluated::No analysis ran: ${why}. This check is green because it was skipped, not because the quality gate passed."
          {
            printf '## SonarQube: not evaluated\n\n'
            printf 'No analysis ran on this commit, because %s.\n\n' "$why"
            printf '**This check is green because it was skipped, not because the quality gate passed.**\n\n'
            printf 'Neither code quality nor the new-code coverage condition was measured here. The\n'
            printf 'diff-coverage summary on the CI workflow is what a run without secrets can still\n'
            # Markdown backticks are literal.
            # shellcheck disable=SC2016
            printf 'produce; the quality gate itself is measured once the change reaches `main`.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Seed an isolated dependency repository
        run: .github/scripts/ci-maven-cache.sh seed "$HOME/.m2/repository" "$RUNNER_TEMP/m2"
      - uses: actions/download-artifact@v4
        with:
          name: ci-shard-plan
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-test-results-*
          path: ${{ runner.temp }}/ci-artifacts
          merge-multiple: true
      - name: Prepare local artifacts for report generation
        run: mvn -B -Dmaven.repo.local="$RUNNER_TEMP/m2" -DskipTests install
      - name: Admit the complete report and coverage set
        run: .github/scripts/ci-aggregate.sh verify --plan "$RUNNER_TEMP/shards.json" --artifacts "$RUNNER_TEMP/ci-artifacts" --restore .
      - name: Every shard job succeeded
        env:
          SHARD_RESULT: ${{ needs.test-shards.result }}
        run: test "$SHARD_RESULT" = success
      - name: MCP stdio smoke (Boot JAR sidecar)
        run: |
          jar="$(find control/mcp-server/target -maxdepth 1 -name 'mcp-server-*-boot.jar' -print -quit)"
          test -n "$jar"
          bash control/mcp-server/mcp-smoke.sh "$jar"
      - name: Admit Sonar inputs
        if: steps.guard.outputs.run == 'true'
        run: .github/scripts/sonar-inputs.sh --root . --plan "$RUNNER_TEMP/shards.json" --artifacts "$RUNNER_TEMP/ci-artifacts" --restore .
      - name: Merge coverage from every declared shard
        run: |
          mvn -B -Dmaven.repo.local="$RUNNER_TEMP/m2" -N jacoco:merge@jacoco-merge-reactor
          mvn -B -Dmaven.repo.local="$RUNNER_TEMP/m2" jacoco:report@jacoco-report-reactor
      - name: Analyze admitted coverage
        id: analyze
        continue-on-error: true
        if: steps.guard.outputs.run == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          set -euo pipefail
          args=(
            -Dsonar.projectKey=tapstate
            -Dsonar.host.url="$SONAR_HOST_URL"
            -Dsonar.login="$SONAR_TOKEN"
            -Dsonar.qualitygate.wait=true
          )
          # On a release tag (e.g. v1.2.3) stamp the analysis with the release version (strip the
          # leading v), so it creates a version event. With the "previous version" New Code
          # definition, that resets the baseline; other builds keep the pom's default version.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            args+=("-Dsonar.projectVersion=${GITHUB_REF_NAME#v}")
          fi
          mvn -B -Dmaven.repo.local="$RUNNER_TEMP/m2" sonar:sonar "${args[@]}"

      # Best-effort PR decoration for Community Edition. Runs even when the analyze step failed
      # (that is exactly the gate-red case worth commenting on); continue-on-error keeps a comment
      # glitch from ever flipping a green job to red - the analyze step is the sole gate authority.
      - name: Comment quality gate on PR
        if: always() && steps.guard.outputs.run == 'true' && steps.analyze.outcome != 'skipped' && steps.analyze.outcome != '' && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          host="${SONAR_HOST_URL%/}"
          dashboard="$host/dashboard?id=tapstate&pullRequest=${PR_NUMBER}"

          # This instance has the Community Branch Plugin, so the PR is analyzed as a pull request
          # whose new code is its diff against the base branch. Query the gate in that PR context,
          # not the main branch (which would read empty). The analyze step already waited for the
          # gate and concurrency serializes runs, so this status is this run's.
          ps="$(curl -s -u "$SONAR_TOKEN:" "$host/api/qualitygates/project_status?projectKey=tapstate&pullRequest=${PR_NUMBER}" || true)"
          status="$(printf '%s' "$ps" | jq -r '.projectStatus.status // "UNKNOWN"' 2>/dev/null || echo UNKNOWN)"
          details="$(printf '%s' "$ps" | jq -r '.projectStatus.conditions[]? | select(.status=="ERROR") | "- `\(.metricKey)`: \(.actualValue) (fails \(.comparator) \(.errorThreshold))"' 2>/dev/null || true)"
          bugs="$(curl -s -u "$SONAR_TOKEN:" "$host/api/issues/search?componentKeys=tapstate&pullRequest=${PR_NUMBER}&resolved=false&types=BUG&ps=100" || true)"
          bug_details="$(printf '%s' "$bugs" | jq -r '.issues[]? | "- `\(.rule)` [\(.severity)]: `\(.component | sub("^tapstate:"; "")):\(.line // "?")` — \(.message)"' 2>/dev/null || true)"

          case "$status" in
            OK)    emoji="white_check_mark";   verdict="passed" ;;
            ERROR) emoji="x";                  verdict="failed" ;;
            # NONE = the gate could not be evaluated because there is no New Code to measure
            # (the "Sonar way" conditions are all on new code; the first analysis, or one with
            # no New Code baseline set on the server, has nothing to compare against). Not a failure.
            NONE)  emoji="information_source"; verdict="not evaluated (no New Code baseline yet)" ;;
            *)     emoji="warning";            verdict="unknown (see the workflow logs)" ;;
          esac

          {
            printf '<!-- sonarqube-gate -->\n'
            printf '### :%s: SonarQube quality gate: **%s**\n\n' "$emoji" "$verdict"
            if [ -n "${details:-}" ]; then
              printf 'Failing conditions:\n%s\n\n' "$details"
            fi
            if [ -n "${bug_details:-}" ]; then
              printf 'Open reliability issues:\n%s\n\n' "$bug_details"
            fi
            printf '[Open the pull-request dashboard](%s)\n\n' "$dashboard"
            printf '_Posted by CI from the SonarQube pull-request quality gate._\n'
          } > comment.md

          existing="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | contains("<!-- sonarqube-gate -->")) | .id' 2>/dev/null | head -n1 || true)"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$(cat comment.md)" >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$(cat comment.md)" >/dev/null
          fi
          echo "Posted quality gate comment (status=${status})."

      - name: Preserve downloaded dependencies
        if: always()
        run: .github/scripts/ci-maven-cache.sh collect "$HOME/.m2/repository" "$RUNNER_TEMP/m2"
      - name: Diff coverage
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          base="origin/${{ github.base_ref }}"
          git rev-parse --verify --quiet "$base" >/dev/null 2>&1 \
            || git fetch --quiet --no-tags origin "${{ github.base_ref }}" || true
          DIFF_RANGE="$base...HEAD" bash .github/scripts/diff-coverage.sh >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve the admitted reports and coverage
        uses: actions/upload-artifact@v4
        with:
          name: ci-aggregate
          path: |
            target/ci-shards/
            target/jacoco-reactor.exec
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
            **/target/site/jacoco/jacoco.xml
          if-no-files-found: error
          retention-days: 7

  # A native check preserves fork-token behavior. The branch-push summary has a
  # different name so ws pushes create no skipped or unevaluated sonarqube check.
  sonarqube:
    name: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ws/') && 'ci-summary' || 'sonarqube' }}
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Report analysis outcome
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          SONAR_REQUIRED: ${{ needs.build.outputs.sonar-required }}
          SONAR_ENABLED: ${{ needs.build.outputs.sonar-enabled }}
          SONAR_OUTCOME: ${{ needs.build.outputs.sonar-outcome }}
        run: |
          set -euo pipefail
          test "$BUILD_RESULT" = success
          if [ "$SONAR_REQUIRED" = false ]; then
            echo 'Build and shard admission passed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$SONAR_REQUIRED" = true
          if [ "$SONAR_ENABLED" = false ]; then
            echo '::notice title=SonarQube not evaluated::Repository secrets were unavailable. This check is green because analysis was skipped, not because the quality gate passed.'
            printf '## SonarQube: not evaluated\n\nRepository secrets were unavailable (including fork pull requests). This check is green because analysis was skipped, not because the quality gate passed. See the build summary for the reason and diff coverage.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$SONAR_ENABLED" = true
          test "$SONAR_OUTCOME" = success
          echo 'SonarQube analysis and quality gate passed.' >> "$GITHUB_STEP_SUMMARY"

  installer:
    # The install and quickstart scripts are shell, not Java: shellcheck them (ubuntu-latest ships
    # shellcheck) and run their smokes. Both drive platform detection, the unsupported-platform refusals,
    # checksum verification, credential handling and idempotency against local file:// / loopback stubs —
    # no network, and no Docker (the quickstart smoke stops before the live run phase).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck the shell scripts
        run: |
          shellcheck -s sh install/install.sh
          shellcheck install/install-smoke.sh
          shellcheck -s sh deploy/quickstart/quickstart.sh
          shellcheck deploy/quickstart/quickstart-smoke.sh
          shellcheck deploy/docker/image-smoke.sh
          shellcheck -s sh deploy/install-site/assemble.sh
          shellcheck -s sh deploy/install-site/verify-published.sh
          shellcheck deploy/install-site/verify-smoke.sh
          shellcheck -s sh deploy/install-site/check-site.sh
          shellcheck -s sh deploy/install-site/check-site-smoke.sh
          shellcheck -s sh scripts/funnel-capture.sh
          shellcheck -s sh scripts/funnel-publish.sh
          shellcheck -s sh scripts/funnel-report.sh
          shellcheck -s sh scripts/funnel-capture-smoke.sh
      - name: installer smoke
        run: bash install/install-smoke.sh
      - name: quickstart smoke
        run: bash deploy/quickstart/quickstart-smoke.sh
      - name: install-site verifier smoke
        run: bash deploy/install-site/verify-smoke.sh

      # A function and the route that reaches it travel separately through the release path, so they
      # can disagree -- and when they do, every downstream signal still looks correct.
      - name: install-site consistency smoke
        run: sh deploy/install-site/check-site-smoke.sh

      # The receiver decides what is stored, so its rules are tested rather than reviewed. node --test
      # is built in; there is no package.json and no dependency to install.
      - name: install event receiver tests
        run: node --test deploy/install-site/api/event.test.js

      # The capture/report/publish half of the funnel is where a wrong number is produced silently: a
      # double-counted window, a running total presented as a period, or a gap reported as zero all
      # look entirely plausible on the page. Fixtures stand in for the API, so this needs no network
      # and no credentials.
      - name: funnel capture smoke
        run: sh scripts/funnel-capture-smoke.sh

  catalog-scripts:
    # The catalog refresh driver and the connector build it calls are shell, and the driver is a gate:
    # its whole job is turning "this step did not run" into a non-zero exit, because every step of a
    # refresh is a JUnit test that skips - rather than fails - when its inputs are absent. A gate that
    # nothing checks is the shape that goes green having verified nothing, which is the shape it was
    # written to prevent. Both smokes drive stubs placed on PATH: no Maven, no connectors, no network.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck the catalog scripts
        # One invocation over all four rather than a line each: a `run: |` block runs under bash -e,
        # so the first script to report anything aborts the step and the ones after it are never
        # checked - which reads as "the rest were clean". The installer job above lost three scripts
        # that way for three sessions. Checked against 0.9.0, which is what the runner's apt ships and
        # is stricter here than a current local build.
        run: shellcheck scripts/refresh-catalog.sh scripts/refresh-catalog-smoke.sh scripts/build-real-connectors.sh scripts/build-real-connectors-smoke.sh .github/scripts/catalog-age-days.sh .github/scripts/catalog-age-days-smoke.sh .github/scripts/diff-coverage.sh .github/scripts/diff-coverage-smoke.sh .github/scripts/translate-intake.sh .github/scripts/translate-intake-smoke.sh .github/scripts/fork-sonar-smoke.sh .github/scripts/issue-templates-smoke.sh .github/scripts/latest-release-tag.sh .github/scripts/latest-release-tag-smoke.sh .github/scripts/set-version.sh .github/scripts/set-version-smoke.sh .github/scripts/next-version.sh .github/scripts/next-version-smoke.sh .github/scripts/release-manifest.sh .github/scripts/release-manifest-smoke.sh .github/scripts/site-from-tag.sh .github/scripts/site-from-tag-smoke.sh .github/scripts/changeset-parity.sh .github/scripts/changeset-parity-smoke.sh .github/scripts/_pr-section.sh .github/scripts/docs-impact.sh .github/scripts/checks-on-commit.sh .github/scripts/checks-on-commit-smoke.sh .github/scripts/docs-gate.sh .github/scripts/docs-gate-smoke.sh .github/scripts/release-notes.sh .github/scripts/release-notes-smoke.sh .github/scripts/release-shape-smoke.sh .github/scripts/quickstart-live-shape-smoke.sh .github/scripts/roadmap-shipped.sh .github/scripts/roadmap-shipped-smoke.sh .github/scripts/satellites.sh .github/scripts/satellites-smoke.sh .github/scripts/docs-release.sh .github/scripts/docs-release-smoke.sh .github/scripts/ci-timing.sh .github/scripts/ci-timing-smoke.sh .github/scripts/ci-shard.sh .github/scripts/ci-shard-smoke.sh .github/scripts/ci-aggregate.sh .github/scripts/ci-aggregate-smoke.sh .github/scripts/ci-shape-smoke.sh .github/scripts/ci-maven-cache.sh .github/scripts/ci-maven-cache-smoke.sh .github/scripts/sonar-inputs.sh .github/scripts/sonar-inputs-smoke.sh .github/scripts/sonar-workflow-smoke.sh .github/scripts/connector-witnesses.sh .github/scripts/connector-witnesses-smoke.sh .github/scripts/connector-cache.sh .github/scripts/connector-cache-smoke.sh .github/scripts/connector-workflow-smoke.sh .github/scripts/one-verify.sh .github/scripts/one-verify-smoke.sh
      - name: One automatic full test suite
        run: bash .github/scripts/one-verify.sh
      - name: Full test invocation cases
        run: bash .github/scripts/one-verify-smoke.sh
      - name: CI shard and aggregate cases
        run: |
          bash .github/scripts/connector-witnesses-smoke.sh
          bash .github/scripts/connector-cache-smoke.sh
          bash .github/scripts/connector-workflow-smoke.sh
          bash .github/scripts/ci-shard-smoke.sh
          bash .github/scripts/ci-aggregate-smoke.sh
          bash .github/scripts/ci-shape-smoke.sh
          bash .github/scripts/ci-maven-cache-smoke.sh
          bash .github/scripts/sonar-inputs-smoke.sh
          bash .github/scripts/sonar-workflow-smoke.sh
      - name: CI timing cases
        run: bash .github/scripts/ci-timing-smoke.sh
      - name: refresh driver cases
        run: bash scripts/refresh-catalog-smoke.sh
      - name: connector build cases
        run: bash scripts/build-real-connectors-smoke.sh
      - name: catalog age cases
        run: bash .github/scripts/catalog-age-days-smoke.sh
      # Not a catalog script, but this is the job where a shell gate's cases run, and the coverage
      # summary is shell whose failure mode is the one this job exists for: a number that is quietly
      # wrong reads exactly like a number that is right.
      - name: diff coverage cases
        run: bash .github/scripts/diff-coverage-smoke.sh
      # Also not a catalog script. Its own workflow fires on `issues`, so these cases would never
      # run on a pull request if they lived there - and this gate's every failure path is a silent
      # skip, which is precisely the shape that rots unnoticed.
      - name: intake translation cases
        run: bash .github/scripts/translate-intake-smoke.sh

      # Also not a catalog script. Three workflows ask it which release is newest, and none of the
      # three is a place its cases could live: two of them only run on a release or a dispatch, and
      # the third would run them once per matrix leg for no gain.
      - name: latest release tag cases
        run: bash .github/scripts/latest-release-tag-smoke.sh

      - name: version pin cases
        run: bash .github/scripts/set-version-smoke.sh

      - name: next version cases
        run: bash .github/scripts/next-version-smoke.sh

      - name: release completeness cases
        run: bash .github/scripts/release-manifest-smoke.sh

      # A release tag points at the commit CI validated, which is the tree from *before* the version
      # was written in -- so the two entry points the install site serves have to be pinned on the
      # way out, not read straight from the tag.
      - name: install-site entry point cases
        run: bash .github/scripts/site-from-tag-smoke.sh

      # Vacuous against this tree -- no changeset exists yet -- so its cases seed their own. Running
      # it here is what stops it from still being vacuous, and unnoticed, on the day one lands.
      - name: changeset parity cases
        run: bash .github/scripts/changeset-parity-smoke.sh

      # The three release gates. They only ever run inside a release, which is the worst possible
      # place to find out one of them is broken -- so their cases run on every push instead.
      - name: The release gate reads the checks on a commit the way it is supposed to
        run: bash .github/scripts/checks-on-commit-smoke.sh
      - name: The documentation gate still tells "nobody answered" from "answered none"
        run: bash .github/scripts/docs-gate-smoke.sh
      - name: The release notes still assemble the way they are supposed to
        run: bash .github/scripts/release-notes-smoke.sh
      # The satellites are three repositories this one cannot see the inside of, so what is testable
      # here is which of them would be touched and with what ref -- and that is exactly the half whose
      # failure is silent: a satellite dropped from the list is never tagged and nothing reports it.
      - name: Every satellite still gets the branch and the tag it is supposed to
        run: bash .github/scripts/satellites-smoke.sh
      # The documentation site is coordinated rather than pinned, and the one thing that must never
      # regress is that it cannot stop a release. Three of these cases read the file rather than run
      # it, because --plan returns 0 down every path and the issue lookup needs somebody else's repo.
      - name: The documentation site still cannot block a release
        run: bash .github/scripts/docs-release-smoke.sh
      # The board is a concurrent writer: a project workflow fires when an item is added and lands
      # after the mutation, so a run can report every issue moved, exit 0, and leave the board saying
      # something else. Measured on the first real release -- fifteen reported, seven kept. These
      # cases are the only exercise this script gets outside a published release.
      - name: The roadmap step still reports what the board kept, not what it asked for
        run: bash .github/scripts/roadmap-shipped-smoke.sh
      # Not a script's cases -- the release workflow's own shape. The three acts that cannot be
      # taken back are all downstream of the approval, and every one of them is one line from
      # moving; a rejected release is otherwise the only thing that would find out.
      - name: The release workflow still puts every irreversible act after the approval
        run: bash .github/scripts/release-shape-smoke.sh

      # Same reason, one lane over. The quickstart lanes run nightly against published releases, so
      # what they cover is never read on a pull request -- and the edits that hollow them out are one
      # line each: the arm64 leg going back to ubuntu-latest, the upgrade lane starting from the same
      # release it upgrades to, a `-v` on the stop that turns an upgrade into a fresh install. All
      # three leave the lane green.
      - name: The quickstart lanes still cover arm64, and still upgrade across the volumes
        run: bash .github/scripts/quickstart-live-shape-smoke.sh

      # The gate itself, not its cases: six files pin the release version, and rewriting them from
      # <revision> has to be a no-op. Five of the six already had something watching them one at a
      # time; the MCP server's is read by nothing in the tree, so until this ran, a wrong value there
      # would have shipped without a word.
      - name: the six version pins agree
        run: |
          bash .github/scripts/set-version.sh
          git diff --exit-code || {
            echo "the version pins above disagree with pom.xml's <revision>" >&2
            echo "run .github/scripts/set-version.sh and commit the result" >&2
            exit 1
          }

      # File-level, and that is the point: the property being asserted about the notice workflow is
      # the ABSENCE of a checkout step, which no runtime test can establish.
      - name: fork sonar workflow cases
        run: bash .github/scripts/fork-sonar-smoke.sh

      - name: issue template cases
        run: bash .github/scripts/issue-templates-smoke.sh

  image-smoke:
    # Build the server image for the runner's native architecture and smoke it as a black box: it boots
    # against a throwaway replica set until the image's built-in healthcheck reaches healthy (running as
    # the unprivileged uid), `docker stop` yields an orderly exit 0 (not 137/143), and an unsupported
    # --role is rejected with a coded non-zero exit. The two legs are native runners for the two
    # published architectures, so neither image is emulated. The GitHub runners ship a Docker daemon.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: image smoke (builds the boot jar + image, then runs the black-box checks)
        run: bash deploy/docker/image-smoke.sh --build
