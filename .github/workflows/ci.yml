name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: copy.snapshot.basic.standard@1
            rows: 10000
          - case: nest.snapshot.fanout.wide@2
            rows: 10000
          - case: copy.backlog.fixed-iud.standard@1
            rows: 10000
          - case: copy.live.basic.standard@1
            rows: 10000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 04d638ef1992f03a7f10d58b0cd3350a9cc816db
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.13+9.0.LTS'
          cache: maven
      - name: Set up Maven
        run: bash .github/scripts/setup-ci-maven.sh
      - name: Verify dependencies and record environment
        run: |
          mkdir "$RUNNER_TEMP/calibration"
          {
            echo "Image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            uname -a
            lscpu
            free -m
            df -h "$RUNNER_TEMP"
            java -version
            mvn -version
            docker info
            git rev-parse HEAD
          } > "$RUNNER_TEMP/calibration/environment.txt" 2>&1
          python3 -B deploy/cloud/prepare-test-inputs.py --mongodb-only --with-dummy --output "$RUNNER_TEMP/connectors"
          docker pull mongo:7.0
          docker image inspect mongo:7.0 --format '{{json .RepoDigests}}' > "$RUNNER_TEMP/calibration/mongo-image.json"
      - name: Build the candidate
        run: |
          mvn -B -pl app,e2e -am -DskipTests package > "$RUNNER_TEMP/calibration/build.log" 2>&1 || {
            tail -80 "$RUNNER_TEMP/calibration/build.log"
            exit 1
          }
          sha256sum app/target/app-0.8.0-boot.jar "$RUNNER_TEMP/connectors/"*.jar > "$RUNNER_TEMP/calibration/artifacts.sha256"
      - name: Measure each candidate workload and retain repeats
        env:
          CASE: ${{ matrix.case }}
          ROWS: ${{ matrix.rows }}
        run: |
          python3 -B benchmarks/runner.py run --id "$CASE" --rows "$ROWS" --backlog-events 30000 \
            --rate 100 --warmup-seconds 30 --measurement-seconds 300 --timeout-seconds 600 \
            --connectors "$RUNNER_TEMP/connectors" --output "$RUNNER_TEMP/calibration/run"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-calibration-${{ matrix.case }}
          path: |
            ${{ runner.temp }}/calibration/
            !${{ runner.temp }}/calibration/run/**/runtime-input/**
            !${{ runner.temp }}/calibration/run/**/witness-input/**
          if-no-files-found: error
          retention-days: 30
