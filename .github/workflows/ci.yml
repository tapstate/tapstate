name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibration-plan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6e66ffaa7ad85ee45653f80012b4e08bda177c8f
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.13+9.0.LTS'
      - name: Allocate the candidate qualification batches
        run: |
          cat > "$RUNNER_TEMP/estimates.json" <<'JSON'
          {"environment": "ubuntu-24.04-x64-op", "durations_seconds": {"mixed.snapshot.double-map.standard": 230, "copy.live.basic.standard": 240, "copy.backlog.fixed-iud.standard": 245, "union.live.basic.standard": 290, "nest.snapshot.fanout.wide": 530}}
          JSON
          python3 -B benchmarks/runner.py allocate --id mixed.snapshot.double-map.standard --id copy.live.basic.standard --id copy.backlog.fixed-iud.standard --id union.live.basic.standard --id nest.snapshot.fanout.wide --repeats 3 --rows 96 --rate 8 --measurement-seconds 6 --timeout-seconds 95 --slots 2 --batch-seconds 1200 --deadline-seconds 2100 --reserve-seconds 300 --environment ubuntu-24.04-x64-op --estimates "$RUNNER_TEMP/estimates.json" --output "$RUNNER_TEMP/manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-qualification-manifest
          path: |
            ${{ runner.temp }}/manifest.json
            ${{ runner.temp }}/estimates.json
          if-no-files-found: error

  calibration:
    needs: calibration-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        batch: [0, 1]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6e66ffaa7ad85ee45653f80012b4e08bda177c8f
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.13+9.0.LTS'
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: candidate-qualification-manifest
          path: ${{ runner.temp }}/manifest
      - name: Verify the connector inputs and capture the environment
        run: |
          mkdir -p "$RUNNER_TEMP/calibration"
          {
            uname -a
            lscpu
            free -m
            java -version
            mvn -version
            docker version
            git rev-parse HEAD
            cp deploy/cloud/connectors.lock.json "$RUNNER_TEMP/calibration/"
          } > "$RUNNER_TEMP/calibration/environment.txt" 2>&1
          python3 -B deploy/cloud/prepare-test-inputs.py --mongodb-only --with-dummy --output "$RUNNER_TEMP/connectors"
          docker pull mongo:7.0
          docker image inspect mongo:7.0 --format '{{json .RepoDigests}}' > "$RUNNER_TEMP/calibration/mongo-image.json"
      - name: Build the matching OP candidate
        run: |
          for attempt in 1 2 3; do
            if mvn -B -pl app,cli,e2e -am -DskipTests package > "$RUNNER_TEMP/calibration/build-$attempt.log" 2>&1; then
              sha256sum app/target/app-0.8.0-boot.jar cli/target/cli-0.8.0.jar "$RUNNER_TEMP/connectors/"*.jar > "$RUNNER_TEMP/calibration/artifacts.sha256"
              exit 0
            fi
            tail -60 "$RUNNER_TEMP/calibration/build-$attempt.log"
            if ! grep -q 'HTTP Status: 429' "$RUNNER_TEMP/calibration/build-$attempt.log"; then
              exit 1
            fi
            sleep "$((20 * attempt))"
          done
          exit 1
      - name: Validate the catalog, selection and report
        run: python3 -B -m unittest discover -s benchmarks/src/test
      - name: Replay the assigned batch
        run: |
          python3 -B benchmarks/runner.py run --manifest "$RUNNER_TEMP/manifest/manifest.json" --batch ${{ matrix.batch }} --connectors "$RUNNER_TEMP/connectors" --output "$RUNNER_TEMP/calibration/run"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-qualification-batch-${{ matrix.batch }}
          path: |
            ${{ runner.temp }}/calibration/
            !${{ runner.temp }}/calibration/run/**/runtime-input/**
            !${{ runner.temp }}/calibration/run/**/witness-input/**
          if-no-files-found: error
