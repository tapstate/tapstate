name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map-nest-control:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: candidate
            revision: 4f23665a4f1bc4ac6bb07af8c7ed2c192caf9ee2
          - label: prior
            revision: 67593b8303db07dcf096c61bf88129905e21983b
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.13+9.0.LTS'
          cache: maven
      - name: Prepare locked inputs and the matching OP build
        run: |
          out="$RUNNER_TEMP/control"
          mkdir -p "$out"
          docker info > "$out/docker-info.txt"
          docker pull mongo:7.0
          docker image inspect mongo:7.0 --format '{{json .RepoDigests}}' > "$out/mongo-image.json"
          python3 -B deploy/cloud/prepare-test-inputs.py --mongodb-only --with-dummy --output "$RUNNER_TEMP/connectors"
          for attempt in 1 2 3; do
            if mvn -B -pl e2e -am -DskipTests package > "$out/build-$attempt.log" 2>&1; then
              sha256sum app/target/app-0.8.0-boot.jar "$RUNNER_TEMP/connectors/"*.jar > "$out/artifacts.sha256"
              exit 0
            fi
            tail -60 "$out/build-$attempt.log"
            if ! grep -q 'HTTP Status: 429' "$out/build-$attempt.log"; then
              exit 1
            fi
            sleep "$((20 * attempt))"
          done
          exit 1
      - name: Compare the snapshot composition at both input sizes
        run: |
          status=0
          for rows in 96 128; do
            python3 -B benchmarks/runner.py run --id mixed.snapshot.map-nest.standard \
              --repeats 2 --rows "$rows" --rate 8 --measurement-seconds 6 --timeout-seconds 95 \
              --connectors "$RUNNER_TEMP/connectors" --output "$RUNNER_TEMP/control/rows-$rows" || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-nest-control-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/control/
            !${{ runner.temp }}/control/**/runtime-input/**
          if-no-files-found: error
