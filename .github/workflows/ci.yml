name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibration-plan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.13+9.0.LTS'
      - name: Allocate the two qualification batches
        run: |
          cat > "$RUNNER_TEMP/estimates.json" <<'JSON'
          {"environment": "ubuntu-24.04-x64-op", "durations_seconds": {"js.snapshot.basic.small": 50, "js.snapshot.basic.standard": 50, "js.snapshot.basic.wide": 55, "js.snapshot.basic.large": 60, "js.live.basic.standard": 70, "js.backlog.basic.standard": 75, "mixed.snapshot.double-map.standard": 55}}
          JSON
          python3 -B benchmarks/runner.py allocate --id js.snapshot.basic.small --id js.snapshot.basic.standard --id js.snapshot.basic.wide --id js.snapshot.basic.large --id js.live.basic.standard --id js.backlog.basic.standard --id mixed.snapshot.double-map.standard --repeats 1 --rows 128 --timeout-seconds 55 --slots 2 --batch-seconds 600 --deadline-seconds 900 --reserve-seconds 120 --environment ubuntu-24.04-x64-op --estimates "$RUNNER_TEMP/estimates.json" --output "$RUNNER_TEMP/manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: operator-qualification-manifest
          path: |
            ${{ runner.temp }}/manifest.json
            ${{ runner.temp }}/estimates.json
          if-no-files-found: error

  calibration:
    needs: calibration-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        batch: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.13+9.0.LTS'
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: operator-qualification-manifest
          path: ${{ runner.temp }}/manifest
      - name: Verify the connector inputs and capture the environment
        run: |
          mkdir -p "$RUNNER_TEMP/calibration"
          {
            uname -a
            lscpu
            free -m
            java -version
            mvn -version
            docker version
            git rev-parse HEAD
            cp deploy/cloud/connectors.lock.json "$RUNNER_TEMP/calibration/"
          } > "$RUNNER_TEMP/calibration/environment.txt" 2>&1
          python3 -B deploy/cloud/prepare-test-inputs.py --mongodb-only --with-dummy --output "$RUNNER_TEMP/connectors"
          docker pull mongo:7.0
          docker image inspect mongo:7.0 --format '{{json .RepoDigests}}' > "$RUNNER_TEMP/calibration/mongo-image.json"
      - name: Build the matching OP candidate
        run: mvn -B -T 2 -DskipTests package > "$RUNNER_TEMP/calibration/build.log" 2>&1
      - name: Replay the assigned batch
        run: |
          python3 -B benchmarks/runner.py run --manifest "$RUNNER_TEMP/manifest/manifest.json" --batch ${{ matrix.batch }} --connectors "$RUNNER_TEMP/connectors" --output "$RUNNER_TEMP/calibration/run"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operator-qualification-batch-${{ matrix.batch }}
          path: |
            ${{ runner.temp }}/calibration/
            !${{ runner.temp }}/calibration/run/**/runtime-input/**
            !${{ runner.temp }}/calibration/run/**/witness-input/**
          if-no-files-found: error
