name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibration-plan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.13+9.0.LTS'
      - name: Allocate the two qualification batches
        run: |
          cat > "$RUNNER_TEMP/estimates.json" <<'JSON'
          {"environment":"ubuntu-24.04-x64-op","durations_seconds":{"copy.snapshot.dummy-baseline.standard":150,"copy.snapshot.basic.standard":90,"copy.live.basic.standard":150,"copy.backlog.fixed-iud.standard":140}}
          JSON
          python3 -B benchmarks/runner.py allocate --suite basic --slots 2 --batch-seconds 480 --deadline-seconds 900 --reserve-seconds 120 --environment ubuntu-24.04-x64-op --estimates "$RUNNER_TEMP/estimates.json" --output "$RUNNER_TEMP/manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: performance-calibration-manifest
          path: |
            ${{ runner.temp }}/manifest.json
            ${{ runner.temp }}/estimates.json
          if-no-files-found: error

  calibration:
    needs: calibration-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        batch: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.13+9.0.LTS'
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: performance-calibration-manifest
          path: ${{ runner.temp }}/manifest
      - name: Verify the connector inputs and capture the environment
        run: |
          mkdir -p "$RUNNER_TEMP/calibration"
          {
            uname -a
            lscpu
            free -m
            java -version
            mvn -version
            docker version
            git rev-parse HEAD
            cp deploy/cloud/connectors.lock.json "$RUNNER_TEMP/calibration/"
          } > "$RUNNER_TEMP/calibration/environment.txt" 2>&1
          python3 -B deploy/cloud/prepare-test-inputs.py --mongodb-only --with-dummy --output "$RUNNER_TEMP/connectors"
          docker pull mongo:7.0
          docker image inspect mongo:7.0 --format '{{json .RepoDigests}}' > "$RUNNER_TEMP/calibration/mongo-image.json"
      - name: Build the matching OP candidate
        run: mvn -B -T 2 -DskipTests package > "$RUNNER_TEMP/calibration/build.log" 2>&1
      - name: Replay the assigned batch
        run: |
          python3 -B benchmarks/runner.py run --manifest "$RUNNER_TEMP/manifest/manifest.json" --batch ${{ matrix.batch }} --connectors "$RUNNER_TEMP/connectors" --output "$RUNNER_TEMP/calibration/run"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-calibration-batch-${{ matrix.batch }}
          path: ${{ runner.temp }}/calibration/
          if-no-files-found: error
