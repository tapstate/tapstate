name: CI
run-name: Pipeline Performance | Deadline and artifact fixture

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Selection mode for the branch or tag chosen in the dispatch form
        type: choice
        options: [all, group, filter, ids]
        default: all
      group:
        description: One primary group, for example nest
        type: string
      filters:
        description: Space- or comma-separated field=value filters
        type: string
      case_ids:
        description: Space- or comma-separated case IDs with optional @version
        type: string
      baseline_version:
        description: Previously published baseline version, or leave empty for the current release
        type: string

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.run_attempt == '1' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.event == 'schedule' &&
         github.event.workflow_run.run_attempt == 1 &&
         github.event.workflow_run.head_branch == github.event.repository.default_branch &&
         github.event.workflow_run.head_repository.id == github.event.repository.id))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      batches: ${{ steps.prepare.outputs.batches }}
      measurement_stop: ${{ steps.fixture_clock.outputs.measurement_stop }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 89cba0205a4f8f6504164983322e5c63871b828a
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.13+9.0.LTS'
      - name: Read the start time for this attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/performance-run.json"
      - name: Select and allocate formal cases
        id: prepare
        run: |
          python3 -B benchmarks/actions_run.py \
            --workloads benchmarks/cases/formal-workloads.json \
            --estimates benchmarks/cases/hosted-runner-estimates.json \
            --run "$RUNNER_TEMP/performance-run.json" \
            --output "$RUNNER_TEMP/performance-inputs"
      - name: Set the shortened fixture clock
        id: fixture_clock
        shell: bash
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/performance-run.json"
          started=$(date -d "$(jq -r .run_started_at "$metadata")" +%s)
          now=$(date +%s)
          stop_at=$((now + 105))
          echo "measurement_stop=$stop_at" >> "$GITHUB_OUTPUT"
          jq -n --argjson started "$started" --argjson stop "$stop_at" --argjson created "$now" \
            '{fixture:"deadline", attempt_started:$started, cutoff_calculated_at:$created, measurement_stop:$stop,
              fixture_budget_seconds:($stop-$started)}' > "$RUNNER_TEMP/performance-inputs/fixture-clock.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-inputs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/performance-inputs
          if-no-files-found: error
          retention-days: 90

  measure:
    name: measure (${{ matrix.batch }})
    if: ${{ !cancelled() && github.run_attempt == '1' && needs.prepare.result == 'success' }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJSON(needs.prepare.outputs.batches) }}
    env:
      STOP_AT: ${{ needs.prepare.outputs.measurement_stop }}
      BATCH: ${{ matrix.batch }}
    steps:
      - name: Model runner availability after the short deadline
        if: matrix.batch == 1
        shell: bash
        run: |
          while (( $(date +%s) <= STOP_AT )); do sleep 1; done
      - name: Check the remaining budget
        id: budget
        run: |
          now=$(date +%s)
          if (( STOP_AT <= now )); then
            echo "run=false" >> "$GITHUB_OUTPUT"
            mkdir -p "$RUNNER_TEMP/performance-batch"
            printf 'No time remained for this batch when the runner started.\n' > "$RUNNER_TEMP/performance-batch/expired.txt"
          else
            # Leave time to upload evidence before the job's 350 minute timeout.
            job_stop=$((now + 340 * 60))
            if (( job_stop < STOP_AT )); then
              echo "STOP_AT=$job_stop" >> "$GITHUB_ENV"
            fi
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.budget.outputs.run == 'true'
        with:
          ref: 89cba0205a4f8f6504164983322e5c63871b828a
          persist-credentials: false
      - uses: actions/setup-java@v4
        if: steps.budget.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: '21.0.13+9.0.LTS'
      - uses: actions/download-artifact@v4
        if: steps.budget.outputs.run == 'true'
        with:
          name: performance-inputs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/performance-inputs
      - name: Exercise the runner against the remaining absolute budget
        if: steps.budget.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/performance-batch"
          mkdir -p "$output"
          if [[ "$BATCH" == 2 ]]; then
            printf 'Controlled setup failure before runner entry.\n' > "$output/build.log"
            exit 42
          fi
          if [[ "$BATCH" == 3 ]]; then
            printf 'Controlled upload failure fixture.\n' > "$output/fixture.txt"
            exit 0
          fi
          if [[ "$BATCH" == 4 ]]; then
            while (( $(date +%s) < STOP_AT - 4 )); do sleep 1; done
            bash .github/scripts/performance-with-budget.sh "application build" bash -c               'echo "Fixture entered build before the cutoff"; sleep 120' > "$output/build.log" 2>&1
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/fixture-bin" "$RUNNER_TEMP/connectors"
          touch "$RUNNER_TEMP/fixture-boot.jar"
          cat > "$RUNNER_TEMP/fixture-bin/mvn" <<'PYTHON'
          #!/usr/bin/env python3
          import json
          import sys
          import time
          from pathlib import Path

          prefix = "-Dtapstate.benchmarks.request="
          request = json.loads(Path(next(arg.removeprefix(prefix) for arg in sys.argv if arg.startswith(prefix))).read_text())
          output = Path(request["output"])
          (output / "fixture-started").touch()
          case = request["entries"][0]["case"]
          first_repeat = output / case["id"] / "1"
          first_repeat.mkdir(parents=True)
          (first_repeat / "partial.json").write_text(json.dumps({
              "fixture": "controlled slow process",
              "run_id": request["run_id"],
              "entered_at": time.time(),
          }))
          print("First repeat entered; intentionally hold it until the deadline", flush=True)
          time.sleep(120)
          raise SystemExit("Deadline guard failed to stop the fixture")
          PYTHON
          chmod +x "$RUNNER_TEMP/fixture-bin/mvn"
          export PATH="$RUNNER_TEMP/fixture-bin:$PATH"
          while (( $(date +%s) < STOP_AT - 15 )); do sleep 1; done
          now=$(date +%s)
          jq -n --argjson stop "$STOP_AT" --argjson now "$now" \
            '{fixture:"deadline", runner_entry:$now, measurement_stop:$stop, remaining_seconds:($stop-$now)}' \
            > "$output/fixture-clock.json"
          python3 -B benchmarks/runner.py run \
            --manifest "$RUNNER_TEMP/performance-inputs/manifest.json" --batch "$BATCH" \
            --stop-at-epoch-seconds "$STOP_AT" --boot-jar "$RUNNER_TEMP/fixture-boot.jar" \
            --connectors "$RUNNER_TEMP/connectors" --output "$output/run"
      - name: Upload batch evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-batch-${{ github.run_attempt }}-${{ matrix.batch }}
          path: |
            ${{ runner.temp }}/${{ matrix.batch == 3 && 'intentionally-absent' || 'performance-batch' }}/
            !${{ runner.temp }}/performance-batch/run/**/runtime-input/**
            !${{ runner.temp }}/performance-batch/run/**/witness-input/**
            !${{ runner.temp }}/performance-batch/run/**/verified-connectors/**
          if-no-files-found: error
          retention-days: 30

  report:
    if: always() && github.run_attempt == '1' && needs.prepare.result != 'skipped'
    needs: [prepare, measure]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 89cba0205a4f8f6504164983322e5c63871b828a
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: performance-inputs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/performance-inputs
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: performance-batch-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/performance-batches
      - name: Read job timing evidence
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$RUNNER_TEMP/performance-jobs.json"
      - name: Reconcile and publish
        env:
          PERFORMANCE_JOB_RESULTS: ${{ format('{{"prepare":"{0}","measure":"{1}"}}', needs.prepare.result, needs.measure.result) }}
        run: |
          python3 -B benchmarks/actions_report.py \
            --inputs "$RUNNER_TEMP/performance-inputs" --artifacts "$RUNNER_TEMP/performance-batches" \
            --output "$RUNNER_TEMP/performance-report" --jobs "$RUNNER_TEMP/performance-jobs.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-report-${{ github.run_attempt }}
          path: ${{ runner.temp }}/performance-report
          if-no-files-found: error
          retention-days: 90
