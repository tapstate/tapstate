# Sharded tests and their merge-blocking aggregate build gate.
#   mvn verify — compile + unit tests + enforcer rules + ArchUnit ring rules + specifications
# Docs frontmatter validation (gen-index --check) lives with the docs in the
# separate private repo and is not run here. The zero-agent-footprint gate is a
# separate workflow (no-agent-footprint.yml).
# Specifications (e2e/*IT) run here against real containers: this runner has a Docker daemon, and
# the e2e module fails rather than skips when one is missing, so a green build here means they ran.
# On a developer machine they skip instead. Docker 29 rejects the client's default API version;
# the test steps pass API 1.44 explicitly, as local verification can with -Dapi.version=1.44.
# Deliberately excluded for now: native-image build (pinned to local darwin-arm64 until D5) and the
# connector catalog *refresh* - regenerating it needs a connectors checkout and built connector jars.
# The catalog's own consistency gates are PDK-free and run in the build above; the shell that drives
# the refresh has its cases in the catalog-scripts job below.
name: CI

# PR events own automatic feature-branch tests. A branch push before or during a
# PR must not execute another suite. Use workflow_dispatch for pre-PR validation.
on:
  push:
    branches:
      - main
    # Release versions reset the previous-version new-code baseline.
    tags:
      - "v*"
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  shard-plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Record the original event and actual checkout identities
        run: .github/scripts/ci-receipt.sh event-inputs --root . --output "$RUNNER_TEMP/ci-event-inputs.json"
      - name: Derive every test from the current reactor
        id: plan
        run: |
          .github/scripts/ci-shard.sh plan --root . --durations .github/ci-test-durations.json --output "$RUNNER_TEMP/shards.json"
          matrix_json="$(.github/scripts/ci-shard.sh matrix --root . --plan "$RUNNER_TEMP/shards.json")"
          echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-shard-plan
          overwrite: true
          path: |
            ${{ runner.temp }}/shards.json
            ${{ runner.temp }}/ci-event-inputs.json
          if-no-files-found: error
          retention-days: 7

  test-shards:
    name: test-shards (${{ matrix.shard }})
    needs: shard-plan
    # Queue each PR's corresponding worker. It stops only its own obsolete work;
    # a delayed old arrival must never cancel a newer head's worker.
    concurrency:
      group: ${{ format('ci-test-{0}-{1}', github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt), matrix.shard) }}
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.shard-plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.13+9.0.LTS'
          cache: maven
      - name: Verify exact Java build
        shell: bash
        run: |
          java -XshowSettings:properties -version 2>&1 | grep -Fx '    java.runtime.version = 21.0.13+9-LTS'
      - uses: actions/download-artifact@v4
        with:
          name: ci-shard-plan
          path: ${{ runner.temp }}
      # Only third-party dependencies are copied from the shared cache. This job's
      # install outputs live in its temporary repository and never enter that cache.
      - name: Seed an isolated dependency repository
        run: .github/scripts/ci-maven-cache.sh seed "$HOME/.m2/repository" "$RUNNER_TEMP/m2"
      - name: Build the reactor without running tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/maven-observation"
          .github/scripts/ci-pr-work.sh --root . --event-inputs "$RUNNER_TEMP/ci-event-inputs.json" --output "$RUNNER_TEMP/ci-inputs/pr-work-prepare.json" --phase prepare -- .github/scripts/ci-build-observation.sh --root . --work-dir "$RUNNER_TEMP/maven-observation" --output "$RUNNER_TEMP/maven-observation/summary.json" --shard-id "${{ matrix.shard }}" -- mvn -B -T 2 -Dmaven.repo.local="$RUNNER_TEMP/m2" -DskipTests install
      - name: Prepare pinned public inputs for Cloud startup witnesses
        env:
          SHARD: ${{ matrix.shard }}
          PREPARE_CLOUD_INPUTS: ${{ matrix.prepare_cloud_inputs }}
        run: |
          needs_cloud_release=false
          if [ "$SHARD" = rest ]; then
            needs_cloud_release=true
          else
            needs_cloud_release="$(python3 - "$RUNNER_TEMP/shards.json" "$SHARD" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              plan = json.load(source)
          shard = next((item for item in plan["shards"] if item["id"] == sys.argv[2]), None)
          if shard is None:
              raise SystemExit("unknown test shard")
          cloud_context_test = "io.tapstate.e2e.CloudClusterContextCarriesTheCurrentEgressAddressIT"
          print("true" if any(test["class"] == cloud_context_test for test in shard["tests"]) else "false")
          PY
          )"
          fi
          if [ "${PREPARE_CLOUD_INPUTS:-false}" = true ]; then
            needs_cloud_release=true
          fi
          if [ "$needs_cloud_release" = true ]; then
            python3 deploy/cloud/prepare-test-inputs.py --output "$RUNNER_TEMP/cloud-test-release"
            echo "TAPSTATE_TEST_CLOUD_RELEASE_DIR=$RUNNER_TEMP/cloud-test-release" >> "$GITHUB_ENV"
          fi
      # Only input hashes and tool versions are shared; raw configuration and credentials are excluded.
      - name: Record pre-test build inputs
        run: .github/scripts/ci-receipt.sh inputs --root . --repo-local "$RUNNER_TEMP/m2" --resolve-classpath --output "$RUNNER_TEMP/ci-inputs/build-inputs.json" --shard-id "${{ matrix.shard }}" --maven-observation "$RUNNER_TEMP/maven-observation/summary.json"
      - name: Derive complete test identities before selection
        run: |
          .github/scripts/ci-evidence.sh inventory --root . --lane ci --published-connectors absent --native-cli-presence absent --output "$RUNNER_TEMP/source-inventory.json"
          .github/scripts/ci-evidence.sh resolve --root . --inventory "$RUNNER_TEMP/source-inventory.json" --inputs "$RUNNER_TEMP/ci-inputs/build-inputs.json" --repo-local "$RUNNER_TEMP/m2" --output "$RUNNER_TEMP/resolved-inventory.json" --probe-receipt "$RUNNER_TEMP/ci-inputs/provider-probe-receipt.json"
          .github/scripts/ci-evidence.sh export-hashes --input "$RUNNER_TEMP/resolved-inventory.json" --output "$RUNNER_TEMP/ci-inputs/expected-case-hashes.json"
      - name: Record storage before the test shard
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /tmp
          if ! docker system df; then
            echo '::warning::Docker storage could not be observed before the test shard.'
          fi
      - name: Execute exactly this shard
        env:
          # Cloud fixtures share the release-input filesystem for hard links and space.
          MAVEN_ARGS: >-
            -Dapi.version=1.44
            -Dtapstate.it.jvmArgs=-Djava.io.tmpdir=${{ runner.temp }}/test-tmp
          SHARD: ${{ matrix.shard }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/test-tmp"
          .github/scripts/ci-pr-work.sh --root . --event-inputs "$RUNNER_TEMP/ci-event-inputs.json" --output "$RUNNER_TEMP/ci-inputs/pr-work-verify.json" --phase verify -- .github/scripts/ci-shard.sh run --plan "$RUNNER_TEMP/shards.json" --shard "$SHARD" --repo-local "$RUNNER_TEMP/m2" --case-evidence --build-inputs "$RUNNER_TEMP/ci-inputs/build-inputs.json" --class-gate-dir "$RUNNER_TEMP/ci-inputs/class-gates" --runtime-class-dir "$RUNNER_TEMP/ci-runtime-bytecode"
      - name: Record the observed test identity hashes
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/resolved-inventory.json" ] && \
             .github/scripts/ci-evidence.sh reports --root . --lane ci --inventory "$RUNNER_TEMP/resolved-inventory.json" --output "$RUNNER_TEMP/observations.json" --class-gates "$RUNNER_TEMP/ci-inputs/class-gates" --inputs "$RUNNER_TEMP/ci-inputs/build-inputs.json" --shard-plan "$RUNNER_TEMP/shards.json" --shard "${{ matrix.shard }}"; then
            .github/scripts/ci-evidence.sh export-hashes --input "$RUNNER_TEMP/observations.json" --output "$RUNNER_TEMP/ci-inputs/observed-case-hashes.json"
          else
            mkdir -p "$RUNNER_TEMP/ci-inputs"
            python3 - "$RUNNER_TEMP/ci-inputs/observed-case-hashes.json" <<'PY_INCOMPLETE'
          import json, os, sys
          with open(sys.argv[1], 'w') as output:
              json.dump({'schema': 1, 'type': 'observed-case-hashes', 'complete': False,
                         'ability_proven': False, 'run_id': os.environ['GITHUB_RUN_ID'],
                         'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                         'reason': 'original test evidence could not be parsed completely'}, output)
          PY_INCOMPLETE
          fi
      - name: Read back the executed JUnit observer controls
        run: python3 .github/scripts/_ci-evidence-regression-smoke.py --junit-shard "$RUNNER_TEMP/shards.json" "${{ matrix.shard }}"
      - name: Record post-test input hashes
        if: always()
        run: .github/scripts/ci-receipt.sh inputs --root . --repo-local "$RUNNER_TEMP/m2" --phase post-test-before-pack --runtime-class-dir "$RUNNER_TEMP/ci-runtime-bytecode" --output "$RUNNER_TEMP/ci-inputs/post-test-inputs.json" --shard-id "${{ matrix.shard }}" --maven-observation "$RUNNER_TEMP/maven-observation/summary.json"
      - name: Record storage after the test shard
        if: always()
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /tmp
          if ! docker system df; then
            echo '::warning::Docker storage could not be observed after the test shard.'
          fi
          if ! du -sh "$RUNNER_TEMP/m2" "$GITHUB_WORKSPACE" /tmp; then
            echo '::warning::Some test storage could not be measured.'
          fi
      - name: Preserve downloaded dependencies
        if: always()
        run: .github/scripts/ci-maven-cache.sh collect "$HOME/.m2/repository" "$RUNNER_TEMP/m2"
      - name: Validate and package this shard's evidence
        env:
          SHARD: ${{ matrix.shard }}
        run: .github/scripts/ci-aggregate.sh pack --plan "$RUNNER_TEMP/shards.json" --shard "$SHARD" --output "$RUNNER_TEMP/ci-artifacts/$SHARD"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-test-results-${{ matrix.shard }}
          overwrite: true
          path: ${{ runner.temp }}/ci-artifacts/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-inputs-${{ matrix.shard }}
          overwrite: true
          path: ${{ runner.temp }}/ci-inputs/
          if-no-files-found: error
          retention-days: 7
      - name: The scene where a shard failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-${{ matrix.shard }}
          overwrite: true
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            e2e/target/failure-scenes/
          if-no-files-found: ignore
          retention-days: 7

  # This stable, non-matrix name is the required check. It admits the union,
  # including every shard's declared report and coverage files, before reporting green.
  build:
    # Only this job contacts Sonar; tests for later updates can proceed independently.
    # Match the manual analysis group and retain pending analyses while one runs.
    concurrency:
      group: ${{ format('sonarqube-{0}', github.event.pull_request.number || github.ref) }}
      cancel-in-progress: false
      queue: max
    outputs:
      sonar-enabled: ${{ steps.guard.outputs.run }}
      sonar-outcome: ${{ steps.analyze.outcome }}
    needs: [shard-plan, test-shards]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.13+9.0.LTS'
          cache: maven
      - name: Verify exact Java build
        shell: bash
        run: |
          java -XshowSettings:properties -version 2>&1 | grep -Fx '    java.runtime.version = 21.0.13+9-LTS'
      - name: Check secret availability
        id: guard
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          if [ -n "${SONAR_TOKEN:-}" ] && [ -n "${SONAR_HOST_URL:-}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=false" >> "$GITHUB_OUTPUT"

          # From here the job ends green having analyzed nothing, and saying that quietly is the
          # dangerous part: this is a required check, so the checks list shows the same tick here
          # as on a run where the quality gate genuinely passed. Whoever reviews an outside
          # contribution reads that tick as "quality measured" - and so do we, on our own repository,
          # if the secrets are ever rotated away.
          #
          # Failing instead is not the repair. A fork's workflow run cannot be given repository
          # secrets by any configuration, so a red here would mean no outside contribution can ever
          # merge - the failure this workflow's fork guard exists to avoid. The fix is not to change
          # the colour but to stop the colour from being the only thing said.
          if [ "${IS_FORK_PR:-false}" = "true" ]; then
            why="this pull request comes from a fork, and a fork's workflow run is never given repository secrets"
          else
            why="SONAR_TOKEN / SONAR_HOST_URL are not configured on this repository"
          fi
          echo "::notice title=SonarQube not evaluated::No analysis ran: ${why}. This check is green because it was skipped, not because the quality gate passed."
          {
            printf '## SonarQube: not evaluated\n\n'
            printf 'No analysis ran on this commit, because %s.\n\n' "$why"
            printf '**This check is green because it was skipped, not because the quality gate passed.**\n\n'
            printf 'Neither code quality nor the new-code coverage condition was measured here. The\n'
            printf 'diff-coverage summary on the CI workflow is what a run without secrets can still\n'
            # Markdown backticks are literal.
            # shellcheck disable=SC2016
            printf 'produce; the quality gate itself is measured once the change reaches `main`.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Seed an isolated dependency repository
        run: .github/scripts/ci-maven-cache.sh seed "$HOME/.m2/repository" "$RUNNER_TEMP/m2"
      - uses: actions/download-artifact@v4
        with:
          name: ci-shard-plan
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-test-results-*
          path: ${{ runner.temp }}/ci-artifacts
          merge-multiple: true
      - name: Prepare local artifacts for report generation
        run: |
          mkdir -p "$RUNNER_TEMP/maven-observation"
          .github/scripts/ci-build-observation.sh --root . --work-dir "$RUNNER_TEMP/maven-observation" --output "$RUNNER_TEMP/maven-observation/summary.json" --shard-id build -- mvn -B -T 2 -Dmaven.repo.local="$RUNNER_TEMP/m2" -DskipTests install
      - name: Record the aggregate build inputs
        run: .github/scripts/ci-receipt.sh inputs --root . --repo-local "$RUNNER_TEMP/m2" --resolve-classpath --output "$RUNNER_TEMP/ci-inputs/build-inputs.json" --shard-id build --maven-observation "$RUNNER_TEMP/maven-observation/summary.json"
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-inputs-*
          path: ${{ runner.temp }}/ci-shard-inputs
      - name: Admit independent build input hashes
        run: .github/scripts/ci-receipt.sh compare-inputs --root . --plan "$RUNNER_TEMP/shards.json" --inputs-root "$RUNNER_TEMP/ci-shard-inputs" --aggregate-inputs "$RUNNER_TEMP/ci-inputs/build-inputs.json" --artifacts "$RUNNER_TEMP/ci-artifacts" --output "$RUNNER_TEMP/ci-inputs/build-input-equivalence.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-inputs-build
          overwrite: true
          path: ${{ runner.temp }}/ci-inputs/
          if-no-files-found: error
          retention-days: 7
      - name: Admit the complete report and coverage set
        run: .github/scripts/ci-aggregate.sh verify --plan "$RUNNER_TEMP/shards.json" --artifacts "$RUNNER_TEMP/ci-artifacts" --restore .
      - name: Every shard job succeeded
        env:
          SHARD_RESULT: ${{ needs.test-shards.result }}
        run: test "$SHARD_RESULT" = success
      - name: MCP stdio smoke (Boot JAR sidecar)
        run: |
          jar="$(find control/mcp-server/target -maxdepth 1 -name 'mcp-server-*-boot.jar' -print -quit)"
          test -n "$jar"
          bash control/mcp-server/mcp-smoke.sh "$jar"
      - name: Identify Sonar cache inputs
        id: sonar-cache-key
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: .github/scripts/sonar-cache-key.sh >> "$GITHUB_OUTPUT"
      # A server-content key permits saving newly downloaded plugin versions.
      # Older entries can supply unchanged binaries; native hashes select updates.
      - name: Restore Sonar analyzer binaries
        id: sonar-cache
        if: steps.guard.outputs.run == 'true' && steps.sonar-cache-key.outcome == 'success'
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.sonar-cache-key.outputs.server }}-${{ steps.sonar-cache-key.outputs.manifest }}
          restore-keys: |
            sonar-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.sonar-cache-key.outputs.server }}-
      - name: Merge coverage from every declared shard
        run: |
          mvn -B -Dmaven.repo.local="$RUNNER_TEMP/m2" -N jacoco:merge@jacoco-merge-reactor
          mvn -B -Dmaven.repo.local="$RUNNER_TEMP/m2" jacoco:report@jacoco-report-reactor
      - name: Analyze admitted coverage
        id: analyze
        continue-on-error: true
        if: steps.guard.outputs.run == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The analysis lock orders arrivals, not revisions. A slower old main
          # run must not upload after a newer revision has reached the server.
          if [ "${GITHUB_REF:-}" = refs/heads/main ] && [ "${GITHUB_EVENT_NAME:-}" != pull_request ]; then
            checkout_head="$(git rev-parse HEAD)"
            if ! [[ "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || [ "$checkout_head" != "$GITHUB_SHA" ]; then
              echo '::error::Main analysis checkout identity is inconsistent; analysis not uploaded.'
              exit 1
            fi
            current_head="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha 2>/dev/null)" || current_head=""
            if ! [[ "$current_head" =~ ^[0-9a-f]{40}$ ]] || [ "$current_head" != "$checkout_head" ]; then
              echo '::error::Current main differs or could not be confirmed; analysis not uploaded.'
              exit 1
            fi
          fi
          unset GH_TOKEN GITHUB_TOKEN
          args=(
            -Dsonar.projectKey=tapstate
            -Dsonar.host.url="$SONAR_HOST_URL"
            -Dsonar.login="$SONAR_TOKEN"
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=1800
          )
          # On a release tag (e.g. v1.2.3) stamp the analysis with the release version (strip the
          # leading v), so it creates a version event. With the "previous version" New Code
          # definition, that resets the baseline; other builds keep the pom's default version.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            args+=("-Dsonar.projectVersion=${GITHUB_REF_NAME#v}")
          fi
          mvn -B -Dmaven.repo.local="$RUNNER_TEMP/m2" sonar:sonar "${args[@]}"

      # Best-effort PR decoration for Community Edition. Runs even when the analyze step failed
      # (that is exactly the gate-red case worth commenting on); continue-on-error keeps a comment
      # glitch from ever flipping a green job to red - the analyze step is the sole gate authority.
      - name: Comment quality gate on PR
        if: always() && steps.guard.outputs.run == 'true' && steps.analyze.outcome != 'skipped' && steps.analyze.outcome != '' && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          # An old analysis remains bound to its own run. It must not replace a
          # current-head decoration after the pull request advances.
          current_head="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha 2>/dev/null)" || current_head=""
          if [ "$current_head" != "$EXPECTED_HEAD_SHA" ] || ! [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::notice::PR head changed or could not be confirmed; preserving the current decoration.'
            exit 0
          fi
          host="${SONAR_HOST_URL%/}"
          dashboard="$host/dashboard?id=tapstate&pullRequest=${PR_NUMBER}"

          # This instance has the Community Branch Plugin, so the PR is analyzed as a pull request
          # whose new code is its diff against the base branch. Query the gate in that PR context,
          # not the main branch (which would read empty). The analyze step already waited for the
          # gate and concurrency serializes runs, so this status is this run's.
          ps="$(curl -s -u "$SONAR_TOKEN:" "$host/api/qualitygates/project_status?projectKey=tapstate&pullRequest=${PR_NUMBER}" || true)"
          status="$(printf '%s' "$ps" | jq -r '.projectStatus.status // "UNKNOWN"' 2>/dev/null || echo UNKNOWN)"
          details="$(printf '%s' "$ps" | jq -r '.projectStatus.conditions[]? | select(.status=="ERROR") | "- `\(.metricKey)`: \(.actualValue) (fails \(.comparator) \(.errorThreshold))"' 2>/dev/null || true)"
          issue_details=""
          page=1
          while :; do
            issues="$(curl -s -u "$SONAR_TOKEN:" "$host/api/issues/search?componentKeys=tapstate&pullRequest=${PR_NUMBER}&resolved=false&ps=100&p=${page}" || true)"
            page_details="$(printf '%s' "$issues" | jq -r '.issues[]? | "- `\(.rule)` [\(.severity)]: `\(.component | sub("^tapstate:"; "")):\(.line // "?")` — \(.message)"' 2>/dev/null || true)"
            if [ -n "$page_details" ]; then
              if [ -n "$issue_details" ]; then
                issue_details="${issue_details}"$'\n'
              fi
              issue_details="${issue_details}${page_details}"
            fi
            next_page="$(printf '%s' "$issues" | jq -r '.paging | select((.pageIndex * .pageSize) < .total) | (.pageIndex + 1)' 2>/dev/null || true)"
            if ! [[ "$next_page" =~ ^[0-9]+$ ]] || [ "$next_page" -le "$page" ]; then
              break
            fi
            page="$next_page"
          done

          case "$status" in
            OK)    emoji="white_check_mark";   verdict="passed" ;;
            ERROR) emoji="x";                  verdict="failed" ;;
            # NONE = the gate could not be evaluated because there is no New Code to measure
            # (the "Sonar way" conditions are all on new code; the first analysis, or one with
            # no New Code baseline set on the server, has nothing to compare against). Not a failure.
            NONE)  emoji="information_source"; verdict="not evaluated (no New Code baseline yet)" ;;
            *)     emoji="warning";            verdict="unknown (see the workflow logs)" ;;
          esac

          {
            printf '<!-- sonarqube-gate -->\n'
            printf '### :%s: SonarQube quality gate: **%s**\n\n' "$emoji" "$verdict"
            # shellcheck disable=SC2016
            printf 'Analyzed PR head `%s` in [this workflow run](https://github.com/%s/actions/runs/%s/attempts/%s).\n\n' "$EXPECTED_HEAD_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            if [ -n "${details:-}" ]; then
              printf 'Failing conditions:\n%s\n\n' "$details"
            fi
            if [ -n "${issue_details:-}" ]; then
              printf 'Open unresolved issues:\n%s\n\n' "$issue_details"
            fi
            printf '[Open the pull-request dashboard](%s)\n\n' "$dashboard"
            printf '_Posted by CI from the SonarQube pull-request quality gate._\n'
          } > comment.md

          existing="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | contains("<!-- sonarqube-gate -->")) | .id' 2>/dev/null | head -n1 || true)"
          current_head="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha 2>/dev/null)" || current_head=""
          if [ "$current_head" != "$EXPECTED_HEAD_SHA" ]; then
            echo '::notice::PR head changed during decoration; preserving the current decoration.'
            exit 0
          fi
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$(cat comment.md)" >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$(cat comment.md)" >/dev/null
          fi
          echo "Posted quality gate comment (status=${status})."

      - name: Preserve downloaded dependencies
        if: always()
        run: .github/scripts/ci-maven-cache.sh collect "$HOME/.m2/repository" "$RUNNER_TEMP/m2"
      - name: Diff coverage
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          base="origin/${{ github.base_ref }}"
          git rev-parse --verify --quiet "$base" >/dev/null 2>&1 \
            || git fetch --quiet --no-tags origin "${{ github.base_ref }}" || true
          DIFF_RANGE="$base...HEAD" bash .github/scripts/diff-coverage.sh >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve the admitted reports and coverage
        uses: actions/upload-artifact@v4
        with:
          name: ci-aggregate
          overwrite: true
          path: |
            target/ci-shards/
            target/jacoco-reactor.exec
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
            **/target/site/jacoco/jacoco.xml
          if-no-files-found: error
          retention-days: 7

  # A stable native check preserves fork-token behavior for every subscribed event.
  sonarqube:
    name: sonarqube
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Report analysis outcome
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          SONAR_ENABLED: ${{ needs.build.outputs.sonar-enabled }}
          SONAR_OUTCOME: ${{ needs.build.outputs.sonar-outcome }}
        run: |
          set -euo pipefail
          test "$BUILD_RESULT" = success
          if [ "$SONAR_ENABLED" = false ]; then
            echo '::notice title=SonarQube not evaluated::Repository secrets were unavailable. This check is green because analysis was skipped, not because the quality gate passed.'
            printf '## SonarQube: not evaluated\n\nRepository secrets were unavailable (including fork pull requests). This check is green because analysis was skipped, not because the quality gate passed. See the build summary for the reason and diff coverage.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$SONAR_ENABLED" = true
          test "$SONAR_OUTCOME" = success
          echo 'SonarQube analysis and quality gate passed.' >> "$GITHUB_STEP_SUMMARY"

  installer:
    # The install and quickstart scripts are shell, not Java: shellcheck them (ubuntu-latest ships
    # shellcheck) and run their smokes. Both drive platform detection, the unsupported-platform refusals,
    # checksum verification, credential handling and idempotency against local file:// / loopback stubs —
    # no network, and no Docker (the quickstart smoke stops before the live run phase).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck the shell scripts
        run: |
          shellcheck -s sh install/install.sh
          shellcheck install/install-smoke.sh install/_event-sink.sh
          shellcheck install/install-smoke-test.sh
          shellcheck -s sh deploy/quickstart/quickstart.sh
          shellcheck deploy/quickstart/quickstart-smoke.sh install/_event-sink.sh
          shellcheck deploy/quickstart/quickstart-smoke-test.sh
          shellcheck deploy/docker/image-smoke.sh deploy/docker/image-smoke-test.sh deploy/docker/image-smoke-fixture-test.sh
          shellcheck deploy/docker/dockerfile-smoke.sh
          shellcheck deploy/docker/dockerfile-smoke-test.sh
          shellcheck scripts/prepare-web-assets.sh
          shellcheck scripts/build-web-assets.sh
          shellcheck scripts/prepare-web-assets-smoke.sh
          shellcheck deploy/cloud/ghcr-publish.sh deploy/cloud/ghcr-publish-smoke.sh
          shellcheck deploy/cloud/cloud-image-smoke.sh
          python3 -m py_compile .github/scripts/web-provenance.py .github/scripts/web-provenance-smoke.py
          python3 -m py_compile scripts/web-assets-profile.py scripts/web-assets-profile-smoke.py
          shellcheck -s sh deploy/install-site/assemble.sh
          shellcheck -s sh deploy/install-site/verify-published.sh
          shellcheck deploy/install-site/verify-smoke.sh
          shellcheck -s sh deploy/install-site/check-site.sh
          shellcheck -s sh deploy/install-site/check-site-smoke.sh
          shellcheck -s sh scripts/funnel-capture.sh
          shellcheck -s sh scripts/funnel-publish.sh
          shellcheck -s sh scripts/funnel-report.sh
          shellcheck -s sh scripts/funnel-capture-smoke.sh
      - name: installer smoke
        run: bash install/install-smoke.sh
      - name: installer smoke verdict tests
        run: bash install/install-smoke-test.sh
      - name: quickstart smoke
        run: bash deploy/quickstart/quickstart-smoke.sh
      - name: quickstart smoke verdict tests
        run: bash deploy/quickstart/quickstart-smoke-test.sh
      - name: Dockerfile smoke verdict tests
        run: bash deploy/docker/dockerfile-smoke-test.sh
      - name: Image smoke fixture diagnostics tests
        run: |
          bash deploy/docker/image-smoke-test.sh
          bash deploy/docker/image-smoke-fixture-test.sh
      - name: Web asset packaging cases
        run: bash scripts/prepare-web-assets-smoke.sh
      - name: Web release provenance cases
        run: python3 .github/scripts/web-provenance-smoke.py
      - name: Cloud connector input and test-preparation cases
        run: python3 deploy/cloud/stage-connectors-test.py
      - name: Cloud image runtime helper cases
        run: |
          node --test deploy/cloud/image-runtime-probe.test.mjs
          PYTHONDONTWRITEBYTECODE=1 python3 deploy/cloud/image-runtime-metadata-test.py
      - name: Public Cloud GHCR publisher cases
        run: bash deploy/cloud/ghcr-publish-smoke.sh
      - name: Authenticated Cloud artifact cases
        run: node --test scripts/seal-cloud-artifact.test.mjs
      - name: Cloud release registration cases
        run: node --test scripts/notify-cloud-release.test.mjs
      - name: Cloud dev version notification cases
        run: node --test scripts/notify-cloud-dev.test.mjs
      - name: install-site verifier smoke
        run: bash deploy/install-site/verify-smoke.sh

      # A function and the route that reaches it travel separately through the release path, so they
      # can disagree -- and when they do, every downstream signal still looks correct.
      - name: install-site consistency smoke
        run: sh deploy/install-site/check-site-smoke.sh

      # The receiver decides what is stored, so its rules are tested rather than reviewed. node --test
      # is built in; there is no package.json and no dependency to install.
      - name: install event receiver tests
        run: node --test deploy/install-site/api/event.test.js

      # The capture/report/publish half of the funnel is where a wrong number is produced silently: a
      # double-counted window, a running total presented as a period, or a gap reported as zero all
      # look entirely plausible on the page. Fixtures stand in for the API, so this needs no network
      # and no credentials.
      - name: funnel capture smoke
        run: sh scripts/funnel-capture-smoke.sh

  catalog-scripts:
    # The catalog refresh driver and the connector build it calls are shell, and the driver is a gate:
    # its whole job is turning "this step did not run" into a non-zero exit, because every step of a
    # refresh is a JUnit test that skips - rather than fails - when its inputs are absent. A gate that
    # nothing checks is the shape that goes green having verified nothing, which is the shape it was
    # written to prevent. Both smokes drive stubs placed on PATH: no Maven, no connectors, no network.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CI evidence and durable receipt controls
        run: |
          shellcheck .github/scripts/ci-mechanism-inputs.sh
          python3 -m py_compile .github/scripts/_ci-mechanism-inputs.py .github/scripts/_ci-mechanism-inputs-smoke.py
          shellcheck .github/scripts/ci-group-delta.sh .github/scripts/ci-group-delta-smoke.sh .github/scripts/ci-case-partition.sh .github/scripts/ci-case-partition-smoke.sh .github/scripts/ci-group-components.sh .github/scripts/ci-group-components-smoke.sh .github/scripts/ci-trigger-contract.sh .github/scripts/ci-trigger-contract-smoke.sh .github/scripts/ci-build-observation.sh .github/scripts/ci-build-observation-smoke.sh .github/scripts/ci-provider-replay.sh .github/scripts/ci-provider-replay-readback.sh .github/scripts/ci-evidence.sh .github/scripts/ci-evidence-smoke.sh .github/scripts/ci-receipt.sh .github/scripts/ci-receipt-smoke.sh .github/scripts/ci-pr-groups.sh .github/scripts/ci-pr-groups-smoke.sh .github/scripts/ci-variants.sh .github/scripts/ci-variants-smoke.sh .github/scripts/ci-source-projection.sh .github/scripts/ci-source-projection-smoke.sh .github/scripts/ci-archive-inputs.sh .github/scripts/ci-archive-inputs-smoke.sh .github/scripts/ci-archive-cases.sh .github/scripts/ci-archive-cases-smoke.sh .github/scripts/ci-trigger-basis.sh .github/scripts/ci-trigger-basis-smoke.sh .github/scripts/ci-pr-instances.sh .github/scripts/ci-pr-instances-smoke.sh .github/scripts/ci-instance-evidence.sh .github/scripts/ci-instance-evidence-smoke.sh
          python3 -m py_compile .github/scripts/_ci-maven-artifacts.py .github/scripts/_ci-maven-artifacts-smoke.py
          python3 -m py_compile .github/scripts/_ci-test-jar-inputs.py .github/scripts/_ci-test-jar-inputs-smoke.py
          python3 -m py_compile .github/scripts/_ci-group-delta.py .github/scripts/_ci-group-delta-smoke.py .github/scripts/_ci-case-partition.py .github/scripts/_ci-case-partition-smoke.py .github/scripts/_ci-group-components.py .github/scripts/_ci-group-components-smoke.py .github/scripts/_ci-trigger-contract.py .github/scripts/_ci-trigger-contract-smoke.py .github/scripts/_ci-build-observation.py .github/scripts/_ci-evidence.py .github/scripts/_ci-provider-receipt-smoke.py .github/scripts/_ci-provider-readback.py .github/scripts/_ci-provider-readback-smoke.py .github/scripts/_ci-provider-replay.py .github/scripts/_ci-provider-replay-smoke.py .github/scripts/_ci-provider-replay-readback.py .github/scripts/_ci-serial-readback.py .github/scripts/_ci-provider-replay-readback-smoke.py .github/scripts/_ci-provider-cases-smoke.py .github/scripts/_ci-provider-command.py .github/scripts/_ci-receipt.py .github/scripts/_ci-pr-groups.py .github/scripts/_ci-variants.py .github/scripts/_ci-source-projection.py .github/scripts/_ci-archive-inputs.py .github/scripts/_ci-archive-inputs-smoke.py .github/scripts/_ci-archive-cases.py .github/scripts/_ci-archive-cases-smoke.py .github/scripts/_ci-trigger-basis.py .github/scripts/_ci-trigger-basis-smoke.py .github/scripts/_ci-pr-instances.py .github/scripts/_ci-pr-instances-smoke.py .github/scripts/_ci-instance-evidence.py .github/scripts/_ci-instance-evidence-smoke.py
          bash .github/scripts/ci-evidence-smoke.sh
          python3 .github/scripts/_ci-maven-artifacts-smoke.py
          python3 .github/scripts/_ci-test-jar-inputs-smoke.py
          python3 .github/scripts/_ci-provider-receipt-smoke.py
          bash .github/scripts/ci-receipt-smoke.sh
          bash .github/scripts/ci-build-observation-smoke.sh
          bash .github/scripts/ci-pr-groups-smoke.sh
          bash .github/scripts/ci-group-delta-smoke.sh
          bash .github/scripts/ci-case-partition-smoke.sh
          python3 .github/scripts/_ci-mechanism-inputs-smoke.py
          bash .github/scripts/ci-group-components-smoke.sh
          bash .github/scripts/ci-variants-smoke.sh
          bash .github/scripts/ci-source-projection-smoke.sh
          bash .github/scripts/ci-archive-inputs-smoke.sh
          python3 .github/scripts/_ci-provider-readback-smoke.py
          python3 .github/scripts/_ci-provider-replay-smoke.py
          python3 .github/scripts/_ci-provider-replay-readback-smoke.py
          python3 .github/scripts/_ci-provider-cases-smoke.py
          bash .github/scripts/ci-archive-cases-smoke.sh
          bash .github/scripts/ci-trigger-basis-smoke.sh
          bash .github/scripts/ci-trigger-contract-smoke.sh
          bash .github/scripts/ci-pr-instances-smoke.sh
          bash .github/scripts/ci-instance-evidence-smoke.sh
      - name: shellcheck the catalog scripts
        # One invocation over all four rather than a line each: a `run: |` block runs under bash -e,
        # so the first script to report anything aborts the step and the ones after it are never
        # checked - which reads as "the rest were clean". The installer job above lost three scripts
        # that way for three sessions. Checked against 0.9.0, which is what the runner's apt ships and
        # is stricter here than a current local build.
        run: shellcheck scripts/refresh-catalog.sh scripts/refresh-catalog-smoke.sh scripts/build-real-connectors.sh scripts/build-real-connectors-smoke.sh .github/scripts/catalog-age-days.sh .github/scripts/catalog-age-days-smoke.sh .github/scripts/diff-coverage.sh .github/scripts/diff-coverage-smoke.sh .github/scripts/translate-intake.sh .github/scripts/translate-intake-smoke.sh .github/scripts/fork-sonar-smoke.sh .github/scripts/issue-templates-smoke.sh .github/scripts/latest-release-tag.sh .github/scripts/latest-release-tag-smoke.sh .github/scripts/set-version.sh .github/scripts/set-version-smoke.sh .github/scripts/next-version.sh .github/scripts/next-version-smoke.sh .github/scripts/release-manifest.sh .github/scripts/release-manifest-smoke.sh .github/scripts/site-from-tag.sh .github/scripts/site-from-tag-smoke.sh .github/scripts/changeset-parity.sh .github/scripts/changeset-parity-smoke.sh .github/scripts/_pr-read.sh .github/scripts/_pr-read-smoke.sh .github/scripts/release-notes-read-failure-smoke.sh .github/scripts/_pr-section.sh .github/scripts/docs-impact.sh .github/scripts/checks-on-commit.sh .github/scripts/checks-on-commit-smoke.sh .github/scripts/docs-gate.sh .github/scripts/docs-gate-smoke.sh .github/scripts/release-notes.sh .github/scripts/release-notes-smoke.sh .github/scripts/release-shape-smoke.sh .github/scripts/quickstart-live-shape-smoke.sh .github/scripts/roadmap-shipped.sh .github/scripts/roadmap-shipped-smoke.sh .github/scripts/satellites.sh .github/scripts/satellites-smoke.sh .github/scripts/docs-release.sh .github/scripts/docs-release-smoke.sh .github/scripts/ci-timing.sh .github/scripts/ci-timing-smoke.sh .github/scripts/ci-shard.sh .github/scripts/ci-shard-smoke.sh .github/scripts/ci-aggregate.sh .github/scripts/ci-aggregate-smoke.sh .github/scripts/ci-shape-smoke.sh .github/scripts/ci-maven-cache.sh .github/scripts/ci-maven-cache-smoke.sh .github/scripts/sonar-inputs.sh .github/scripts/sonar-inputs-smoke.sh .github/scripts/sonar-workflow-smoke.sh .github/scripts/ci-pr-work.sh .github/scripts/connector-witnesses.sh .github/scripts/connector-witnesses-smoke.sh .github/scripts/connector-cache.sh .github/scripts/connector-cache-smoke.sh .github/scripts/connector-workflow-smoke.sh .github/scripts/one-verify.sh .github/scripts/one-verify-smoke.sh .github/scripts/sonar-cache-key.sh .github/scripts/sonar-cache-smoke.sh .github/scripts/nightly-upgrade-expiry-smoke.sh
      - name: One automatic full test suite
        run: bash .github/scripts/one-verify.sh
      - name: Full test invocation cases
        run: bash .github/scripts/one-verify-smoke.sh
      - name: CI shard and aggregate cases
        run: |
          python3 .github/scripts/connector-witness-coverage-test.py
          bash .github/scripts/connector-witnesses-smoke.sh
          bash .github/scripts/connector-cache-smoke.sh
          bash .github/scripts/connector-workflow-smoke.sh
          bash .github/scripts/ci-shard-smoke.sh
          bash .github/scripts/ci-aggregate-smoke.sh
          bash .github/scripts/ci-shape-smoke.sh
          bash .github/scripts/ci-maven-cache-smoke.sh
          bash .github/scripts/sonar-inputs-smoke.sh
          bash .github/scripts/sonar-workflow-smoke.sh
          python3 .github/scripts/_ci-pr-work-smoke.py
          python3 .github/scripts/sonar-main-gate-timeout-test.py
          bash .github/scripts/sonar-cache-smoke.sh
      - name: CI timing cases
        run: bash .github/scripts/ci-timing-smoke.sh
      - name: refresh driver cases
        run: bash scripts/refresh-catalog-smoke.sh
      - name: catalog refresh publication credential case
        run: python3 .github/scripts/catalog-refresh-push-auth-test.py
      - name: connector build cases
        run: bash scripts/build-real-connectors-smoke.sh
      - name: catalog age cases
        run: bash .github/scripts/catalog-age-days-smoke.sh
      # Not a catalog script, but this is the job where a shell gate's cases run, and the coverage
      # summary is shell whose failure mode is the one this job exists for: a number that is quietly
      # wrong reads exactly like a number that is right.
      - name: diff coverage cases
        run: bash .github/scripts/diff-coverage-smoke.sh
      # Also not a catalog script. Its own workflow fires on `issues`, so these cases would never
      # run on a pull request if they lived there - and this gate's every failure path is a silent
      # skip, which is precisely the shape that rots unnoticed.
      - name: intake translation cases
        run: bash .github/scripts/translate-intake-smoke.sh

      # Also not a catalog script. Three workflows ask it which release is newest, and none of the
      # three is a place its cases could live: two of them only run on a release or a dispatch, and
      # the third would run them once per matrix leg for no gain.
      - name: latest release tag cases
        run: bash .github/scripts/latest-release-tag-smoke.sh

      - name: version pin cases
        run: bash .github/scripts/set-version-smoke.sh

      - name: next version cases
        run: bash .github/scripts/next-version-smoke.sh

      - name: release completeness cases
        run: bash .github/scripts/release-manifest-smoke.sh

      # A release tag points at the commit CI validated, which is the tree from *before* the version
      # was written in -- so the two entry points the install site serves have to be pinned on the
      # way out, not read straight from the tag.
      - name: install-site entry point cases
        run: bash .github/scripts/site-from-tag-smoke.sh

      # Vacuous against this tree -- no changeset exists yet -- so its cases seed their own. Running
      # it here is what stops it from still being vacuous, and unnoticed, on the day one lands.
      - name: changeset parity cases
        run: bash .github/scripts/changeset-parity-smoke.sh

      # The three release gates. They only ever run inside a release, which is the worst possible
      # place to find out one of them is broken -- so their cases run on every push instead.
      - name: The release gate reads the checks on a commit the way it is supposed to
        run: bash .github/scripts/checks-on-commit-smoke.sh
      - name: The documentation gate still tells "nobody answered" from "answered none"
        run: bash .github/scripts/docs-gate-smoke.sh
      - name: The release notes still assemble the way they are supposed to
        run: |
          bash .github/scripts/_pr-read-smoke.sh
          bash .github/scripts/release-notes-smoke.sh
          bash .github/scripts/release-notes-read-failure-smoke.sh
      # The satellites are three repositories this one cannot see the inside of, so what is testable
      # here is which of them would be touched and with what ref -- and that is exactly the half whose
      # failure is silent: a satellite dropped from the list is never tagged and nothing reports it.
      - name: Every satellite still gets the branch and the tag it is supposed to
        run: bash .github/scripts/satellites-smoke.sh
      # The documentation site is coordinated rather than pinned, and the one thing that must never
      # regress is that it cannot stop a release. Three of these cases read the file rather than run
      # it, because --plan returns 0 down every path and the issue lookup needs somebody else's repo.
      - name: The documentation site still cannot block a release
        run: bash .github/scripts/docs-release-smoke.sh
      # The board is a concurrent writer: a project workflow fires when an item is added and lands
      # after the mutation, so a run can report every issue moved, exit 0, and leave the board saying
      # something else. Measured on the first real release -- fifteen reported, seven kept. These
      # cases are the only exercise this script gets outside a published release.
      - name: The roadmap step still reports what the board kept, not what it asked for
        run: bash .github/scripts/roadmap-shipped-smoke.sh
      # Not a script's cases -- the release workflow's own shape. The three acts that cannot be
      # taken back are all downstream of the approval, and every one of them is one line from
      # moving; a rejected release is otherwise the only thing that would find out.
      - name: The release workflow still puts every irreversible act after the approval
        run: bash .github/scripts/release-shape-smoke.sh

      # Same reason, one lane over. The quickstart lanes run nightly against published releases, so
      # what they cover is never read on a pull request -- and the edits that hollow them out are one
      # line each: the arm64 leg going back to ubuntu-latest, the upgrade lane starting from the same
      # release it upgrades to, a `-v` on the stop that turns an upgrade into a fresh install. All
      # three leave the lane green.
      - name: The quickstart lanes still cover arm64, and still upgrade across the volumes
        run: bash .github/scripts/quickstart-live-shape-smoke.sh

      - name: The upgrade lane no longer uses an expired Git recipe
        run: bash .github/scripts/nightly-upgrade-expiry-smoke.sh

      # The gate itself, not its cases: six files pin the release version, and rewriting them from
      # <revision> has to be a no-op. Five of the six already had something watching them one at a
      # time; the MCP server's is read by nothing in the tree, so until this ran, a wrong value there
      # would have shipped without a word.
      - name: the six version pins agree
        run: |
          bash .github/scripts/set-version.sh
          git diff --exit-code || {
            echo "the version pins above disagree with pom.xml's <revision>" >&2
            echo "run .github/scripts/set-version.sh and commit the result" >&2
            exit 1
          }

      # File-level, and that is the point: the property being asserted about the notice workflow is
      # the ABSENCE of a checkout step, which no runtime test can establish.
      - name: fork sonar workflow cases
        run: bash .github/scripts/fork-sonar-smoke.sh

      - name: issue template cases
        run: bash .github/scripts/issue-templates-smoke.sh

  image-smoke:
    # Build the server image for the runner's native architecture and smoke it as a black box: it boots
    # against a throwaway replica set until the image's built-in healthcheck reaches healthy (running as
    # the unprivileged uid), `docker stop` yields an orderly exit 0 (not 137/143), and an unsupported
    # --role is rejected with a coded non-zero exit. The two legs are native runners for the two
    # published architectures, so neither image is emulated. The GitHub runners ship a Docker daemon.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # Which jar the image is built from, before spending a Maven build on smoking the image it
      # produced. Needs no jar of its own -- it builds the real Dockerfile against a synthetic
      # context -- so it runs first and fails fast.
      - name: dockerfile smoke (the boot-jar glob must not resolve two candidates silently)
        run: bash deploy/docker/dockerfile-smoke.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21.0.13+9.0.LTS"
          cache: maven
      - name: Verify exact Java build
        shell: bash
        run: |
          java -XshowSettings:properties -version 2>&1 | grep -Fx '    java.runtime.version = 21.0.13+9-LTS'
      - name: image smoke (builds the boot jar + image, then runs the black-box checks)
        run: bash deploy/docker/image-smoke.sh --build
