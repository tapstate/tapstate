name: CI
run-name: ${{ github.event_name == 'workflow_run' && format('Pipeline Performance | Nightly {0}/{1}', github.event.workflow_run.id, github.event.workflow_run.run_attempt) || 'Pipeline Performance | Manual' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Selection mode for the branch or tag chosen in the dispatch form
        type: choice
        options: [all, group, filter, ids]
        default: all
      group:
        description: One primary group, for example nest
        type: string
      filters:
        description: Space- or comma-separated field=value filters
        type: string
      case_ids:
        description: Space- or comma-separated case IDs with optional @version
        type: string
      baseline_version:
        description: Previously published baseline version, or leave empty for the current release
        type: string

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.run_attempt == '1' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.event == 'schedule' &&
         github.event.workflow_run.run_attempt == 1 &&
         github.event.workflow_run.head_branch == github.event.repository.default_branch &&
         github.event.workflow_run.head_repository.id == github.event.repository.id))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      batches: ${{ steps.prepare.outputs.batches }}
      measurement_stop: ${{ steps.prepare.outputs.measurement_stop }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b77b4c54cbe3255d0942882ae7db18787a935d86
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.13+9.0.LTS'
      - name: Read the start time for this attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/performance-run.json"
      - name: Select and allocate formal cases
        id: prepare
        run: |
          python3 -B benchmarks/actions_run.py \
            --workloads benchmarks/cases/formal-workloads.json \
            --estimates benchmarks/cases/hosted-runner-estimates.json \
            --run "$RUNNER_TEMP/performance-run.json" \
            --output "$RUNNER_TEMP/performance-inputs"
      - name: Verify the full preparation manifest
        env:
          CANDIDATE: b77b4c54cbe3255d0942882ae7db18787a935d86
        run: |
          jq -e --arg expected "$CANDIDATE" --argjson run_id "$GITHUB_RUN_ID" '
            .identity.code_sha == $expected and
            .github_attempt == {"run_id": $run_id, "attempt": 1} and
            .environment == "ubuntu-24.04-x64-op" and
            .scale == "formal" and
            (.selected_ids | length) == 64 and
            (.whole_case_estimates_seconds | length) == 64 and
            (.batches | length) == 8 and
            ([.batches[].entries[] | .case.id] | unique | length) == 64 and
            ([.batches[].entries[].repeats] | unique) == [3] and
            .unallocated == []
          ' "$RUNNER_TEMP/performance-inputs/manifest.json"
          jq -e '.status == "available" or .status == "unavailable"' "$RUNNER_TEMP/performance-inputs/baseline-receipt.json"
          jq '{longest_seconds, remaining_seconds, manifest_sha256}' "$RUNNER_TEMP/performance-inputs/manifest.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-inputs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/performance-inputs
          if-no-files-found: error
          retention-days: 90
