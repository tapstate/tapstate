name: Pipeline Performance
run-name: ${{ github.event_name == 'workflow_run' && format('Pipeline Performance | Nightly {0}/{1}', github.event.workflow_run.id, github.event.workflow_run.run_attempt) || 'Pipeline Performance | Manual' }}

on:
  workflow_run:
    workflows: [Nightly Test]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: Selection mode for the branch or tag chosen in the dispatch form
        type: choice
        options: [all, group, filter, ids]
        default: all
      group:
        description: One primary group, for example nest
        type: string
      filters:
        description: Space- or comma-separated field=value filters
        type: string
      case_ids:
        description: Space- or comma-separated case IDs with optional @version
        type: string
      baseline_version:
        description: Previously published baseline version, or leave empty for the current release
        type: string

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.run_attempt == '1' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.event == 'schedule' &&
         github.event.workflow_run.run_attempt == 1 &&
         github.event.workflow_run.head_branch == github.event.repository.default_branch &&
         github.event.workflow_run.head_repository.id == github.event.repository.id))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      batches: ${{ steps.prepare.outputs.batches }}
      measurement_stop: ${{ steps.prepare.outputs.measurement_stop }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.13+9.0.LTS'
      - name: Read the start time for this attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/performance-run.json"
      - name: Select and allocate formal cases
        id: prepare
        run: |
          python3 -B benchmarks/actions_run.py \
            --workloads benchmarks/cases/formal-workloads.json \
            --estimates benchmarks/cases/hosted-runner-estimates.json \
            --run "$RUNNER_TEMP/performance-run.json" \
            --output "$RUNNER_TEMP/performance-inputs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-inputs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/performance-inputs
          if-no-files-found: error
          retention-days: 90

  measure:
    name: measure (${{ matrix.batch }})
    if: ${{ !cancelled() && github.run_attempt == '1' && needs.prepare.result == 'success' }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJSON(needs.prepare.outputs.batches) }}
    env:
      STOP_AT: ${{ needs.prepare.outputs.measurement_stop }}
      BATCH: ${{ matrix.batch }}
    steps:
      - name: Check the remaining budget
        id: budget
        run: |
          now=$(date +%s)
          if (( STOP_AT <= now )); then
            echo "run=false" >> "$GITHUB_OUTPUT"
            mkdir -p "$RUNNER_TEMP/performance-batch"
            printf 'No time remained for this batch when the runner started.\n' > "$RUNNER_TEMP/performance-batch/expired.txt"
          else
            # Leave time to upload evidence before the job's 350 minute timeout.
            job_stop=$((now + 340 * 60))
            if (( job_stop < STOP_AT )); then
              echo "STOP_AT=$job_stop" >> "$GITHUB_ENV"
            fi
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.budget.outputs.run == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        if: steps.budget.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: '21.0.13+9.0.LTS'
          cache: maven
      - uses: actions/download-artifact@v4
        if: steps.budget.outputs.run == 'true'
        with:
          name: performance-inputs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/performance-inputs
      - name: Set up Maven
        if: steps.budget.outputs.run == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/performance-batch"
          bash .github/scripts/performance-with-budget.sh "Maven setup" bash .github/scripts/setup-ci-maven.sh \
            > "$RUNNER_TEMP/performance-batch/maven-setup.log" 2>&1
      - name: Build and measure the fixed batch
        if: steps.budget.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/performance-batch"
          mkdir -p "$output"
          {
            printf 'Image %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            printf 'Measurement cutoff %s\n' "$STOP_AT"
            uname -a
            lscpu
            free -m
            df -h "$RUNNER_TEMP"
            java -version
            mvn -version
            bash .github/scripts/performance-with-budget.sh "Docker inspection" docker info
            git rev-parse HEAD
          } > "$output/environment.txt" 2>&1
          budget_script=.github/scripts/performance-with-budget.sh
          bash "$budget_script" "connector preparation" python3 -B deploy/cloud/prepare-test-inputs.py \
            --mongodb-only --with-dummy --output "$RUNNER_TEMP/connectors" > "$output/connectors.log" 2>&1
          bash "$budget_script" "MongoDB image pull" docker pull mongo:7.0 > "$output/mongo-pull.log" 2>&1
          bash "$budget_script" "MongoDB image inspection" \
            docker image inspect mongo:7.0 --format '{{json .RepoDigests}}' > "$output/mongo-image.json"
          bash "$budget_script" "application build" mvn -B -pl app,e2e -am -DskipTests package > "$output/build.log" 2>&1
          sha256sum app/target/app-0.8.0-boot.jar "$RUNNER_TEMP/connectors/"*.jar > "$output/artifacts.sha256"
          if (( STOP_AT <= $(date +%s) )); then
            printf 'The batch budget expired before measurement.\n' > "$output/expired.txt"
            exit 124
          fi
          python3 -B benchmarks/runner.py run \
            --manifest "$RUNNER_TEMP/performance-inputs/manifest.json" --batch "$BATCH" \
            --stop-at-epoch-seconds "$STOP_AT" --connectors "$RUNNER_TEMP/connectors" --output "$output/run"
      - name: Upload batch evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-batch-${{ github.run_attempt }}-${{ matrix.batch }}
          path: |
            ${{ runner.temp }}/performance-batch/
            !${{ runner.temp }}/performance-batch/run/**/runtime-input/**
            !${{ runner.temp }}/performance-batch/run/**/witness-input/**
            !${{ runner.temp }}/performance-batch/run/**/verified-connectors/**
          if-no-files-found: error
          retention-days: 30

  report:
    if: always() && github.run_attempt == '1' && needs.prepare.result != 'skipped'
    needs: [prepare, measure]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: performance-inputs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/performance-inputs
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: performance-batch-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/performance-batches
      - name: Read job timing evidence
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$RUNNER_TEMP/performance-jobs.json"
      - name: Locate raw batch archives
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/performance-artifacts.json"
      - name: Reconcile and publish
        env:
          PERFORMANCE_JOB_RESULTS: ${{ format('{{"prepare":"{0}","measure":"{1}"}}', needs.prepare.result, needs.measure.result) }}
        run: |
          python3 -B benchmarks/actions_report.py \
            --inputs "$RUNNER_TEMP/performance-inputs" --artifacts "$RUNNER_TEMP/performance-batches" \
            --output "$RUNNER_TEMP/performance-report" --jobs "$RUNNER_TEMP/performance-jobs.json" \
            --artifact-index "$RUNNER_TEMP/performance-artifacts.json"
      - uses: actions/upload-artifact@v4
        id: report-artifact
        if: always()
        with:
          name: performance-report-${{ github.run_attempt }}
          path: ${{ runner.temp }}/performance-report
          if-no-files-found: error
          retention-days: 90
      - name: Link the published report
        if: always() && steps.report-artifact.outcome == 'success'
        env:
          REPORT_ARTIFACT_URL: ${{ steps.report-artifact.outputs.artifact-url }}
        run: printf '\n[Download report.json and report.md](%s)\n' "$REPORT_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
