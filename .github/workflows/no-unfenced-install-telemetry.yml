# Every workflow that installs declares the install as ours.
# The installer reports one completed install per run and its default endpoint is production, so a
# lane that installs nightly on four platforms feeds a floor of installs no person performed into
# the one figure the funnel divides by. That ran for weeks, and no stored event could be separated
# from a real user afterwards. The gate requires both halves -- the endpoint override that stops the
# send, and the channel that keeps a send which happens anyway out of the denominator -- in the env
# the install actually runs with: the workflow's, its job's or its step's, never another job's.
#
# This check is meant to be a required status check on main (configured in branch protection); a
# workflow that merely runs is not a gate until merges depend on it.
name: no-unfenced-install-telemetry

on:
  push:
    branches:
      - main
      - "ws/**"
  pull_request:
    branches:
      - main

jobs:
  no-unfenced-install-telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The script carries its own liveness control -- lanes that must be caught and lanes that must
      # not -- and runs it before deciding anything about this repository, so a broken scan fails
      # here rather than reporting a clean tree. The smoke runs the whole gate against a scratch
      # repository, so what it prints and the exit status a merge depends on are checked too. Both
      # read workflows with the runner's system python3 and the PyYAML it ships.
      - name: The gate still decides the way it is supposed to
        run: |
          shellcheck .github/scripts/no-unfenced-install-telemetry.sh .github/scripts/no-unfenced-install-telemetry-smoke.sh
          bash .github/scripts/no-unfenced-install-telemetry-smoke.sh

      - name: Every workflow that installs declares the install as ours
        run: bash .github/scripts/no-unfenced-install-telemetry.sh
