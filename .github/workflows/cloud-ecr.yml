name: Cloud image to ECR

on:
  workflow_dispatch:
    inputs:
      tapstate_revision:
        description: Full Tapstate commit SHA to build
        required: true
        type: string
      web_revision:
        description: Full tapstate-web commit SHA to embed
        required: true
        type: string
      target_environment:
        description: GitHub Environment holding the ECR destination and authentication
        required: true
        default: cloud-ecr-test
        type: choice
        options:
          - cloud-ecr-test
          - cloud-ecr-release

permissions:
  contents: read

env:
  CLOUD_SDK_REVISION: d0e25b58096135f4da6b3e69df99876f49c8dc3b

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.verify.outputs.digest }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - name: validate immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ inputs.tapstate_revision }}' =~ ^[0-9a-f]{40}$ ]]
          [[ '${{ inputs.web_revision }}' =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tapstate_revision }}
          persist-credentials: false
      - name: prove the Tapstate checkout is the requested commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = '${{ inputs.tapstate_revision }}'
      - uses: actions/checkout@v4
        with:
          repository: tapstate/tapstate-web
          ref: ${{ inputs.web_revision }}
          token: ${{ secrets.RELEASE_SATELLITE_TOKEN }}
          path: tapstate-web
          persist-credentials: false
      - name: prove the Web checkout is the requested commit
        shell: bash
        run: test "$(git -C tapstate-web rev-parse HEAD)" = '${{ inputs.web_revision }}'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: build the pinned Web production bundle
        working-directory: tapstate-web
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm --filter web i18n:check
          pnpm --filter web test
          pnpm build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Temporary until the same coordinate is available from the configured Nexus snapshot repo.
      - uses: actions/checkout@v4
        with:
          repository: tapstate/tapstate-cloud
          ref: ${{ env.CLOUD_SDK_REVISION }}
          token: ${{ secrets.RELEASE_SATELLITE_TOKEN }}
          path: tapstate-cloud-sdk
          persist-credentials: false
      - name: install the pinned Cloud SDK into the runner Maven repository
        run: >-
          mvn -B -f tapstate-cloud-sdk/pom.xml -pl client/java -am
          -DskipSdkGeneration=true -DskipTests install
      - name: derive unique validation identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          base_version="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          [[ "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          short_sha='${{ inputs.tapstate_revision }}'
          short_sha="${short_sha:0:12}"
          echo "version=${base_version}-validation.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "tag=validation-${short_sha}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: stage the pinned Web bundle for the Boot JAR
        shell: bash
        run: |
          scripts/prepare-web-assets.sh \
            --web-root tapstate-web \
            --web-revision '${{ inputs.web_revision }}' \
            --tapstate-revision '${{ inputs.tapstate_revision }}' \
            --release-version '${{ steps.identity.outputs.version }}' \
            --output app/target/generated-resources/tapstate-web
      - name: build the Web-bearing Boot JAR
        run: mvn -B -pl app -am -DskipTests package
      - name: stage the seven published connector JARs and companion licenses
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cloud-jars"
          gh release download connectors-preview --repo tapstate/tapstate \
            --pattern '*-connector.jar' \
            --pattern 'MICROSOFT-MIT-LICENSE.txt' \
            --pattern 'ORACLE-FREE-USE-TERMS.txt' \
            --dir "$RUNNER_TEMP/cloud-jars"
          PYTHONDONTWRITEBYTECODE=1 python3 deploy/cloud/stage-connectors.py \
            --lock deploy/cloud/connectors.lock.json \
            --jar-dir "$RUNNER_TEMP/cloud-jars" \
            --stage-dir "$RUNNER_TEMP/cloud-stage"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: build the multi-platform Cloud OCI archive
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --progress=plain --target cloud \
            --file deploy/docker/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --build-context "cloud_connectors=$RUNNER_TEMP/cloud-stage" \
            --build-arg "TAPSTATE_RELEASE_VERSION=${{ steps.identity.outputs.version }}" \
            --build-arg "TAPSTATE_REVISION=${{ inputs.tapstate_revision }}" \
            --build-arg "TAPSTATE_WEB_REVISION=${{ inputs.web_revision }}" \
            --build-arg "TAPSTATE_WEB_FILES_SHA256=$(sed -n 's/^files.sha256=//p' app/target/classes/META-INF/tapstate-web.properties)" \
            --output "type=oci,dest=$RUNNER_TEMP/cloud-image.tar" .
      - name: verify the exact archive before exposing ECR credentials
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t boot_jars < <(find app/target -maxdepth 1 -type f -name 'app-*-boot.jar' -print)
          test "${#boot_jars[@]}" = 1
          mkdir "$RUNNER_TEMP/cloud-layout"
          tar -xf "$RUNNER_TEMP/cloud-image.tar" -C "$RUNNER_TEMP/cloud-layout"
          PYTHONDONTWRITEBYTECODE=1 python3 deploy/cloud/verify-image.py \
            --oci-layout "$RUNNER_TEMP/cloud-layout" \
            --lock deploy/cloud/connectors.lock.json \
            --boot-jar "${boot_jars[0]}"
          digest="$(jq -er '.manifests | if length == 1 then .[0].digest else error("root count") end' \
            "$RUNNER_TEMP/cloud-layout/index.json")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-ecr-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cloud-image.tar
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tapstate_revision }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: cloud-ecr-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cloud-image
      - name: choose exactly one AWS authentication mode
        id: auth
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          ECR_STATIC_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          ECR_STATIC_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ECR_STATIC_AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: deploy/cloud/ecr-publish.sh auth-mode
      - name: obtain short-lived AWS credentials through GitHub OIDC
        if: steps.auth.outputs.mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: publish with OIDC credentials
        if: steps.auth.outputs.mode == 'oidc'
        id: publish-oidc
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: >-
          deploy/cloud/ecr-publish.sh publish
          --archive "$RUNNER_TEMP/cloud-image/cloud-image.tar"
          --tag '${{ needs.build.outputs.tag }}'
          --expected-digest '${{ needs.build.outputs.digest }}'
      - name: publish with static test credentials
        if: steps.auth.outputs.mode == 'static'
        id: publish-static
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: >-
          deploy/cloud/ecr-publish.sh publish
          --archive "$RUNNER_TEMP/cloud-image/cloud-image.tar"
          --tag '${{ needs.build.outputs.tag }}'
          --expected-digest '${{ needs.build.outputs.digest }}'
      - name: report deployable identity
        shell: bash
        run: |
          image='${{ steps.publish-oidc.outputs.image }}${{ steps.publish-static.outputs.image }}'
          test -n "$image"
          echo "Cloud image: \`$image\`" >> "$GITHUB_STEP_SUMMARY"
