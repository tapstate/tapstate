# Real connectors run on both fidelity tiers. The source inventory drives both the
# exact shard selectors and the aggregate expectation; a new gated witness joins automatically.
name: Real connectors

on:
  workflow_dispatch:
    inputs:
      connector-inputs:
        description: Connector input policy
        type: choice
        options: [upstream, release]
        default: upstream
  schedule:
    - cron: "30 19 * * *"

concurrency:
  group: real-connectors-sharded-${{ github.ref }}-${{ inputs.connector-inputs || 'upstream' }}
  cancel-in-progress: true

env:
  CONNECTOR_INPUT_MODE: ${{ inputs.connector-inputs || 'upstream' }}

jobs:
  connector-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Plan active connector witnesses and record deferred acceptance
        id: plan
        run: |
          .github/scripts/connector-witnesses.sh plan --input-mode "$CONNECTOR_INPUT_MODE" --durations .github/connector-test-durations.json --output "$RUNNER_TEMP/connector-shards.json"
          echo "requires_atlas=$(jq -r '.requires_atlas_fixtures' "$RUNNER_TEMP/connector-shards.json")" >> "$GITHUB_OUTPUT"
          jq -r '.connector_deferrals | "## Deferred external Atlas acceptance\n\(.reason)\nFollow-up: \(.issue)\n", (.classes[] | "- " + .)' "$RUNNER_TEMP/connector-shards.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Require controlled Atlas fixture inputs when selected
        if: steps.plan.outputs.requires_atlas == 'true'
        env:
          TAPSTATE_ATLAS_TEST_URI: ${{ secrets.TAPSTATE_ATLAS_TEST_URI }}
          TAPSTATE_ATLAS_STANDARD_URI: ${{ secrets.TAPSTATE_ATLAS_STANDARD_URI }}
        run: |
          test -n "$TAPSTATE_ATLAS_TEST_URI" || { echo "Missing required Actions secret: TAPSTATE_ATLAS_TEST_URI" >&2; exit 1; }
          test -n "$TAPSTATE_ATLAS_STANDARD_URI" || { echo "Missing required Actions secret: TAPSTATE_ATLAS_STANDARD_URI" >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: connector-shard-plan
          path: ${{ runner.temp }}/connector-shards.json
          if-no-files-found: error

  connector-jars:
    needs: connector-plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONNECTOR_MODULES: mysql=connectors/mysql-connector,mongodb=connectors/mongodb-connector,postgres=connectors/postgres-connector,oracle=connectors/oracle-connector,sqlserver=connectors/mssql-connector,mongodb-atlas=connectors/mongodb-atlas-connector,aws-rds-mysql=connectors/aws-rds-mysql-connector
    steps:
      - uses: actions/checkout@v4
      - name: Connector JDK compatible with its pinned Lombok
        if: env.CONNECTOR_INPUT_MODE == 'upstream'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            .github/scripts/connector-cache.sh
            scripts/build-real-connectors.sh
            .github/maven-settings-connectors.xml
      - name: Pin the connector Maven toolchain
        if: env.CONNECTOR_INPUT_MODE == 'upstream'
        env:
          MAVEN_VERSION: "3.9.16"
          MAVEN_SHA512: "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/apache-maven-$MAVEN_VERSION-bin.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://archive.apache.org/dist/maven/maven-3/$MAVEN_VERSION/binaries/apache-maven-$MAVEN_VERSION-bin.tar.gz" \
            --output "$archive"
          echo "$MAVEN_SHA512  $archive" | sha512sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          maven_home="$RUNNER_TEMP/apache-maven-$MAVEN_VERSION"
          echo "$maven_home/bin" >> "$GITHUB_PATH"
          echo "MAVEN_HOME=$maven_home" >> "$GITHUB_ENV"
          "$maven_home/bin/mvn" --version
      - name: Seed isolated connector dependencies
        if: env.CONNECTOR_INPUT_MODE == 'upstream'
        run: |
          mkdir -p "$HOME/.m2/repository" "$RUNNER_TEMP/connector-m2"
          rsync -a --exclude='/io/tapstate/' --exclude='/io/tapdata/' "$HOME/.m2/repository/" "$RUNNER_TEMP/connector-m2/"
      - name: Read enterprise connector source
        if: env.CONNECTOR_INPUT_MODE == 'upstream'
        uses: actions/checkout@v4
        with:
          repository: tapdata/tapdata-connectors-enterprise
          token: ${{ secrets.ENTERPRISE_CONNECTORS_READ_TOKEN }}
          path: .connector-enterprise-source
          persist-credentials: false
      - name: Resolve current upstream source
        if: env.CONNECTOR_INPUT_MODE == 'upstream'
        id: source
        run: |
          git clone --depth 1 https://github.com/tapdata/tapdata-connectors.git "$RUNNER_TEMP/connector-source"
          mv "$GITHUB_WORKSPACE/.connector-enterprise-source" "$RUNNER_TEMP/connector-enterprise-source"
          echo "enterprise_sha=$(git -C "$RUNNER_TEMP/connector-enterprise-source" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "oss_sha=$(git -C "$RUNNER_TEMP/connector-source" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # These are remote dependencies only. prepare always refreshes their snapshot
      # metadata and checks resolved bytes before a cached connector jar is eligible.
      - name: Restore remote PDK dependencies
        if: env.CONNECTOR_INPUT_MODE == 'upstream'
        uses: actions/cache/restore@v4
        id: pdk
        with:
          path: ${{ runner.temp }}/connector-m2/io/tapdata
          key: pdk-inputs-${{ runner.os }}-${{ steps.source.outputs.oss_sha }}-${{ steps.source.outputs.enterprise_sha }}-${{ hashFiles('.github/scripts/connector-cache.sh', 'scripts/build-real-connectors.sh', '.github/maven-settings-connectors.xml') }}
      - name: Resolve current snapshot artifacts
        if: env.CONNECTOR_INPUT_MODE == 'upstream'
        id: inputs
        run: |
          .github/scripts/connector-cache.sh prepare --modules "$CONNECTOR_MODULES" --checkout "$RUNNER_TEMP/connector-source" --checkout "$RUNNER_TEMP/connector-enterprise-source" --repo-local "$RUNNER_TEMP/connector-m2" --output "$RUNNER_TEMP/connector-inputs.json"
          echo "key=$(.github/scripts/connector-cache.sh key --manifest "$RUNNER_TEMP/connector-inputs.json")" >> "$GITHUB_OUTPUT"
      # Reuse delays discovering faults outside the resolved source/snapshot inputs.
      # A miss also means possible cache eviction, not necessarily an upstream change.
      - uses: actions/cache/restore@v4
        if: env.CONNECTOR_INPUT_MODE == 'upstream'
        id: jars
        with:
          path: ${{ runner.temp }}/connectors
          key: ${{ steps.inputs.outputs.key }}
      - name: Build current connector jars on a miss
        if: env.CONNECTOR_INPUT_MODE == 'upstream' && (steps.jars.outputs.cache-hit != 'true')
        env:
          MAVEN_ARGS: -nsu -Dmaven.repo.local=${{ runner.temp }}/connector-m2
        run: |
          scripts/build-real-connectors.sh --modules "$CONNECTOR_MODULES" --checkout "$RUNNER_TEMP/connector-source" --checkout "$RUNNER_TEMP/connector-enterprise-source" "$RUNNER_TEMP/connectors"
          .github/scripts/connector-cache.sh seal --checkout "$RUNNER_TEMP/connector-source" --checkout "$RUNNER_TEMP/connector-enterprise-source" --manifest "$RUNNER_TEMP/connector-inputs.json" --repo-local "$RUNNER_TEMP/connector-m2" --jars "$RUNNER_TEMP/connectors"
      - name: Verify exact connector jar evidence
        if: env.CONNECTOR_INPUT_MODE == 'upstream'
        run: .github/scripts/connector-cache.sh verify --manifest "$RUNNER_TEMP/connector-inputs.json" --jars "$RUNNER_TEMP/connectors"
      - uses: actions/cache/save@v4
        if: env.CONNECTOR_INPUT_MODE == 'upstream' && (steps.jars.outputs.cache-hit != 'true')
        with:
          path: ${{ runner.temp }}/connectors
          key: ${{ steps.inputs.outputs.key }}
      - name: Cache verified remote PDK dependencies
        if: env.CONNECTOR_INPUT_MODE == 'upstream' && (steps.pdk.outputs.cache-hit != 'true')
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/connector-m2/io/tapdata
          key: pdk-inputs-${{ runner.os }}-${{ steps.source.outputs.oss_sha }}-${{ steps.source.outputs.enterprise_sha }}-${{ hashFiles('.github/scripts/connector-cache.sh', 'scripts/build-real-connectors.sh', '.github/maven-settings-connectors.xml') }}
      - name: Retain only third-party Maven dependencies
        if: env.CONNECTOR_INPUT_MODE == 'upstream' && (always())
        run: rsync -a --exclude='/io/tapstate/' --exclude='/io/tapdata/' "$RUNNER_TEMP/connector-m2/" "$HOME/.m2/repository/"
      - name: Prepare verified published connector inputs
        if: env.CONNECTOR_INPUT_MODE == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/_connector-inputs.py prepare-release --directory "$RUNNER_TEMP/connectors" --source-sha "$GITHUB_SHA"
      - name: Record upstream connector inputs
        if: env.CONNECTOR_INPUT_MODE == 'upstream'
        run: python3 -B .github/scripts/_connector-inputs.py record --directory "$RUNNER_TEMP/connectors" --mode upstream --source-sha "$GITHUB_SHA"
      - name: Verify selected input identities
        run: python3 -B .github/scripts/_connector-inputs.py verify --directory "$RUNNER_TEMP/connectors" --mode "$CONNECTOR_INPUT_MODE" --source-sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: connector-input-identity
          path: ${{ runner.temp }}/connectors/connector-inputs.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: connector-jars
          path: ${{ runner.temp }}/connectors
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  connector-witnesses:
    needs: [connector-plan, connector-jars]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [shard-1, shard-2, shard-3, shard-4, shard-5, shard-6, shard-7, shard-8, shard-9, shard-10]
    env:
      SHARD: ${{ matrix.shard }}
      TAPSTATE_ATLAS_TEST_URI: ${{ secrets.TAPSTATE_ATLAS_TEST_URI }}
      TAPSTATE_ATLAS_STANDARD_URI: ${{ secrets.TAPSTATE_ATLAS_STANDARD_URI }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: connector-shard-plan
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v4
        with:
          name: connector-jars
          path: ${{ runner.temp }}/connectors
      - name: Seed isolated Maven dependencies
        run: .github/scripts/ci-maven-cache.sh seed "$HOME/.m2/repository" "$RUNNER_TEMP/m2"
      - name: Prepare pinned public inputs for Cloud connector witnesses
        run: |
          python3 deploy/cloud/prepare-test-inputs.py --output "$RUNNER_TEMP/cloud-test-release"
          echo "TAPSTATE_TEST_CLOUD_RELEASE_DIR=$RUNNER_TEMP/cloud-test-release" >> "$GITHUB_ENV"
      - name: Install the reactor without executing tests
        run: mvn -B -Dmaven.repo.local="$RUNNER_TEMP/m2" -DskipTests install
      - name: Run this exact connector witness shard
        # Docker 29 requires a newer API than the pinned testcontainers default.
        env:
          MAVEN_ARGS: -Dapi.version=1.44 -Dtapstate.e2e.connectors-dir=${{ runner.temp }}/connectors
        run: .github/scripts/connector-witnesses.sh run --input-mode "$CONNECTOR_INPUT_MODE" --inputs "$RUNNER_TEMP/connectors/connector-inputs.json" --plan "$RUNNER_TEMP/connector-shards.json" --shard "$SHARD" --repo-local "$RUNNER_TEMP/m2"
      - name: Admit reports and the sweep's witness ledger
        run: .github/scripts/connector-witnesses.sh pack --input-mode "$CONNECTOR_INPUT_MODE" --inputs "$RUNNER_TEMP/connectors/connector-inputs.json" --plan "$RUNNER_TEMP/connector-shards.json" --shard "$SHARD" --output "$RUNNER_TEMP/connector-results/$SHARD"
      - name: Retain only third-party Maven dependencies
        if: always()
        run: .github/scripts/ci-maven-cache.sh collect "$HOME/.m2/repository" "$RUNNER_TEMP/m2"
      - uses: actions/upload-artifact@v4
        with:
          name: connector-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/connector-results
          if-no-files-found: error
          retention-days: 7
      - name: The scene where an end-to-end case failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: connector-failure-${{ matrix.shard }}
          path: |
            e2e/target/failure-scenes/
            e2e/target/failsafe-reports/
            e2e/target/witness-ledger.txt
            e2e/target/witness-ledgers/
          if-no-files-found: ignore
          retention-days: 7

  # Each input policy has its own non-matrix verdict, including on missing shards.
  real-connectors:
    name: ${{ inputs.connector-inputs == 'release' && 'real-connectors-release' || 'real-connectors' }}
    needs: [connector-plan, connector-witnesses]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: connector-input-identity
          path: ${{ runner.temp }}/connector-input-identity
      - uses: actions/download-artifact@v4
        with:
          name: connector-shard-plan
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v4
        with:
          pattern: connector-results-*
          merge-multiple: true
          path: ${{ runner.temp }}/connector-results
      - name: Globally admit every witness and its exact ledger
        run: .github/scripts/connector-witnesses.sh verify --input-mode "$CONNECTOR_INPUT_MODE" --inputs "$RUNNER_TEMP/connector-input-identity/connector-inputs.json" --plan "$RUNNER_TEMP/connector-shards.json" --artifacts "$RUNNER_TEMP/connector-results" --restore .
      - name: Require successful shard jobs
        env:
          SHARD_RESULT: ${{ needs.connector-witnesses.result }}
        run: test "$SHARD_RESULT" = success
      - name: Witness gate
        run: .github/scripts/witness-gate.sh
      - uses: actions/upload-artifact@v4
        with:
          name: connector-aggregate
          path: |
            e2e/target/failsafe-reports/
            e2e/target/witness-ledger.txt
            e2e/target/witness-ledgers/
          if-no-files-found: error
          retention-days: 7
