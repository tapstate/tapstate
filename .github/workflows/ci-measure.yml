name: CI measurement

on:
  push:
    branches: [ws/ci-turnaround]
    paths: [.github/workflows/ci-measure.yml]

permissions:
  contents: read

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        mode: [install, parallel-verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Seed an isolated dependency repository
        run: |
          mkdir -p "$RUNNER_TEMP/m2"
          if [ -d "$HOME/.m2/repository" ]; then
            rsync -a --exclude='/io/tapstate/' "$HOME/.m2/repository/" "$RUNNER_TEMP/m2/"
          fi
      - name: Install without executing tests
        if: matrix.mode == 'install'
        run: mvn -B -Dmaven.repo.local="$RUNNER_TEMP/m2" -DskipTests install
      - name: Parallel reactor control
        if: matrix.mode == 'parallel-verify'
        run: mvn -B -T 1C -Dmaven.repo.local="$RUNNER_TEMP/m2" verify
      - name: Preserve control reports
        if: always() && matrix.mode == 'parallel-verify'
        uses: actions/upload-artifact@v4
        with:
          name: parallel-control-reports
          path: |
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          if-no-files-found: error
          retention-days: 7
