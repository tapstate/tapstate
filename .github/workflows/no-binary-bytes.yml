# No-binary-bytes gate.
# Every tracked file in this repository is text. The build fails if any of them
# contains a NUL byte (0x00).
#
# A NUL is not merely unsightly: it is the byte that decides, for git and for
# most text tooling, that a file is binary rather than text. One of them
# anywhere in a file has repository-wide consequences:
#   - grep invoked with -I / --binary-files=without-match — the default in
#     several wrappers — skips the whole file and exits 0. The skip is silent,
#     so "no matches in that file" and "the string is not there" become the same
#     answer, and neither the exit code nor the empty output tells them apart.
#   - file(1) reports the file as "data", and diffs of it degrade to
#     "Binary files differ".
# A search that cannot fail is worse than one that reports an error, which is
# why this is a gate rather than a lint.
#
# Note this gate deliberately reads every file as text (git grep -a). Without
# that flag the scan would itself be subject to the binary-skip it exists to
# catch — a gate that passes precisely when the repository is dirty.
#
# There is no commit-message scan here, unlike the sibling text gates: git
# rejects a NUL in a commit message itself, so there is no path to check.
#
# Escape hatch: list explicit path patterns in .binary-allowlist at the repo
# root (git pathspec syntax, one per line). It ships empty on purpose — today
# no tracked file is binary — and adding a path is a reviewed decision.
#
# Like no-cjk and no-agent-footprint, this is meant to be a required status
# check on main (branch protection); a workflow that merely runs is not a gate
# until merges depend on it.
name: no-binary-bytes

on:
  push:
    branches:
      - main
      - "ws/**"
  pull_request:
    branches:
      - main

jobs:
  no-binary-bytes:
    runs-on: ubuntu-latest
    # Byte semantics, not text semantics: this check is about one specific byte,
    # so the pattern must not be reinterpreted as code points in some locale.
    env:
      LC_ALL: C
    steps:
      - uses: actions/checkout@v4

      - name: The gate still decides the way it is supposed to
        run: |
          shellcheck .github/scripts/no-binary-bytes.sh .github/scripts/no-binary-bytes-smoke.sh
          bash .github/scripts/no-binary-bytes-smoke.sh

      - name: No NUL bytes in tracked files
        run: bash .github/scripts/no-binary-bytes.sh
