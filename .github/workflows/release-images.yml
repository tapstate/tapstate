name: Build and smoke release images

on:
  workflow_call:
    inputs:
      source-sha:
        required: true
        type: string
      web-sha:
        required: true
        type: string
      release-version:
        required: true
        type: string
    secrets:
      RELEASE_SATELLITE_TOKEN:
        required: true
      CLOUD_ARTIFACT_KEY:
        required: true
    outputs:
      server_web_revision:
        value: ${{ jobs.server-image.outputs.web_revision }}
      server_boot_jar_sha256:
        value: ${{ jobs.server-image.outputs.boot_jar_sha256 }}
      cloud_digest:
        value: ${{ jobs.cloud-image.outputs.digest }}
      cloud_sealed_context:
        value: ${{ jobs.cloud-image.outputs.sealed_context }}

permissions:
  contents: read

jobs:
  server-image:
    # A sibling of the CLI matrix again, which it could not be while it pushed: the push is the one act
    # here that cannot be taken back, and it has moved to after the approval. What is left is a build,
    # and a build that fails costs nothing. The Spring Boot jar is platform-independent, so both
    # architectures share the one jar and differ only in the JRE base image and its apt layer, which is
    # what makes building arm64 under emulation cheap.
    runs-on: ubuntu-latest
    outputs:
      web_revision: ${{ steps.web-provenance.outputs.revision }}
      web_files_sha256: ${{ steps.web-provenance.outputs.files-sha256 }}
      boot_jar_sha256: ${{ steps.web-provenance.outputs.boot-jar-sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: write the release version into every file that pins one
        run: .github/scripts/set-version.sh "${{ inputs.release-version }}"
      # Both image profiles use the same immutable Web commit resolved by the caller.
      - uses: actions/checkout@v4
        with:
          repository: tapstate/tapstate-web
          ref: ${{ inputs.web-sha }}
          token: ${{ secrets.RELEASE_SATELLITE_TOKEN }}
          path: tapstate-web
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: enable the pinned package manager
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: tapstate-web/pnpm-lock.yaml
      - name: build the pinned Web production bundle
        working-directory: tapstate-web
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm --filter web i18n:check
          pnpm --filter web test
          bash ../scripts/build-web-assets.sh --web-root . \
            --web-revision '${{ inputs.web-sha }}' --web-profile onprem
      - name: stage the pinned Web bundle for the Boot JAR
        run: |
          web_revision="$(git -C tapstate-web rev-parse HEAD)"
          bash scripts/prepare-web-assets.sh \
            --web-root tapstate-web \
            --web-revision "$web_revision" \
            --web-profile onprem \
            --tapstate-revision "${{ inputs.source-sha }}" \
            --release-version "${{ inputs.release-version }}" \
            --output app/target/generated-resources/tapstate-web
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21.0.13+9.0.LTS"
          cache: maven
      - name: Verify exact Java build
        shell: bash
        run: |
          java -XshowSettings:properties -version 2>&1 | grep -Fx '    java.runtime.version = 21.0.13+9-LTS'
      - name: build the boot jar the image ships
        run: mvn -B -pl app -am -DskipTests package
      - name: read the staged Web provenance
        id: web-provenance
        shell: bash
        run: |
          properties=app/target/classes/META-INF/tapstate-web.properties
          revision="$(sed -n 's/^revision=//p' "$properties")"
          files_sha256="$(sed -n 's/^files.sha256=//p' "$properties")"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          [[ "$files_sha256" =~ ^[0-9a-f]{64}$ ]]
          test "$revision" = '${{ inputs.web-sha }}'
          grep -Fxq 'web.profile=onprem' "$properties"
          mapfile -t boot_jars < <(find app/target -maxdepth 1 -type f -name 'app-*-boot.jar')
          test "${#boot_jars[@]}" -eq 1
          boot_sha256="$(sha256sum "${boot_jars[0]}" | awk '{print $1}')"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "files-sha256=$files_sha256" >> "$GITHUB_OUTPUT"
          echo "boot-jar-sha256=$boot_sha256" >> "$GITHUB_OUTPUT"
      # The ordinary image consumes this on-prem Web-bearing Boot JAR. Cloud builds a separate
      # Boot JAR because Vite deployment profiles are compile-time inputs.
      - uses: actions/upload-artifact@v4
        with:
          name: server-boot-jar
          path: app/target/app-*-boot.jar
          if-no-files-found: error
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # Into a local archive, not a registry. The completeness check reads both architectures out of
      # this archive; a registry manifest would only exist after a push, and a push before the approval
      # is exactly what this rearrangement removes.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ghcr.io/${{ github.repository }}:${{ inputs.release-version }}
          build-args: |
            TAPSTATE_RELEASE_VERSION=${{ inputs.release-version }}
            TAPSTATE_REVISION=${{ inputs.source-sha }}
            TAPSTATE_WEB_REVISION=${{ steps.web-provenance.outputs.revision }}
            TAPSTATE_WEB_FILES_SHA256=${{ steps.web-provenance.outputs.files-sha256 }}
            TAPSTATE_WEB_PROFILE=onprem
          outputs: type=oci,dest=${{ runner.temp }}/server-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: server-image
          path: ${{ runner.temp }}/server-image.tar
          if-no-files-found: error

  cloud-server-jar:
    # Cloud and on-prem share the same server revision but not the same Web bundle. The Cloud Web
    # profile consumes the Cluster cookie session and compiles its Console return URL into static
    # assets, so reusing the ordinary Boot JAR would silently ship on-prem login behavior.
    runs-on: ubuntu-latest
    environment: cloud-ghcr-release
    outputs:
      web_revision: ${{ steps.web-provenance.outputs.revision }}
      web_files_sha256: ${{ steps.web-provenance.outputs.files-sha256 }}
      cloud_console_url: ${{ steps.web-provenance.outputs.cloud-console-url }}
      boot_jar_sha256: ${{ steps.web-provenance.outputs.boot-jar-sha256 }}
      sealed_context: ${{ steps.seal.outputs.context }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: write the release version into every file that pins one
        run: .github/scripts/set-version.sh "${{ inputs.release-version }}"
      - uses: actions/checkout@v4
        with:
          repository: tapstate/tapstate-web
          ref: ${{ inputs.web-sha }}
          token: ${{ secrets.RELEASE_SATELLITE_TOKEN }}
          path: tapstate-web
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: enable the pinned package manager
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: tapstate-web/pnpm-lock.yaml
      - name: build the pinned Cloud Web production bundle
        working-directory: tapstate-web
        env:
          VITE_CLOUD_CONSOLE_URL: ${{ vars.VITE_CLOUD_CONSOLE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          bash ../scripts/build-web-assets.sh --web-root . \
            --web-revision '${{ inputs.web-sha }}' --web-profile cloud \
            --cloud-console-url "$VITE_CLOUD_CONSOLE_URL"
      - name: stage the pinned Cloud Web bundle for the Boot JAR
        env:
          VITE_CLOUD_CONSOLE_URL: ${{ vars.VITE_CLOUD_CONSOLE_URL }}
        shell: bash
        run: |
          web_revision="$(git -C tapstate-web rev-parse HEAD)"
          bash scripts/prepare-web-assets.sh \
            --web-root tapstate-web \
            --web-revision "$web_revision" \
            --web-profile cloud --cloud-console-url "$VITE_CLOUD_CONSOLE_URL" \
            --tapstate-revision "${{ inputs.source-sha }}" \
            --release-version "${{ inputs.release-version }}" \
            --output app/target/generated-resources/tapstate-web
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21.0.13+9.0.LTS"
          cache: maven
      - name: Verify exact Java build
        shell: bash
        run: |
          java -XshowSettings:properties -version 2>&1 | grep -Fx '    java.runtime.version = 21.0.13+9-LTS'
      - name: build the Cloud Web-bearing Boot JAR
        run: mvn -B -pl app -am -DskipTests package
      - name: read the staged Cloud Web provenance
        id: web-provenance
        shell: bash
        run: |
          properties=app/target/classes/META-INF/tapstate-web.properties
          revision="$(sed -n 's/^revision=//p' "$properties")"
          files_sha256="$(sed -n 's/^files.sha256=//p' "$properties")"
          console_url="$(sed -n 's/^cloud.console.url=//p' "$properties")"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          [[ "$files_sha256" =~ ^[0-9a-f]{64}$ ]]
          test "$revision" = '${{ inputs.web-sha }}'
          grep -Fxq 'web.profile=cloud' "$properties"
          test -n "$console_url"
          mapfile -t boot_jars < <(find app/target -maxdepth 1 -type f -name 'app-*-boot.jar')
          test "${#boot_jars[@]}" -eq 1
          boot_sha256="$(sha256sum "${boot_jars[0]}" | awk '{print $1}')"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "files-sha256=$files_sha256" >> "$GITHUB_OUTPUT"
          echo "cloud-console-url=$console_url" >> "$GITHUB_OUTPUT"
          echo "boot-jar-sha256=$boot_sha256" >> "$GITHUB_OUTPUT"
      - name: seal the Cloud Boot JAR before public artifact storage
        id: seal
        env:
          CLOUD_ARTIFACT_KEY: ${{ secrets.CLOUD_ARTIFACT_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find app/target -maxdepth 1 -type f -name 'app-*-boot.jar')
          test "${#jars[@]}" -eq 1
          context="$GITHUB_REPOSITORY:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:boot-jar"
          node scripts/seal-cloud-artifact.mjs seal --input "${jars[0]}" \
            --output "$RUNNER_TEMP/cloud-server-boot-jar.enc" --context "$context"
          echo "context=$context" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-server-boot-jar-sealed
          path: ${{ runner.temp }}/cloud-server-boot-jar.enc
          if-no-files-found: error

  cloud-image:
    # The image is built and verified before approval, without pushing it. Its locked connector
    # bytes and companion license texts must match the versioned lock in this release commit.
    needs: [cloud-server-jar, server-image]
    runs-on: ubuntu-latest
    environment: cloud-ghcr-release
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.verify.outputs.digest }}
      sealed_context: ${{ steps.seal.outputs.context }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: cloud-server-boot-jar-sealed
          path: ${{ runner.temp }}/cloud-boot-jar
      - uses: actions/download-artifact@v4
        with:
          name: server-image
          path: ${{ runner.temp }}/onprem-image
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: open the authenticated Cloud Boot JAR
        env:
          CLOUD_ARTIFACT_KEY: ${{ secrets.CLOUD_ARTIFACT_KEY }}
          ARTIFACT_CONTEXT: ${{ needs.cloud-server-jar.outputs.sealed_context }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/target
          node scripts/seal-cloud-artifact.mjs open \
            --input "$RUNNER_TEMP/cloud-boot-jar/cloud-server-boot-jar.enc" \
            --output "app/target/app-${{ inputs.release-version }}-boot.jar" \
            --context "$ARTIFACT_CONTEXT"
      - name: stage the exact published connector and license bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cloud-jars"
          assets="$(jq -r '.connectors[].id + "-connector.jar", .licenseFiles[].name' deploy/cloud/connectors.lock.json)"
          patterns=()
          while IFS= read -r asset; do
            patterns+=(--pattern "$asset")
          done <<< "$assets"
          gh release download connectors-preview --repo tapstate/tapstate \
            "${patterns[@]}" --dir "$RUNNER_TEMP/cloud-jars"
          PYTHONDONTWRITEBYTECODE=1 python3 deploy/cloud/stage-connectors.py \
            --lock deploy/cloud/connectors.lock.json \
            --jar-dir "$RUNNER_TEMP/cloud-jars" \
            --stage-dir "$RUNNER_TEMP/cloud-stage"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: build the Cloud OCI archive from the verified server Boot JAR
        env:
          CLOUD_CONSOLE_URL: ${{ needs.cloud-server-jar.outputs.cloud_console_url }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --progress=plain --target cloud \
            --file deploy/docker/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --build-context "cloud_connectors=$RUNNER_TEMP/cloud-stage" \
            --build-arg "TAPSTATE_RELEASE_VERSION=${{ inputs.release-version }}" \
            --build-arg "TAPSTATE_REVISION=${{ inputs.source-sha }}" \
            --build-arg "TAPSTATE_WEB_REVISION=${{ needs.cloud-server-jar.outputs.web_revision }}" \
            --build-arg "TAPSTATE_WEB_FILES_SHA256=${{ needs.cloud-server-jar.outputs.web_files_sha256 }}" \
            --build-arg "TAPSTATE_WEB_PROFILE=cloud" \
            --build-arg "TAPSTATE_WEB_CLOUD_CONSOLE_URL=$CLOUD_CONSOLE_URL" \
            --output "type=oci,dest=$RUNNER_TEMP/cloud-image.tar" .
      - name: verify both platforms, Web provenance, and locked inputs
        id: verify
        env:
          CLOUD_CONSOLE_URL: ${{ needs.cloud-server-jar.outputs.cloud_console_url }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t boot_jars < <(find app/target -maxdepth 1 -type f -name 'app-*-boot.jar' -print)
          if [ "${#boot_jars[@]}" -ne 1 ]; then
            echo "expected exactly one downloaded server Boot JAR" >&2
            exit 1
          fi
          mkdir "$RUNNER_TEMP/cloud-layout"
          tar -xf "$RUNNER_TEMP/cloud-image.tar" -C "$RUNNER_TEMP/cloud-layout"
          PYTHONDONTWRITEBYTECODE=1 python3 deploy/cloud/verify-image.py \
            --oci-layout "$RUNNER_TEMP/cloud-layout" \
            --lock deploy/cloud/connectors.lock.json \
            --boot-jar "${boot_jars[0]}" \
            --web-profile cloud --cloud-console-url "$CLOUD_CONSOLE_URL"
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/web-provenance.py create \
            --oci-layout "$RUNNER_TEMP/cloud-layout" \
            --output "$RUNNER_TEMP/cloud-web-provenance-check.json" \
            --version '${{ inputs.release-version }}' \
            --tapstate-revision '${{ inputs.source-sha }}' \
            --web-revision '${{ needs.cloud-server-jar.outputs.web_revision }}' \
            --web-profile cloud --cloud-console-url "$CLOUD_CONSOLE_URL" \
            --boot-jar-sha256 '${{ needs.cloud-server-jar.outputs.boot_jar_sha256 }}'
          digest="$(jq -er '.manifests | if length == 1 then .[0].digest else error("root count") end' \
            "$RUNNER_TEMP/cloud-layout/index.json")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: verify the paired on-prem OCI provenance without rebuilding it
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/onprem-layout"
          tar -xf "$RUNNER_TEMP/onprem-image/server-image.tar" -C "$RUNNER_TEMP/onprem-layout"
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/web-provenance.py create \
            --oci-layout "$RUNNER_TEMP/onprem-layout" \
            --output "$RUNNER_TEMP/onprem-web-provenance-check.json" \
            --version '${{ inputs.release-version }}' \
            --tapstate-revision '${{ inputs.source-sha }}' \
            --web-revision '${{ inputs.web-sha }}' --web-profile onprem \
            --boot-jar-sha256 '${{ needs.server-image.outputs.boot_jar_sha256 }}'
      - name: install the local OCI archive importer
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
      - name: run both checked images with their real Boot entrypoints
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          cloud_archive="$RUNNER_TEMP/cloud-image.tar"
          onprem_archive="$RUNNER_TEMP/onprem-image/server-image.tar"
          sha256sum "$cloud_archive" "$onprem_archive" > "$RUNNER_TEMP/runtime-image-archives.sha256"
          runtime_arch="$(docker info --format '{{.Architecture}}')"
          case "$runtime_arch" in
            amd64|x86_64) runtime_arch=amd64 ;;
            arm64|aarch64) runtime_arch=arm64 ;;
            *) echo "unsupported Docker daemon architecture: $runtime_arch" >&2; exit 1 ;;
          esac
          cloud_tag="tapstate-runtime-smoke:$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-cloud"
          onprem_tag="tapstate-runtime-smoke:$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-onprem"
          cleanup() {
            docker image rm "$cloud_tag" "$onprem_tag" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          images=()
          for profile in cloud onprem; do
            if [ "$profile" = cloud ]; then
              archive="$cloud_archive"
              layout="$RUNNER_TEMP/cloud-layout"
              tag="$cloud_tag"
            else
              archive="$onprem_archive"
              layout="$RUNNER_TEMP/onprem-layout"
              tag="$onprem_tag"
            fi
            metadata="$(PYTHONDONTWRITEBYTECODE=1 python3 - "$layout" "$runtime_arch" <<'PY'
          import hashlib
          import json
          import re
          import sys
          from pathlib import Path

          layout, arch = Path(sys.argv[1]), sys.argv[2]

          def blob(digest):
              if not isinstance(digest, str) or not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
                  raise SystemExit("invalid runtime OCI descriptor digest")
              path = layout / "blobs" / "sha256" / digest.removeprefix("sha256:")
              if path.stat().st_size > 4 * 1024 * 1024:
                  raise SystemExit("runtime OCI metadata exceeds its size bound")
              payload = path.read_bytes()
              if "sha256:" + hashlib.sha256(payload).hexdigest() != digest:
                  raise SystemExit("runtime OCI metadata digest mismatch")
              return json.loads(payload)

          roots = json.loads((layout / "index.json").read_bytes())["manifests"]
          if len(roots) != 1:
              raise SystemExit("runtime OCI archive must have one top-level descriptor")
          descriptors = blob(roots[0]["digest"])["manifests"]
          selected = [item for item in descriptors
                      if item.get("platform", {}).get("os") == "linux"
                      and item.get("platform", {}).get("architecture") == arch]
          if len(selected) != 1:
              raise SystemExit("runtime OCI archive must have exactly one native Linux platform")
          manifest = blob(selected[0]["digest"])
          config_digest = manifest["config"]["digest"]
          config = blob(config_digest)
          if config.get("os") != "linux" or config.get("architecture") != arch:
              raise SystemExit("runtime OCI config disagrees with the selected platform")
          rootfs = config.get("rootfs", {})
          diff_ids = rootfs.get("diff_ids")
          if rootfs.get("type") != "layers" or not isinstance(diff_ids, list) or not diff_ids:
              raise SystemExit("runtime OCI config has no layer diff IDs")
          if any(not isinstance(item, str) or not re.fullmatch(r"sha256:[0-9a-f]{64}", item)
                 for item in diff_ids):
              raise SystemExit("runtime OCI config has malformed layer diff IDs")
          print(json.dumps({"configDigest": config_digest, "diffIds": diff_ids}))
          PY
            )"
            skopeo --command-timeout 5m --override-os linux --override-arch "$runtime_arch" copy \
              "oci-archive:$archive" "docker-archive:$RUNNER_TEMP/$profile-runtime-docker.tar:$tag"
            docker load --input "$RUNNER_TEMP/$profile-runtime-docker.tar" >/dev/null
            image_id="$(docker image inspect --format '{{.Id}}' "$tag")"
            expected_config_digest="$(jq -er '.configDigest' <<< "$metadata")"
            # Docker's immutable ID may describe a manifest rather than its config. Export the
            # exact loaded image and compare the raw config bytes, not normalized inspect JSON.
            docker image save --output "$RUNNER_TEMP/$profile-runtime-loaded.tar" "$image_id"
            loaded_config_digest="$(PYTHONDONTWRITEBYTECODE=1 python3 - "$RUNNER_TEMP/$profile-runtime-loaded.tar" <<'PY'
          import hashlib
          import json
          from pathlib import PurePosixPath
          import sys
          import tarfile

          def unique_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise SystemExit("saved Docker manifest contains a duplicate JSON field")
                  value[key] = item
              return value

          with tarfile.open(sys.argv[1], mode="r:*") as saved:
              members = saved.getmembers()

              def regular_bytes(name):
                  if not isinstance(name, str) or not name or "\\" in name or "\x00" in name:
                      raise SystemExit("saved Docker config path is not safe")
                  path = PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts or path.as_posix() != name or name == ".":
                      raise SystemExit("saved Docker config path is not safe")
                  matching = [member for member in members if member.name == name]
                  if len(matching) != 1 or not matching[0].isfile():
                      raise SystemExit("saved Docker manifest/config must be one regular file")
                  member = matching[0]
                  if member.size < 0 or member.size > 4 * 1024 * 1024:
                      raise SystemExit("saved Docker manifest/config exceeds its size bound")
                  stream = saved.extractfile(member)
                  if stream is None:
                      raise SystemExit("saved Docker manifest/config is unreadable")
                  payload = stream.read(4 * 1024 * 1024 + 1)
                  if len(payload) != member.size:
                      raise SystemExit("saved Docker manifest/config has inconsistent length")
                  return payload

              manifest = json.loads(regular_bytes("manifest.json"), object_pairs_hook=unique_object)
              if not isinstance(manifest, list) or len(manifest) != 1 or not isinstance(manifest[0], dict):
                  raise SystemExit("saved Docker archive must contain exactly one image")
              config = regular_bytes(manifest[0].get("Config"))
              print("sha256:" + hashlib.sha256(config).hexdigest())
          PY
            )"
            test "$loaded_config_digest" = "$expected_config_digest"
            actual_diff_ids="$(docker image inspect --format '{{json .RootFS.Layers}}' "$image_id")"
            test "$(jq -c '.diffIds' <<< "$metadata")" = "$(jq -c . <<< "$actual_diff_ids")"
            images+=("$image_id")
          done
          sha256sum --check "$RUNNER_TEMP/runtime-image-archives.sha256"
          bash deploy/cloud/cloud-image-smoke.sh "${images[0]}" "${images[1]}"
          sha256sum --check "$RUNNER_TEMP/runtime-image-archives.sha256"
      - name: seal the checked Cloud OCI archive before public artifact storage
        id: seal
        env:
          CLOUD_ARTIFACT_KEY: ${{ secrets.CLOUD_ARTIFACT_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          context="$GITHUB_REPOSITORY:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:cloud-image"
          node scripts/seal-cloud-artifact.mjs seal --input "$RUNNER_TEMP/cloud-image.tar" \
            --output "$RUNNER_TEMP/cloud-image.enc" --context "$context"
          echo "context=$context" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-image-sealed
          path: ${{ runner.temp }}/cloud-image.enc
          if-no-files-found: error
