# Quickstart live lane: the user's journey, executed.
#
# Everything else that guards the quickstart guards half of it. quickstart-smoke.sh runs the script with
# TAPSTATE_QUICKSTART_PREPARE_ONLY=1, which returns before Docker, so the fetches, the generated workspace
# and the refusals are covered while `docker compose up`, the online verbs and the snapshot check are not.
# That uncovered half is the half that only exists after a release, and it is where this lane's defects
# have kept turning up: an image reference no checkout could build, a runner label that had gone away, a
# script that reported success having delivered nothing. So this job runs the whole thing, on a machine
# that has never seen any of it.
#
# What makes the run honest:
#   * A fresh runner is the clean machine. The job asserts that up front rather than assuming it, so a
#     warmer runner cannot quietly turn "pulled from GHCR" into "already had it".
#   * Nothing is built. The server arrives as a published multi-arch image, the CLI as a release tarball,
#     the connector jars as release assets -- no mvn, no GraalVM. The image is checked to carry a repo
#     digest, which a locally built image does not have.
#   * The pipeline is proved by reading the target, not by trusting the script's own summary.
#   * Change-data-capture is exercised the way the script's closing instructions tell a user to, with all
#     three operations, because a pipeline that only ever inserts is not the claim being made.
#
# Each leg is one world, and mixing them is what this lane kept doing. A user never runs a script from
# one point in history against another point's assets: they pipe what install.tapstate.dev serves, which
# is a release tag's script, and that script pins the release whose compose file, seed SQL, CLI and jars
# it then fetches. So the published leg takes all of it from the newest published release, and the
# from-source leg takes all of it from this checkout. The checkout's script is therefore still exercised
# before it merges -- on the leg that also brings the server it was written for.
#
# The alternative, running the checkout's script against the released assets, is not a stricter test but
# an incoherent one: it went red on a seed file the pinned tag does not contain, and no release could
# have made it green, because the script it was running had not shipped.
#
# Nightly rather than per-PR: it depends on published release assets, so a red here can mean the release
# is stale rather than the pull request is wrong, and blocking unrelated work on that would be a lie
# about what failed.
name: Quickstart live

on:
  workflow_dispatch:
  schedule:
    # Off the hour, and clear of the real-connector lane, so the two do not queue against each other.
    - cron: "40 20 * * *"

concurrency:
  group: quickstart-live-${{ github.ref }}
  cancel-in-progress: true

# This lane pipes the published installer, so it completes real installs on every run. Their events
# would land in the funnel's one denominator as installs no person performed. Pointed at a port
# nothing listens on, the send is refused instantly and the installer swallows it -- the same path a
# user with no network takes.
env:
  TAPSTATE_TELEMETRY_URL: http://127.0.0.1:1/e

jobs:
  quickstart-live:
    # Two legs over one set of steps. They differ in exactly one variable -- where the server comes from --
    # and that variable is the whole point:
    #
    #   published   the user's real journey: the published image, pulled. Answers "does what we shipped
    #               still work?" It cannot answer the other question, because the shipped server is frozen.
    #   from-source the same journey with the server built from this checkout. Answers "does the code we
    #               have now still work with the script we have now?"
    #
    # Only running the first leaves a hole with a known shape: a server that gains a validation the script
    # does not satisfy keeps this lane green, because the published server predates the validation. That
    # is not hypothetical -- an apply-order incompatibility sat undetected behind exactly this gap until
    # somebody ran the demo by hand against a locally built image. Only running the second is the mirror
    # hole: regressions in the released artifacts would go unwatched. Both, or neither is worth much.
    #
    # The third entry is an entry, not a second axis. Crossing server against architecture would build
    # from source on arm too -- a long build answering a question the x64 leg already answers. What arm
    # is here for is the one thing nothing else covers: the arm64 half of the published multi-arch
    # image. It has been built and pushed every release and never once started, on any lane.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { server: published,   arch: amd64, runner: ubuntu-latest }
          - { server: from-source, arch: amd64, runner: ubuntu-latest }
          - { server: published,   arch: arm64, runner: ubuntu-24.04-arm }
    name: quickstart-live (${{ matrix.server }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolve what this leg runs
        # One point in history per leg, script and assets together (see the header).
        #
        #   published   the newest published release. Resolved from the release list rather than from
        #               this checkout's pin: the pin moves ahead of the release the moment a version is
        #               bumped, and this leg's question is about what shipped, not about what is next.
        #   from-source this checkout, image included.
        #
        # Both the image reference and the store's database are read off the artifacts this leg will
        # actually run, never restated here -- the two legs genuinely differ on both, and a literal
        # would be right for one of them and silently wrong for the other.
        id: leg
        env:
          GH_TOKEN: ${{ github.token }}
          LEG: ${{ matrix.server }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          # Not in $RUNNER_TEMP itself, which is where the script is run from: a quickstart.sh sitting
          # beside it means "a saved copy, work here", and the script would then never make the
          # tapstate-demo directory this lane asserts it makes.
          mkdir -p "$RUNNER_TEMP/script"
          script="$RUNNER_TEMP/script/quickstart.sh"
          if [ "$LEG" = published ]; then
            tag="$(.github/scripts/latest-release-tag.sh)"
            raw="https://raw.githubusercontent.com/$REPO/$tag"
            # The script comes from the install site, which is where a user gets it, and the assets from
            # the tag, which is where the script fetches them. That split is not an inconsistency to
            # tidy up -- it is the combination a real one-liner produces, and it is the one thing this
            # leg exists to run.
            #
            # Taken from the tag instead, as it was, both halves come from the same stale tree and agree
            # with each other: the site serves the script with the version written in, the tag's tree
            # still pins the release before it, and a leg that reads both from the tag runs an older
            # release consistently and passes. It announced "the published release v0.4.1" and ran
            # 0.3.0, on the same run, two lines apart, while the published one-liner could not log in.
            curl -fsSL https://install.tapstate.dev/ -o "$script"
            curl -fsSL "$raw/deploy/quickstart/docker-compose.yml" -o "$RUNNER_TEMP/script/compose.yml"
            compose="$RUNNER_TEMP/script/compose.yml"
            echo "leg: the published release $tag -- script from the install site, assets from that tag"
          else
            cp "$GITHUB_WORKSPACE/deploy/quickstart/quickstart.sh" "$script"
            compose="$GITHUB_WORKSPACE/deploy/quickstart/docker-compose.yml"
            echo "leg: this checkout -- script, assets and image all from it"
          fi
          # Read off the script under test, not off the compose file. The script pins the compose it
          # fetches to its own version before starting anything, so on the published leg the compose as
          # downloaded still names the previous release and the stack will not run it. Reading the
          # compose here would compare, pull and inspect an image the run never starts -- and on that
          # leg it would agree with itself, which is how a leg passes while the thing it stands for is
          # broken. The store database below is already read off the script for the same reason.
          ver="$(sed -n 's/^CLI_VERSION="\(.*\)"$/\1/p' "$script" | head -1)"
          [ -n "$ver" ] || { echo "no CLI_VERSION found in the script under test" >&2; exit 1; }
          ref="ghcr.io/tapstate/tapstate:$ver"
          grep -q "image: ghcr.io/tapstate/tapstate:" "$compose" \
            || { echo "no server image reference found in $compose" >&2; exit 1; }
          db="$(sed -n 's|.*mongodb://mongo:27017/\([A-Za-z0-9_]*\)?directConnection.*|\1|p' \
            "$script" | head -1)"
          [ -n "$db" ] || { echo "no store database found in the script under test" >&2; exit 1; }
          { echo "ref=$ref"; echo "script=$script"; echo "db=$db"; } >> "$GITHUB_OUTPUT"
          echo "image: $ref   store database: $db"

      - name: The runner is a clean machine
        # Assert it rather than assume it. If any of this is already here, the run would still pass while
        # proving something weaker than "a user starting from nothing". The from-source leg deliberately
        # puts an image there in the next step, so its precondition is only the volumes.
        run: |
          set -eu
          if [ "${{ matrix.server }}" = published ] \
             && docker image inspect "${{ steps.leg.outputs.ref }}" >/dev/null 2>&1; then
            echo "the server image is already present; this run would not prove it can be pulled" >&2
            exit 1
          fi
          if docker volume ls --format '{{.Name}}' | grep -q quickstart; then
            echo "quickstart volumes already exist; this run would start from someone else's state" >&2
            exit 1
          fi
          echo "clean: no quickstart volumes"

      - uses: actions/setup-java@v4
        if: matrix.server == 'from-source'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build the server from this checkout, under the tag the compose file pins
        if: matrix.server == 'from-source'
        # Tagging the local build with the pinned reference is what substitutes it, and it needs no change
        # to the script or the compose file: compose pulls only when an image is missing, so an image that
        # is already there under that name is the one the stack runs. The script stays byte-for-byte the
        # one a user pipes, which is the property that makes this leg worth having.
        run: |
          set -eu
          mvn -q -pl app -am -DskipTests clean package
          docker build -f deploy/docker/Dockerfile -t "${{ steps.leg.outputs.ref }}" .

      - name: Run the quickstart, piped, and let it make its own directory
        # The one command a user runs. Piped rather than saved on purpose: the pipe is the form on the
        # README, and the tapstate-demo directory the script then makes for itself is part of what is
        # being proved. Nothing else is done first: any manual step here would be a step the user has
        # to take too, and the whole claim is that there are none.
        env:
          SCRIPT: ${{ steps.leg.outputs.script }}
          PREPARED: ${{ steps.leg.outputs.ref }}
          STORE_DB: ${{ steps.leg.outputs.db }}
          LEG: ${{ matrix.server }}
        run: |
          # pipefail is not in the default shell's flags, and without it `tee` decides the step's fate --
          # which is the very failure this lane exists to catch, reintroduced one level up.
          set -euo pipefail
          # Where the script fetches the rest of the stack from is the other half of "one leg, one
          # world": the released script pins its own release and needs nothing said to it, and the
          # checkout's is pointed at the checkout so the whole stack is the code under test.
          if [ "$LEG" = from-source ]; then
            export TAPSTATE_QUICKSTART_BASE_URL="file://$GITHUB_WORKSPACE"
          fi
          cd "$RUNNER_TEMP"
          cat "$SCRIPT" | sh 2>&1 | tee run.log
          # The image the stack actually started, held to the one this job prepared. Without this the
          # leg can silently run a different server than the one it built or pulled -- which is the
          # failure the line above exists to remove, and it would look identical in the log.
          started="$(sed -n 's|.*image: \(ghcr.io/tapstate/tapstate:[^ ]*\).*|\1|p' \
            tapstate-demo/docker-compose.yml | head -1)"
          [ "$started" = "$PREPARED" ] || {
            echo "the stack started $started, but this job prepared $PREPARED" >&2
            exit 1
          }
          echo "stack ran: $started"
          # The summary is read only on the leg whose summary this checkout wrote. Match on the numbers
          # rather than on whichever nouns it happens to use -- the counts are what this is about, and
          # they are what a half-arrived demo cannot produce. Both are required: a run that carried
          # MySQL and dropped PostgreSQL is the failure the second engine exists to make visible.
          if [ "$LEG" = from-source ]; then
            grep -qE '[0-9]+ orders from MySQL' run.log && grep -qE '[0-9]+ of them, in one object per order' run.log
          fi
          # The released leg deliberately reads no summary at all. Three assertions have been written
          # for that one line and all three were wordings: "rows", then "the view now holds N", then
          # this checkout's two-engine sentence -- and the released leg went red on two nightlies for
          # having read a release that had moved on. Every one of those reds was on a run that
          # delivered every row, which is the tell that the assertion was about prose.
          #
          # Nothing is lost by its absence. The script's own exit status is already this step's,
          # through pipefail above, and what the script *claims* is worth less here than what the
          # target actually holds -- which the step two below reads directly, off the release itself.
          test -d tapstate-demo || { echo "the piped run did not make its own directory" >&2; exit 1; }

          # The store this release registers by itself is this release's claim, so it is asserted where
          # the release under test makes it. Asserted on the compose stack rather than an in-process
          # server because "installed and it was already there" is a claim about the thing a user starts.
          if [ "$LEG" = from-source ]; then
            test ! -e "tapstate-demo/work/source/$STORE_DB.tap.yml" \
              || { echo "the demo workspace declares the store; this assertion would prove nothing" >&2; exit 1; }
          fi
          cd tapstate-demo
          admin_pw="$(sed -n 's/^TAPSTATE_ADMIN_PASSWORD=//p' .env)"
          printf 'connect http://127.0.0.1:8080\nlogin admin\n%s\nls\nexit\n' "$admin_pw" \
            | ./tapstate -w work > ls.log 2>&1
          # Listed either way: registered by the deployment on one leg, applied from the workspace on
          # the other. Which route it took is the assertion above; that it is there at all is this one,
          # and a demo whose target is not registered delivers nothing on either leg.
          grep -q "source  $STORE_DB" ls.log \
            || { echo "the store '$STORE_DB' is not registered; ls said:" >&2; cat ls.log >&2; exit 1; }
          echo "the store is registered and listed: $STORE_DB"

      - name: The server came from where this leg says it did
        # A registry pull leaves a repo digest; a local build has none. That single fact separates the two
        # legs after the fact, without watching the run. Asserting it in both directions is what keeps the
        # matrix honest: without the from-source half, a build step that silently no-opped would leave that
        # leg pulling the published image and re-running the published leg under a second name -- green,
        # and proving nothing it was added to prove.
        run: |
          set -eu
          digests="$(docker image inspect "${{ steps.leg.outputs.ref }}" --format '{{join .RepoDigests ","}}')"
          if [ "${{ matrix.server }}" = published ]; then
            [ -n "$digests" ] || { echo "the server image carries no repo digest -- it was not pulled" >&2; exit 1; }
            echo "pulled: $digests"
          else
            [ -z "$digests" ] || { echo "the server image carries a repo digest -- it was pulled, not built here: $digests" >&2; exit 1; }
            echo "built from this checkout: no repo digest"
          fi
          # And it is the architecture this leg was added to exercise. Two ways this lane can quietly
          # stop covering arm64 and stay green either way: a runner label that goes away or is edited
          # back to ubuntu-latest, and a manifest that ships without its arm64 half -- both leave three
          # legs passing while two of them run the same amd64 image.
          arch="$(docker image inspect "${{ steps.leg.outputs.ref }}" --format '{{.Architecture}}')"
          [ "$arch" = "${{ matrix.arch }}" ] || {
            echo "the server image is $arch, but this leg exists to run ${{ matrix.arch }}" >&2
            exit 1
          }
          echo "architecture: $arch"

      - name: The CLI the quickstart installed is the release's own
        # The two halves of a release arrive by different routes -- the server as an image tag in the
        # compose file, the CLI as a version the script pins and the installer serves -- and nothing
        # makes them agree except a line in the script. They have come apart before: the published
        # one-liner installed 0.2.0 for a whole release cycle while every pin in the tree read 0.2.1,
        # and every lane was green throughout, because each half was internally consistent.
        #
        # Held to the image tag rather than to a version named here: the tag is what this leg actually
        # started, so the two are compared against each other instead of both against a literal that
        # would have to be moved every release.
        env:
          PREPARED: ${{ steps.leg.outputs.ref }}
        run: |
          set -eu
          cd "$RUNNER_TEMP/tapstate-demo"
          want="${PREPARED##*:}"
          got="$(./tapstate --version)"
          case "$got" in
            *"$want"*) echo "cli and server agree: $got, against $PREPARED" ;;
            *) echo "the stack runs $PREPARED but the CLI beside it reports '$got'" >&2; exit 1 ;;
          esac

      - name: The connector jars the quickstart fetched are readable jars
        # These are fetched from a release, not built here, and a jar that arrives mangled or with its
        # entries encrypted is still a file of the right name and roughly the right size. The failure it
        # produces is a first read that throws from inside the server, with no filename in it -- from
        # the outside that is a pipeline that will not start, and the fetch is the last place anyone
        # looks. Opening each one here separates "fetched something" from "fetched a jar", where the
        # answer is still cheap.
        run: |
          set -eu
          cd "$RUNNER_TEMP/tapstate-demo"
          python3 -c '
          import sys, zipfile
          for path in sys.argv[1:]:
              z = zipfile.ZipFile(path)
              bad = z.testzip()
              if bad:
                  raise SystemExit(path + ": opens, but entry " + bad + " does not read back")
              if not any(n.endswith(".class") for n in z.namelist()):
                  raise SystemExit(path + ": opens as a zip but carries no classes")
              print(path + ": " + str(len(z.namelist())) + " entries")
          ' ./*.jar

      - name: The target really holds the seeded rows
        # Read the target directly. The script prints a count of its own, and a check that only re-reads
        # the script's summary would pass for a script that printed it unconditionally.
        #
        # Two numbers on the from-source leg, and the second is the one that sees the second engine: an
        # assembly wired to MySQL alone writes all five orders with empty arrays, so the document count
        # is satisfied by a demo that is half working. The published leg is the last release, whose demo
        # put the second engine in a collection of its own, so it is read the way that release built it.
        env:
          STORE_DB: ${{ steps.leg.outputs.db }}
          LEG: ${{ matrix.server }}
        run: |
          set -eu
          cd "$RUNNER_TEMP/tapstate-demo"
          uri="mongodb://mongo:27017/$STORE_DB?directConnection=true"
          read_number() { docker compose exec -T mongo mongosh --quiet "$uri" --eval "$1" | tr -d '[:space:]'; }
          rows="$(read_number 'db.order_state.countDocuments()')"
          [ "$rows" = 5 ] || { echo "target holds $rows orders, expected the 5 seeded ones" >&2; exit 1; }
          if [ "$LEG" = from-source ]; then
            embedded="$(read_number 'db.order_state.aggregate([{$group:{_id:null,n:{$sum:{$size:{$ifNull:["$shipments",[]]}}}}}]).toArray()[0]?.n ?? 0')"
            [ "$embedded" = 6 ] || { echo "the orders carry $embedded shipments, expected the 6 seeded ones -- the second engine did not reach the object" >&2; exit 1; }
            echo "snapshot: $rows orders, carrying $embedded shipments assembled from the second engine"
          else
            echo "snapshot: $rows rows in the target"
          fi

      - name: Change-data-capture carries insert, update and delete
        # The operations the script's closing instructions hand the user, in the same order. Each wait is
        # bounded: an unbounded one would spend the job timeout to say nothing, where a bounded one names
        # which of the three did not arrive.
        #
        # Leg-aware, because the two legs run different demos: the released script syncs each engine into
        # its own collection and maps a field, while this checkout assembles both into one object and maps
        # nothing. Holding the released leg to this checkout's shape would fail it for being the release.
        env:
          STORE_DB: ${{ steps.leg.outputs.db }}
          LEG: ${{ matrix.server }}
        run: |
          set -eu
          cd "$RUNNER_TEMP/tapstate-demo"
          uri="mongodb://mongo:27017/$STORE_DB?directConnection=true"
          # Poll the target until $2 holds, or fail naming the operation $1.
          await() {
            i=0
            while [ "$i" -lt 60 ]; do
              if docker compose exec -T mongo mongosh --quiet "$uri" --eval "quit($2 ? 0 : 1)" >/dev/null 2>&1; then
                echo "cdc: $1 reached the target"
                return 0
              fi
              i=$((i + 1)); sleep 1
            done
            echo "cdc: $1 never reached the target" >&2
            docker compose logs server --tail 100 >&2
            exit 1
          }
          if [ "$LEG" = from-source ]; then
            # A change in each engine, reaching the same document. The array assertions read its length
            # rather than a total: a shipment that arrived but was hung on the wrong order keeps every
            # total right, and only the length on the order it belongs to moves.
            docker compose exec -T postgres psql -U postgres -d appdb -c "INSERT INTO shipments VALUES (7,1,'ups','pending');"
            await 'a shipment added in the second engine' '(db.order_state.findOne({id:1})?.shipments?.length ?? 0) === 3'
            docker compose exec -T mysql mysql -uroot -psecret appdb -e "UPDATE orders SET customer='alicia' WHERE id=1;"
            await 'the order own column changing in the first engine' 'db.order_state.findOne({id:1})?.customer === "alicia"'
            # ...and the array still holds what it held. An implementation that rebuilds the document from
            # the parent alone passes the line above and empties the array, which nothing else here sees.
            await 'the array surviving a parent-only change' '(db.order_state.findOne({id:1})?.shipments?.length ?? 0) === 3'
            docker compose exec -T postgres psql -U postgres -d appdb -c "DELETE FROM shipments WHERE id=7;"
            await 'a shipment deleted in the second engine' '(db.order_state.findOne({id:1})?.shipments?.length ?? 0) === 2'
            # A whole order added in the first engine arrives with no shipments of its own.
            docker compose exec -T mysql mysql -uroot -psecret appdb -e "INSERT INTO orders VALUES (6,'frank',60.00);"
            await 'an order added in the first engine' 'db.order_state.countDocuments({id:6}) === 1'
            docker compose exec -T mysql mysql -uroot -psecret appdb -e "DELETE FROM orders WHERE id=6;"
            await 'that order deleted again' '!db.order_state.countDocuments({id:6})'
          else
            docker compose exec -T mysql mysql -uroot -psecret appdb -e "INSERT INTO orders VALUES (6,'frank',60.00);"
            await insert 'db.order_state.countDocuments({id:6})'
            # A row that merely exists proves the insert landed, not that later changes are still being
            # carried, so the update has to be seen in the document. Which *field* carries it is the
            # release's business and has already moved once -- the fields named here were the mapped
            # `customer_name` and `label` of an older demo, and holding 0.3.0 to them failed it for
            # having a different demo. So look for the value anywhere in the document: "franky" is not
            # a substring of the "frank" that was inserted, so this still separates carried from not.
            docker compose exec -T mysql mysql -uroot -psecret appdb -e "UPDATE orders SET customer='franky' WHERE id=6;"
            await update 'JSON.stringify(db.order_state.findOne({id:6}) ?? {}).includes("franky")'
            docker compose exec -T mysql mysql -uroot -psecret appdb -e "DELETE FROM orders WHERE id=6;"
            await delete '!db.order_state.countDocuments({id:6})'
          fi

      - name: Server log on failure
        if: failure()
        run: |
          cd "$RUNNER_TEMP/tapstate-demo" || exit 0
          docker compose ps -a || true
          docker compose logs server --tail 300 || true

      - name: Teardown leaves nothing but the images
        # The script's own closing instructions, run as printed, and then checked. "Back to a clean
        # machine" is a promise the script makes to the user in writing, so it is one this lane keeps.
        if: always()
        run: |
          set -eu
          cd "$RUNNER_TEMP/tapstate-demo" 2>/dev/null || exit 0
          docker compose down -v
          cd "$RUNNER_TEMP" && rm -rf tapstate-demo
          for what in \
            "containers:$(docker ps -a --format '{{.Names}}' | grep tapstate-demo || true)" \
            "volumes:$(docker volume ls --format '{{.Name}}' | grep quickstart || true)" \
            "networks:$(docker network ls --format '{{.Name}}' | grep tapstate-demo || true)"; do
            case "$what" in
              *:) : ;;
              *) echo "teardown left $what behind" >&2; exit 1 ;;
            esac
          done
          echo "teardown: nothing left but the pulled images"

  quickstart-upgrade:
    # Publishing a release and being able to move onto it are two different claims, and only the lane
    # above makes the first one. This lane makes the second: a machine already running the previous
    # release moves to the newest one and keeps the data it had.
    #
    # That is the half where the two releases actually meet, and nothing else in this repository looks
    # at it. Resources the older server persisted have to be readable by the newer one; the store has to
    # survive an image that did not write it; the pipeline has to run again against a target that is
    # already populated. Both releases are green on their own the whole time -- they only meet on
    # somebody's machine, which is the worst place to find out.
    #
    # The steps are the ones the online quickstart's upgrade section hands a user, in that order, and
    # against the same live install edge. Upgrading some other way here would prove a path nobody has
    # been given, and would keep proving it after the documented one broke.
    name: quickstart-upgrade (previous -> newest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the two releases this leg moves between
        # Both ends come from the release list, never from this checkout: the pin here moves ahead of
        # the release the moment a version is bumped, and this lane's question is about what shipped.
        #
        # The demo's own shape is read out of the release being started, not restated here. It has
        # already moved once -- the target database was `warehouse` and is now `views`, and the demo
        # pipeline was `sync_orders` and is now `order_pipeline` -- so anything named here would be
        # right for one release and quietly wrong for the other, which is the failure this whole lane
        # is about.
        id: leg
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          from="$(.github/scripts/latest-release-tag.sh --previous)"
          to="$(.github/scripts/latest-release-tag.sh)"
          [ "$from" != "$to" ] || {
            echo "resolved the same release at both ends ($from); this would upgrade a version to itself" >&2
            exit 1
          }
          # Both ends are ordered by publication date, which is not the same as version order: a patch
          # shipped onto an older line publishes after the newer line it does not belong to, so the two
          # can come back the wrong way round. Refuse rather than run, because the run would be a
          # downgrade wearing an upgrade's name and every assertion below would still pass. Teaching
          # this lane to pick the ancestor of a given release is the fix when that day comes; until
          # there are two lines it would be untestable machinery.
          [ "$(printf '%s\n%s\n' "${from#v}" "${to#v}" | sort -V | tail -1)" = "${to#v}" ] || {
            echo "the newest published release ($to) is an older version than the one before it ($from)." >&2
            echo "That is two release lines, and this lane would upgrade backwards across them." >&2
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/script"
          script="$RUNNER_TEMP/script/quickstart.sh"
          curl -fsSL "https://raw.githubusercontent.com/$REPO/$from/deploy/quickstart/quickstart.sh" -o "$script"
          db="$(sed -n 's|.*mongodb://mongo:27017/\([A-Za-z0-9_]*\)?directConnection.*|\1|p' "$script" | head -1)"
          [ -n "$db" ] || { echo "no target database found in the $from quickstart" >&2; exit 1; }
          pipeline="$(sed -n 's|.*start \([A-Za-z0-9_]*\)\\nexit.*|\1|p' "$script" | head -1)"
          [ -n "$pipeline" ] || { echo "no demo pipeline found in the $from quickstart" >&2; exit 1; }
          { echo "from=$from"; echo "to=$to"; echo "to_ver=${to#v}"
            echo "script=$script"; echo "db=$db"; echo "pipeline=$pipeline"; } >> "$GITHUB_OUTPUT"
          echo "upgrade: $from -> $to   target database: $db   demo pipeline: $pipeline"

      - name: The runner is a clean machine
        run: |
          set -eu
          if docker volume ls --format '{{.Name}}' | grep -q quickstart; then
            echo "quickstart volumes already exist; this run would start from someone else's state" >&2
            exit 1
          fi
          echo "clean: no quickstart volumes"

      - name: Bring up the previous release, the way a user brought it up when it was current
        env:
          SCRIPT: ${{ steps.leg.outputs.script }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          cat "$SCRIPT" | sh 2>&1 | tee run.log
          test -d tapstate-demo || { echo "the piped run did not make its own directory" >&2; exit 1; }

      - name: Put data in it, and let change-data-capture carry it
        # The state the upgrade has to preserve, and it is deliberately made here rather than taken from
        # the seed: a row that arrived through the running pipeline proves the store holds the pipeline's
        # own progress, not just the fixtures the databases were initialised with.
        #
        # The count is recorded rather than named. What the demo seeds has changed between releases and
        # will again, and a literal here would fail on the release rather than on the upgrade.
        env:
          DB: ${{ steps.leg.outputs.db }}
        run: |
          set -eu
          cd "$RUNNER_TEMP/tapstate-demo"
          uri="mongodb://mongo:27017/$DB?directConnection=true"
          read_number() { docker compose exec -T mongo mongosh --quiet "$uri" --eval "$1" | tr -d '[:space:]'; }
          docker compose exec -T mysql mysql -uroot -psecret appdb -e "INSERT INTO orders VALUES (6,'frank',60.00);"
          i=0
          until [ "$(read_number 'db.order_state.countDocuments({id:6})')" = 1 ]; do
            i=$((i + 1))
            [ "$i" -lt 60 ] || { echo "the row inserted before the upgrade never crossed" >&2; exit 1; }
            sleep 1
          done
          read_number 'db.order_state.countDocuments()' > "$RUNNER_TEMP/before.count"
          echo "before the upgrade: $(cat "$RUNNER_TEMP/before.count") documents, including the one typed in just now"

      - name: Upgrade in place, following the documented steps
        # `down`, not `down -v`. The whole subject of this lane is the volumes, and the one-character
        # difference between an upgrade and a teardown is a plausible edit that leaves every assertion
        # below still passing -- against a stack that started from nothing.
        env:
          TO_VER: ${{ steps.leg.outputs.to_ver }}
        run: |
          set -eu
          cd "$RUNNER_TEMP/tapstate-demo"
          docker compose down
          sed -i.bak "s|ghcr.io/tapstate/tapstate:.*|ghcr.io/tapstate/tapstate:$TO_VER|" docker-compose.yml
          curl -sSL https://install.tapstate.dev/cli | TAPSTATE_INSTALL_DIR=. TAPSTATE_VERSION="$TO_VER" sh
          docker compose up -d
          i=0
          until [ "$(curl -fsS http://127.0.0.1:8080/healthz 2>/dev/null || true)" = ok ]; do
            i=$((i + 1))
            [ "$i" -lt 120 ] || {
              echo "the upgraded server did not come up" >&2
              docker compose logs server --tail 200 >&2
              exit 1
            }
            sleep 1
          done
          # Nothing is started by hand here, and the step that used to do it was wrong twice over. The
          # store keeps the pipeline's desired state across the restart, and the server reconciles
          # actual toward desired on a timer, so the pipeline is meant to come back on its own -- and
          # a `start` is refused outright ("Cannot start a pipeline in state RUNNING"), because the
          # verb reads that same desired state and it never stopped saying RUNNING.
          #
          # Whether it does come back is what the change-data-capture step below asks, and it is the
          # question this whole lane was added for. Do not answer it here with a `stop` followed by a
          # `start`: that would make this lane green over a pipeline the upgrade did not resume, and
          # `stop` discards the progress that resuming is supposed to preserve.

      - name: The new release is what is running, and the old data is still there
        env:
          TO_VER: ${{ steps.leg.outputs.to_ver }}
          DB: ${{ steps.leg.outputs.db }}
        run: |
          set -eu
          cd "$RUNNER_TEMP/tapstate-demo"
          # The container's image, not the compose file's: editing the file is the step above, and
          # re-reading it would only prove the sed ran.
          cid="$(docker compose ps -q server)"
          [ -n "$cid" ] || { echo "no server container is running after the upgrade" >&2; exit 1; }
          running="$(docker inspect --format '{{.Config.Image}}' "$cid")"
          [ "$running" = "ghcr.io/tapstate/tapstate:$TO_VER" ] || {
            echo "the stack is running $running, but the upgrade was to $TO_VER" >&2
            exit 1
          }
          version="$(./tapstate --version)"
          case "$version" in
            *"$TO_VER"*) echo "cli: $version" ;;
            *) echo "the CLI still reports '$version' after upgrading to $TO_VER" >&2; exit 1 ;;
          esac
          uri="mongodb://mongo:27017/$DB?directConnection=true"
          now="$(docker compose exec -T mongo mongosh --quiet "$uri" \
            --eval 'db.order_state.countDocuments()' | tr -d '[:space:]')"
          want="$(cat "$RUNNER_TEMP/before.count")"
          [ "$now" = "$want" ] || {
            echo "the target held $want documents before the upgrade and holds $now after it" >&2
            exit 1
          }
          echo "carried over: $now documents, and the store the older server wrote is the one this reads"

      - name: The same smoke still works on the upgraded stack
        env:
          DB: ${{ steps.leg.outputs.db }}
          PIPELINE: ${{ steps.leg.outputs.pipeline }}
        run: |
          set -eu
          cd "$RUNNER_TEMP/tapstate-demo"
          uri="mongodb://mongo:27017/$DB?directConnection=true"
          await() {
            i=0
            while [ "$i" -lt 90 ]; do
              if docker compose exec -T mongo mongosh --quiet "$uri" --eval "quit($2 ? 0 : 1)" >/dev/null 2>&1; then
                echo "cdc: $1 reached the target"
                return 0
              fi
              i=$((i + 1)); sleep 1
            done
            echo "cdc: $1 never reached the target after the upgrade." >&2
            echo "Nothing here is lost data: the step above showed every document carried over, and" >&2
            echo "'$PIPELINE' is still RUNNING in the store. What stopped is the carrying. The last" >&2
            echo "time this fired, the server log below showed the job restarted and the source" >&2
            echo "connector attached to its position -- so read it for what did happen, not for a" >&2
            echo "crash." >&2
            docker compose logs server --tail 200 >&2
            exit 1
          }
          docker compose exec -T mysql mysql -uroot -psecret appdb -e "INSERT INTO orders VALUES (7,'gina',70.00);"
          await 'an order added after the upgrade' 'db.order_state.countDocuments({id:7}) === 1'
          docker compose exec -T mysql mysql -uroot -psecret appdb -e "DELETE FROM orders WHERE id=7;"
          await 'that order deleted again' '!db.order_state.countDocuments({id:7})'

      - name: Nothing had to be migrated, and this step says so rather than staying silent
        # No changeset exists in any tree yet, so what the step above proved is that an upgrade with
        # nothing to migrate keeps its data -- which is the whole claim available today, and worth
        # making, because it is the floor every later migration stands on.
        #
        # What it must never become is quietly weaker than it reads. The day a migration runner lands,
        # an upgrade will do work this lane does not look at, and every assertion here would go on
        # passing without ever seeing it. So it refuses then, naming what has to be added, instead of
        # going green over the gap.
        run: |
          set -eu
          if git ls-files | grep -q '/MigrationRunner\.java$'; then
            echo "a migration runner exists now, and this lane still asserts nothing about it." >&2
            echo "An upgrade across a changeset does work no step here reads. Add the assertions --" >&2
            echo "the migration log for this upgrade, and the installed version it advanced to." >&2
            exit 1
          fi
          echo "no migration runner in the tree: this upgrade had no changeset to apply"

      - name: Server log on failure
        if: failure()
        run: |
          cd "$RUNNER_TEMP/tapstate-demo" || exit 0
          docker compose ps -a || true
          docker compose logs server --tail 300 || true

      - name: Teardown
        if: always()
        run: |
          set -eu
          cd "$RUNNER_TEMP/tapstate-demo" 2>/dev/null || exit 0
          docker compose down -v
          cd "$RUNNER_TEMP" && rm -rf tapstate-demo
