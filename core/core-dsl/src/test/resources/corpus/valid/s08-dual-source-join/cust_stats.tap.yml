# Multi-source = id list (X13/X17); join aliases = SQL table names; bare table names are
# unambiguous across the two sources (X11). Minimal composition: source + view (no serve).
# The SQL stays inside the supported subset: one SELECT, one equality join, one row per match.
version: tapstate/v1
kind: pipeline
id: cust_stats
source: [ src_crm, src_erp ]
transforms:
  - id: cust_orders
    type: join
    from: { c: customers, o: orders }
    engine: builtin
    sql: |
      SELECT c.id AS customer_id, o.id AS order_id, o.amount AS amount
      FROM c JOIN o ON o.customer_id = c.id
view:
  id: cust_stats
  from: cust_orders
  primary_key: order_id
  storage: { warm: { collection: cust_stats } }
