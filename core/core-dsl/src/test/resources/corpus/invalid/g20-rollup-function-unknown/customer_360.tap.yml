# Invalid: a rollup field names one function from the library; summ is none of them.
version: tapstate/v1
kind: pipeline
id: customer_360
source: src_ins
transforms:
  - id: clean
    from: [CUSTOMERS]
    type: map
    fields: { customer_id: $CUST_ID, name: $CUST_NAME }
  - id: c360
    type: nest
    from: { customer: clean, policy: POLICIES }
    root:
      from: customer
      key: [customer_id]
      embed:
        - from: policy
          on: { CUST_ID: customer_id }
          as: array
          path: policies
          arrayKey: [POLICY_ID]
          rollup:
            total: { summ: $PREMIUM }
view:
  id: customer_360
  from: c360
  primary_key: customer_id
serve:
  from: customer_360
  query: [ { type: rest } ]
