version: tapstate/v1
kind: pipeline
id: sales_by_region
source: src_orders
transforms:
  - id: sales_by_region_day
    type: aggregate
    from: [orders]
    key: [id]
    where: =after.status != 'cancelled'
    groupBy:
      region: $region
      day: =after.created_day
    fields:
      order_count:
        count: true
      revenue:
        sum: $amount
        default: 0
      big_orders:
        count: true
        filter: =after.amount >= 1000
      max_order:
        max: $amount
      latest_status:
        last:
          value: $status
          by: $updated_at
serve:
  id: serve
  from: sales_by_region_day
  sync:
    - id: dw
      source: tgt_sales
