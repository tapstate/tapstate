summary.source.connection-failed=Tapstate could not access this data source during an operational request. A connection, authentication, or access-permission failure was reported.
summary.pipeline.failed=The pipeline reported an execution failure. Review the captured error and the pipeline's current status before deciding how to resume it.
summary.pipeline.observation-stale=Tapstate has not received a fresh pipeline status observation within the configured time limit. Its current execution state cannot be confirmed.
summary.cluster.node-unavailable=Tapstate is no longer receiving valid availability evidence from this Cluster node. This does not establish whether the process has stopped or its connection was interrupted.
summary.cluster.storage-unavailable=An operation against storage required by this Cluster reported an availability failure. Other resources may also depend on this storage.
summary.generic=Tapstate recorded an alert for this resource. Open the alert to review the detector's evidence.
summary.recovered=Fresh evidence confirmed recovery for this alert. Open the resource to check its current status.
guidance.source.connection-failed=Check that the database service is running and reachable from Tapstate. Review the captured error, then check the saved address, credentials, and permissions for the failed operation.
guidance.pipeline.failed=Open the pipeline and review its current status before restarting. Check its logs and the affected source or destination; preserve its saved progress when resuming.
guidance.pipeline.observation-stale=Check that the hosting node is running and reporting observations. Review pipeline monitoring before changing its state.
guidance.cluster.node-unavailable=Check the node process, its network connection to the Cluster, and its startup logs. Confirm the affected node's state before restarting it.
guidance.cluster.storage-unavailable=Check storage service availability, network access, permissions, and remaining capacity. Review system health for the affected storage role.
guidance.generic=Open the alert details to review its evidence and the resource's current status before taking action.
error.connection-refused=The remote endpoint refused the connection.
error.connection-closed=The remote endpoint closed the connection before the response was complete.
error.response-failed=Tapstate could not receive a response from the remote endpoint.
error.read-timeout=The remote endpoint did not respond before the read timeout.
