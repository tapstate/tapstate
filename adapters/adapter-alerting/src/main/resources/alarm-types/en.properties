pipeline.failed.condition=The current monitored pipeline execution has entered its authoritative FAILED state. A failed reconciliation observation alone does not establish this condition.
pipeline.failed.recovery=The current valid execution is running healthily again with fresh successful observation evidence. Starting, stopping, pausing, completing or removing a pipeline is not recovery evidence.
pipeline.failed.guidance=Inspect the coded failure and the current execution identity. Correct the reported cause and verify fresh successful observations; ignore callbacks from obsolete executions.
pipeline.observation-stale.condition=A pipeline that is currently expected to publish observations has exceeded the allowed observation age, or its trusted startup grace elapsed without an initial observation.
pipeline.observation-stale.recovery=The same valid resource and evaluation generation supplies a fresh valid observation. Repeated old observations do not establish recovery.
pipeline.observation-stale.guidance=Check the observation producer and its expected-publication clock. Paused, stopped, completed or not-yet-running pipelines are excluded. Observation age is not end-to-end synchronization latency or proof of a stalled source.
source.connection-failed.condition=The source's current operational connection reported a classified connectivity, authentication or connection-permission failure while establishing, reconnecting or accessing the required capability.
source.connection-failed.recovery=The same connection binding and failed operation capability supplies fresh successful evidence. TCP reachability, another connection or a manual connection test is insufficient.
source.connection-failed.guidance=Check the saved binding, credentials and the failed operation's permissions. SQL or data errors are separate. Manual connection tests remain diagnostic; no additional high-frequency database probe is implied. Without new operational evidence, preserve the fault and expose stale or unknown observation quality.
cluster.node-unavailable.condition=The existing membership or heartbeat failure detector confirms the unexpected loss of a member that was expected to remain in this cluster, after its detection window.
cluster.node-unavailable.recovery=The same monitored member incarnation becomes available again through a trusted source. A same-named replacement does not recover the original member.
cluster.node-unavailable.guidance=Check the member's expected assignment and existing failure-detector evidence. Initial joining and planned retirement are excluded. A stopped process cannot notify by itself; an existing observer and writable alert ledger are required.
cluster.storage-unavailable.condition=While the CONFIG alert ledger is usable, an existing storage access path confirms that another required storage binding or read/write capability is unavailable.
cluster.storage-unavailable.recovery=The same storage binding and failed capability supplies fresh successful evidence. Ping success or access to another database is insufficient.
cluster.storage-unavailable.guidance=Inspect the exact storage role, configuration generation and failed capability. Conditional-write conflicts, business validation and source connection faults are separate. If CONFIG cannot be verified, expose collection degradation through available health diagnostics and stop new durable acceptance or send permits; do not bypass the ledger to notify.
