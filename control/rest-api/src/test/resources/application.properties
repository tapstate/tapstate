# Every web context booted by this module's tests binds the loopback address explicitly, and the tests
# dial that same literal address.
#
# Asking only for a free port (server.port=0) binds the wildcard, and a wildcard bind does not reserve
# 127.0.0.1:<port>: the kernel hands it out even when another local process already holds that port on
# the loopback alone, and a connection to 127.0.0.1 is then routed to that more specific holder. The
# server comes up, reports the port it was given, and answers nothing the tests ask it -- every route
# comes back with whatever bare status the stranger returns, which reads as the feature under test being
# broken rather than as a port collision. Binding the loopback makes the collision impossible: the port
# allocator will not hand out a loopback port that is already taken.
#
# This sits in a config file rather than at each call site so a test class added later inherits it. It
# outranks SpringApplicationBuilder.properties(...), which populates the lowest-ranked source Spring has.
server.address=127.0.0.1
