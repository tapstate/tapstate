# A source says which database to read and which tables to read from it.
# Every value below is a placeholder: replace them, then run `tapstate validate`.
version: tapstate/v1
kind: source
id: example_source
# Any id that `tapstate connectors` lists; mysql is only a starting point.
connector: mysql
# The password is a reference, never a literal: put EXAMPLE_SOURCE_PASSWORD=... in a .env file
# beside this one, and keep that .env out of version control.
config: { host: your-database-host, port: "3306", database: your_database, username: your_user, password: "${EXAMPLE_SOURCE_PASSWORD}" }
# snapshot | cdc | snapshot_and_cdc
mode: cdc
tables: [ your_table ]
